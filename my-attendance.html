<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>宏升工業社｜我的出勤與加班</title><style>
:root{--navy:#073b7a;--orange:#f06a0a;--muted:#68778a;--line:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172638;font-family:"Microsoft JhengHei",system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #f06a0a;outline-offset:3px}.demo{background:#fff0e4;color:#914003;padding:10px 18px;text-align:center;font-size:12px}header{background:var(--navy);color:white;padding:26px max(20px,calc((100vw - 900px)/2));}.brand{font-size:13px;color:#c9d9ee;letter-spacing:2px}h1{font-size:28px;margin:12px 0 6px}.identity{display:flex;justify-content:space-between;align-items:center;gap:12px}.identity p{font-size:13px;color:#cfdef0}.pill{font-size:12px;background:#ffffff18;padding:8px 12px;border-radius:30px;white-space:nowrap}main{max-width:940px;margin:auto;padding:24px 20px 48px}.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.month label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}select{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--navy);font-weight:bold}.updated{font-size:11px;color:var(--muted);text-align:right;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;border:1px solid var(--line);border-radius:12px;padding:18px 16px;border-bottom:3px solid var(--navy)}.stat:nth-child(2){border-bottom-color:var(--orange)}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:28px;margin:12px 0 7px;color:var(--navy)}.stat small{font-size:12px;font-weight:normal;margin-left:5px}.stat p{font-size:11px;color:var(--muted);margin:0}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-top:26px}.tabs button{flex:1;padding:15px 4px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:bold}.tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--orange)}.section-head{margin:24px 0 14px}.section-head h2{font-size:18px;margin:0 0 7px}.section-head p{font-size:12px;color:var(--muted);line-height:1.7;margin:0}.card{background:white;border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.date{font-weight:bold;font-size:15px}.date small{font-weight:normal;color:var(--muted);margin-left:8px}.tag{font-size:11px;background:#e7eff9;color:var(--navy);padding:5px 8px;border-radius:5px;white-space:nowrap}.tag.orange{color:#a14d0d;background:#fff0e4}.tag.red{color:#a33737;background:#fbeaea}.times{display:flex;align-items:center;gap:20px;margin:20px 0 4px}.times b{font-size:22px;font-weight:600}.times span{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.arrow{color:#bcc8d6;flex:1;text-align:center}.note{font-size:12px;color:var(--muted);line-height:1.8;margin:14px 0 0;border-top:1px solid #edf1f5;padding-top:12px}.total{color:var(--navy);font-size:18px;font-weight:bold}.detail{font-size:13px;line-height:1.9;color:#405268;margin-top:12px}.detail strong{color:#172638}.reason{background:#fff5f4;border-radius:7px;padding:12px;color:#993a3a;font-size:12px;line-height:1.8;margin-top:12px}summary{cursor:pointer;color:var(--navy);font-size:12px;padding-top:12px}.foot{color:var(--muted);font-size:11px;line-height:1.9;text-align:center;margin-top:26px}.empty{text-align:center;padding:45px 15px;color:var(--muted);background:white;border-radius:12px}.empty b{display:block;color:var(--navy);margin-bottom:10px}@media(max-width:600px){header{padding:22px 20px}.stats{grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:14px}.stat strong{font-size:26px;margin:8px 0}.pill{font-size:10px;padding:7px 9px}main{padding-top:18px}.card{padding:16px}.updated{max-width:130px}.tabs button{font-size:14px}}

/* 手機易讀版：正文至少 16px，時間及操作加大 */
body{font-size:18px;line-height:1.65}
.demo{font-size:16px;line-height:1.7}
.brand{font-size:18px}h1{font-size:32px}
.identity p{font-size:18px}.pill{font-size:16px;white-space:normal}
.updated{font-size:16px;line-height:1.7}
.month>div>span{font-size:18px!important}#month{font-size:24px!important}
.stat{padding:18px}.stat span{font-size:18px}.stat strong{font-size:34px}.stat small{font-size:18px}.stat p{font-size:16px;line-height:1.7}
.tabs button{font-size:20px;min-height:58px;padding:16px 6px}
.section-head h2{font-size:24px}.section-head p{font-size:18px;line-height:1.8}
.date{font-size:20px}.date small{font-size:17px}.tag{font-size:16px;white-space:normal;line-height:1.6}
.times b{font-size:32px}.times span{font-size:19px}.times{gap:14px}
.note{font-size:18px;line-height:1.85}.total{font-size:24px}
.detail{font-size:20px;line-height:1.9}.reason{font-size:18px;line-height:1.9}
summary{font-size:18px;min-height:48px;padding:12px 0}.foot{font-size:16px;line-height:1.85}
.row{flex-wrap:wrap}.card{padding:20px}
@media(max-width:600px){
 main{padding:18px 16px 36px}header{padding:22px 16px}
 .identity{flex-wrap:wrap}.identity p{font-size:18px}.pill{font-size:16px}
 .month{flex-wrap:wrap;gap:12px}.updated{max-width:none;text-align:left}
 .stats{gap:10px}.stat{padding:14px}.stat strong{font-size:32px}
 .stats .stat:last-child{grid-column:1/-1}
 .tabs button{font-size:20px}.card{padding:18px 16px}
 .date small{display:inline-block}.times b{font-size:30px}
}

[hidden]{display:none!important}.refresh{min-height:48px;padding:8px 18px;border:1px solid #073b7a;color:#073b7a;background:white;border-radius:8px;font:inherit}.times b{overflow-wrap:anywhere}.detail{overflow-wrap:anywhere}</style></head><body>
<header><div class="brand">宏升工業社</div><div class="identity"><div><h1>我的出勤與加班</h1><p id="person">正在確認 LINE 身分…</p></div><span class="pill">個人專屬查詢</span></div></header>
<main><p id="status" role="status" aria-live="polite">讀取中，請稍候。</p><button id="retry" class="refresh" hidden>重新讀取</button><div id="data" hidden><div class="month"><div><span style="display:block">本月紀錄</span><strong id="month"></strong></div><div class="updated" id="updated"></div><button id="refresh" class="refresh">重新整理</button></div>
<div class="stats"><article class="stat"><span>出勤天數</span><strong id="days"></strong><p>依有上下班紀錄的日期計算</p></article><article class="stat"><span>加班時數</span><strong id="hours"></strong><p>含晚回來；不含未休息補登</p></article><article class="stat"><span>未休息補登</span><strong id="makeups"></strong><p>依補登專區紀錄列示</p></article></div>
<nav class="tabs" role="tablist" aria-label="出勤紀錄類別"><button id="tab-work" role="tab" aria-controls="panel" data-tab="work" aria-selected="true">正常出勤</button><button id="tab-overtime" role="tab" aria-controls="panel" data-tab="overtime" aria-selected="false">加班</button><button id="tab-makeup" role="tab" aria-controls="panel" data-tab="makeup" aria-selected="false">補登</button></nav><section id="panel" role="tabpanel" tabindex="0" aria-labelledby="tab-work"></section></div><p class="foot">時數及出勤狀態依人事資料顯示。<br>資料如有疑問，請聯絡人事協助確認。</p></main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>'use strict';
const LIFF_ID='2010875519-8AL8Aq1Q';
const API_URL='https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec';
const RETURN_URL='https://hs2026work-ai.github.io/punch-card/my-attendance.html';
let records=null,current='work',busy=false;
const $=id=>document.getElementById(id);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function val(v){return esc(v||'—');}
function time(v){const m=String(v||'').match(/(?:^|\s|T)(\d{1,2}):(\d{2})/);return m?m[1].padStart(2,'0')+':'+m[2]:String(v||'—');}
function span(label,v){return '<div><span>'+esc(label)+'</span><b>'+esc(time(v))+'</b></div>';}
function amount(v){return v===null?'待確認':String(Math.round(v*100)/100);}
function render(){
 const config={work:['每日正常出勤','上下班時間、時數與狀態，依出勤資料顯示。'],overtime:['我的加班紀錄','包含晚回來產生的加班；未休息補登另外列示。'],makeup:['我的補登紀錄','中午未休息、下午未休息等紀錄，依補登專區顯示。']};
 document.querySelectorAll('[data-tab]').forEach(b=>{const on=b.dataset.tab===current;b.setAttribute('aria-selected',String(on));b.tabIndex=on?0:-1;});
 $('panel').setAttribute('aria-labelledby','tab-'+current);
 let html='<div class="section-head"><h2>'+config[current][0]+'</h2><p>'+config[current][1]+'</p></div>';
 const rows=records[current];
 html+=rows.length?rows.map(r=>{
 let content='<article class="card"><div class="row"><span class="date">'+esc(r.date.replaceAll('-','/'))+'</span>';
 if(current==='work'){
 content+='<span class="tag">'+val(r['出勤狀態'])+'</span></div><div class="times">'+span('上班',r['上班時間'])+'<div class="arrow">→</div>'+span('下班',r['下班時間'])+'</div><div class="detail">出勤時數：'+val(r['出勤總時數'])+'<br>日別：'+val(r['日別'])+'</div>';
 const notes=[];if(r['遲到分鐘']&&Number(r['遲到分鐘'])!==0)notes.push('遲到 '+esc(r['遲到分鐘'])+' 分鐘');if(r['早退分鐘']&&Number(r['早退分鐘'])!==0)notes.push('早退 '+esc(r['早退分鐘'])+' 分鐘');if(notes.length)content+='<p class="note">'+notes.join(' · ')+'</p>';
 }else if(current==='overtime'){
 content+='<span class="total">'+val(r['加班時數'])+' 小時</span></div><div class="times">'+span('加班開始',r['加班開始'])+'<div class="arrow">→</div>'+span('加班結束',r['加班結束'])+'</div><div class="detail">開始：'+val(r['加班開始'])+'<br>結束：'+val(r['加班結束'])+'<br>日別：'+val(r['日別'])+'</div>';
 }else{
 content+='<span class="tag">'+val(r['異常原因'])+'</span></div><div class="detail">補登時數：<strong>'+val(r['加班時數'])+' 小時</strong><br>紀錄時間：'+val(r['下班時間/加班結束時間'])+'</div>';
 }
 return content+'</article>';
 }).join(''):'<div class="empty"><b>本月尚無紀錄</b>此分類目前沒有可顯示的資料。</div>';
 $('panel').innerHTML=html;
}
async function load(){
 if(busy)return;busy=true;records=null;$('data').hidden=true;$('retry').hidden=true;$('status').hidden=false;$('status').textContent='正在讀取本月資料…';$('person').textContent='正在確認 LINE 身分…';
 try{
 if(!window.liff)throw Error('LINE 元件未載入，請重新開啟。');
 await liff.init({liffId:LIFF_ID});
 if(!liff.isLoggedIn()){liff.login({redirectUri:RETURN_URL});return;}
 const token=liff.getAccessToken();if(!token)throw Error('LINE 登入已失效，請關閉後重新從 LINE 開啟。');
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),30000);let text;
 try{const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'personalAttendance',accessToken:token}),signal:controller.signal});if(!response.ok)throw Error('查詢服務暫時無法使用（HTTP '+response.status+'）。');text=await response.text();}finally{clearTimeout(timer);}
 let result;try{result=JSON.parse(text);}catch(_){throw Error('查詢服務尚未更新，請人事確認 Apps Script 已部署新版本。');}
 if(result.status!=='success')throw Error(result.message||'讀取失敗，請聯絡人事。');
 if(!['work','overtime','makeup'].every(k=>Array.isArray(result[k]))||!/^\d{4}-\d{2}$/.test(result.month))throw Error('資料格式不完整，請聯絡人事。');
 records=result;$('person').textContent=result.name+' · '+result.empId;
 $('month').textContent=result.month.slice(0,4)+' 年 '+Number(result.month.slice(5))+' 月';$('updated').textContent='讀取時間：'+result.readAt;
 const days=new Set(result.work.filter(r=>r['上班時間']||r['下班時間']).map(r=>r.date)).size;
 $('days').textContent=days+' 天';$('makeups').textContent=result.makeup.length+' 筆';
 const total=result.overtime.every(r=>typeof r.hours==='number'&&Number.isFinite(r.hours))?result.overtime.reduce((n,r)=>n+r.hours,0):null;
 $('hours').textContent=total===null?'待確認':amount(total)+' 小時';render();$('status').hidden=true;$('data').hidden=false;
 }catch(e){$('person').textContent='尚未載入個人資料';$('status').textContent=e.name==='AbortError'?'連線逾時，請再試一次。':String(e.message||'讀取失敗');$('retry').hidden=false;}finally{busy=false;}
}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{current=b.dataset.tab;if(records)render();});
document.querySelector('.tabs').onkeydown=e=>{const bs=[...document.querySelectorAll('[data-tab]')];let n=bs.indexOf(document.activeElement);if(n<0||!['ArrowRight','ArrowLeft','Home','End'].includes(e.key))return;e.preventDefault();n=e.key==='Home'?0:e.key==='End'?bs.length-1:(n+(e.key==='ArrowRight'?1:bs.length-1))%bs.length;bs[n].click();bs[n].focus();};
$('retry').onclick=load;$('refresh').onclick=load;load();
</script></body></html>
