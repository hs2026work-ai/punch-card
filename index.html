<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏升工業社 - 打卡專用掃描機</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #1b2a5e;
            color: white;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 5px; font-size: 24px; text-align: center; }
        
        /* 即時時間顯示區 */
        #clock {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            margin: 10px 0 15px 0;
            letter-spacing: 1px;
        }

        #reader {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .status {
            margin-top: 15px;
            font-size: 16px;
            color: #00ffcc;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>宏升工業社 - 打卡掃描</h1>
    
    <!-- 時間顯示在標題底下、鏡頭上方 -->
    <div id="clock">正在讀取時間...</div>

    <!-- QR Code 相機畫面 -->
    <div id="reader"></div>
    <div class="status" id="status-text">請將員工 QR Code 對準鏡頭</div>

    <script>
        // 1. 即時時間更新函數
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('clock').innerText = '📅 ' + timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 啟動 QR Code 掃描器
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById('status-text').innerText = "掃描成功！跳轉中...";
            // 讀取到 QR Code 後跳轉至對應網址/表單
            window.location.href = decodedText;
        }

        function onScanFailure(error) {
            // 掃描尋找中，無視常規失敗
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: { width: 250, height: 250 } },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    </script>

</body>
</html>
