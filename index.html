<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打卡系統</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .info-title { font-size: 1.1rem; color: #666; margin-top: 15px; }
        .info-value { font-size: 1.5rem; font-weight: bold; color: #333; margin-bottom: 10px; }
        #clock { font-size: 1.2rem; font-weight: bold; color: #007bff; background: #eef6ff; padding: 10px; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>打卡簽到</h2>
        
        <div class="info-title">員工編號</div>
        <div id="emp-id" class="info-value">--</div>

        <div class="info-title">員工姓名</div>
        <div id="emp-name" class="info-value">--</div>

        <!-- 日期時間顯示區 -->
        <div id="clock">正在取得時間...</div>
    </div>

    <script>
        // 即時顯示日期與時間
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-TW', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('clock').innerText = '📅 ' + timeString;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
