<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏升工業社 - 打卡專用掃描機</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #1b2a5e;
            color: white;
            margin: 0;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 5px; font-size: 24px; text-align: center; }

        #clock {
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 20px;
            margin: 10px 0 15px 0;
            letter-spacing: 1px;
        }
        #reader {
            width: 100%;
            max-width: 450px;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .status {
            margin-top: 15px;
            font-size: 16px;
            color: #00ffcc;
            text-align: center;
            min-height: 22px;
            padding: 0 10px;
        }
        #retryBtn {
            display: none;
            margin-top: 12px;
            padding: 10px 20px;
            font-size: 15px;
            background: transparent;
            color: #ffcc80;
            border: 1px solid #ffcc80;
            border-radius: 8px;
            cursor: pointer;
        }

        #leaveRequestBtn {
            width: 100%;
            max-width: 450px;
            margin-top: 20px;
            padding: 15px 0;
            font-size: 17px;
            font-weight: bold;
            background: #e0752c;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-sizing: border-box;
            display: block;
        }
        #leaveRequestBtn:active { background: #c9631f; }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 16, 40, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 20px;
            box-sizing: border-box;
        }
        .overlay.show { display: flex; }
        .card {
            background: white;
            color: #333;
            width: 100%;
            max-width: 340px;
            border-radius: 14px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            border-top: 5px solid #e0752c;
        }
        .card h2 {
            margin: 0 0 14px;
            font-size: 24px;
        }
        .card .line { font-size: 18px; line-height: 1.8; margin: 0; }
        .card .cheer { margin-top: 14px; font-size: 20px; font-weight: bold; color: #e0752c; }
        .card .countdown { margin-top: 16px; font-size: 14px; color: #999; }

        .makeup-section {
            text-align: left;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 14px;
            margin-top: 10px;
        }
        .makeup-label { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 8px; }
        select#makeupSelect {
            width: 100%; padding: 12px; font-size: 17px; margin-bottom: 10px;
            border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;
        }
        .makeup-btn {
            width: 100%; padding: 14px 0; font-size: 18px; margin-top: 4px;
            background: #2e7d32; color: white; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }
        .makeup-btn:active { background: #1b5e20; }

        .mark-afternoon-btn {
            width: 100%; padding: 13px 0; font-size: 16px; margin-top: 14px;
            background: #8d6e63; color: white; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }
        .mark-afternoon-btn:active { background: #5d4037; }

        .divider { color: #999; font-size: 13px; margin: 16px 0 8px; }
        select#reasonSelect {
            width: 100%; padding: 13px; font-size: 18px; margin: 6px 0 14px;
            border-radius: 8px; border: 1px solid #ccc;
        }
        .submit-btn {
            width: 100%; padding: 15px 0; font-size: 18px;
            background: #e0752c; color: white; border: none; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }
        .submit-btn:disabled, .makeup-btn:disabled { background: #ccc; color: #666; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.55); display: none; align-items: center;
            justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: white; border-radius: 14px; max-width: 300px; width: 100%;
            padding: 26px 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); text-align: center;
        }
        .modal-icon { font-size: 42px; margin-bottom: 8px; }
        .modal-title { font-size: 21px; font-weight: bold; color: #1b2a5e; margin-bottom: 12px; }
        .modal-text { font-size: 17px; line-height: 1.6; color: #333; }
        .modal-text.small-note { font-size: 15px; color: #888; margin-top: 8px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 13px 0; font-size: 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
        .modal-btn.cancel { background: #e0e0e0; color: #555; }
        .modal-btn.confirm { background: #2e7d32; color: white; }
        .modal-btn.confirm:disabled { background: #ccc; color: #666; }

        /* ====== 進站授權碼遮罩 ====== */
        #accessGateOverlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #1b2a5e;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
        }
        #accessGateOverlay.hidden { display: none; }
        .gate-box {
            background: white;
            color: #333;
            width: 100%;
            max-width: 320px;
            border-radius: 14px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .gate-box h2 { margin: 0 0 16px; font-size: 20px; color: #1b2a5e; }
        .gate-box input {
            width: 100%; padding: 14px; font-size: 18px; margin-bottom: 12px;
            border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;
            text-align: center; letter-spacing: 2px;
        }
        .gate-box button {
            width: 100%; padding: 14px 0; font-size: 17px; font-weight: bold;
            background: #e0752c; color: white; border: none; border-radius: 8px;
            cursor: pointer;
        }
        .gate-box .gate-error {
            color: #c62828; font-size: 14px; margin-top: 10px; min-height: 18px;
        }
    </style>
</head>
<body>

    <div id="accessGateOverlay">
        <div class="gate-box">
            <h2>🔒 請輸入授權碼</h2>
            <input type="password" id="gateInput" placeholder="授權碼" inputmode="numeric">
            <button type="button" onclick="checkGateCode()">確認</button>
            <div class="gate-error" id="gateError"></div>
        </div>
    </div>

    <h1>宏升工業社 - 打卡掃描</h1>

    <div id="clock">正在讀取時間...</div>
    <div id="reader"></div>
    <div class="status" id="status-text">正在啟動相機...</div>
    <button id="retryBtn" onclick="startScanner();">重新啟動相機</button>

    <a id="leaveRequestBtn" href="https://hs2026work-ai.github.io/punch-card/check-leave-form.html">📝 請假申請 Xin nghi phep</a>

    <div class="overlay" id="resultOverlay">
        <div class="card" id="resultCard"></div>
    </div>

    <div class="overlay" id="reasonOverlay">
        <div class="card">
            <h2 style="color:#c62828;">⚠️ 非正常打卡時間</h2>
            <p class="line" id="reasonInfo"></p>
            <div class="makeup-section">
                <div class="makeup-label">補登</div>
                <select id="makeupSelect"></select>
                <button type="button" class="makeup-btn" onclick="openMakeupModal()">送出補登</button>
            </div>
            <div class="divider">或選擇其他原因</div>
            <select id="reasonSelect"></select>
            <button type="button" class="submit-btn" id="reasonSubmitBtn" onclick="submitReason()">送出</button>
        </div>
    </div>

    <div class="modal-overlay" id="makeupModalOverlay">
        <div class="modal-box">
            <div class="modal-icon" id="makeupModalIcon">🍡</div>
            <div class="modal-title">確認回報</div>
            <div class="modal-text">你選的是：<b id="makeupModalLabel">中午未休息</b></div>
            <div class="modal-text small-note">確定送出嗎？</div>
            <div class="modal-actions">
                <button type="button" class="modal-btn cancel" onclick="closeMakeupModal()">取消</button>
                <button type="button" class="modal-btn confirm" id="makeupConfirmBtn" onclick="submitMakeup()">確定送出</button>
            </div>
        </div>
    </div>

    <script>
        var ACCESS_CODE = '162103';
        var GATE_STORAGE_KEY = 'punchCardAccessGranted_v1';

        function checkGateCode() {
            var input = document.getElementById('gateInput').value.trim();
            var errorEl = document.getElementById('gateError');
            if (input === ACCESS_CODE) {
                localStorage.setItem(GATE_STORAGE_KEY, '1');
                document.getElementById('accessGateOverlay').classList.add('hidden');
                errorEl.innerText = '';
                startScanner();
            } else {
                errorEl.innerText = '授權碼錯誤，請重新輸入';
                document.getElementById('gateInput').value = '';
            }
        }

        document.getElementById('gateInput').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') checkGateCode();
        });

        var FALLBACK_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec";

        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleString('zh-TW', {
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
            document.getElementById('clock').innerText = '📅 ' + timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        const statusEl = document.getElementById('status-text');
        const retryBtn = document.getElementById('retryBtn');
        let html5Qrcode = null;
        let busy = false;

        function onScanSuccess(decodedText) {
            if (busy) return;
            busy = true;
            statusEl.innerText = "✅ 掃描成功，處理中...";
            handleScan(decodedText);
        }

        function onScanFailure() {}

        async function startScanner() {
            retryBtn.style.display = 'none';
            statusEl.innerText = "正在啟動相機...";

            html5Qrcode = new Html5Qrcode("reader");
            const config = { fps: 15, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 };

            try {
                await html5Qrcode.start({ facingMode: "environment" }, config, onScanSuccess, onScanFailure);
                statusEl.innerText = "請將員工 QR Code 對準鏡頭";
            } catch (err) {
                try {
                    const cameras = await Html5Qrcode.getCameras();
                    if (cameras && cameras.length) {
                        const camId = cameras[cameras.length - 1].id;
                        await html5Qrcode.start(camId, config, onScanSuccess, onScanFailure);
                        statusEl.innerText = "請將員工 QR Code 對準鏡頭";
                    } else {
                        throw new Error("no camera");
                    }
                } catch (err2) {
                    statusEl.innerText = "⚠️ 無法啟動相機，請確認已允許相機權限";
                    retryBtn.style.display = 'inline-block';
                }
            }
        }

        function parseScan(rawText) {
            var text = rawText.trim();
            if (text.indexOf('http') === 0) {
                try {
                    var u = new URL(text);
                    var id = u.searchParams.get('id');
                    var base = u.origin + u.pathname;
                    return { base: base, id: id };
                } catch (e) {
                    return { base: FALLBACK_SCRIPT_URL, id: text };
                }
            }
            return { base: FALLBACK_SCRIPT_URL, id: text };
        }

        var currentBase = FALLBACK_SCRIPT_URL;
        var currentId = null;
        var currentTs = null;

        function handleScan(rawText) {
            var parsed = parseScan(rawText);
            if (!parsed.id) {
                showResultCard({ status: 'error', message: '無法辨識這組 QR Code' });
                return;
            }
            currentBase = parsed.base;
            currentId = parsed.id;
            currentTs = Date.now();
            callApi({ id: currentId, ts: currentTs });
        }

        function callApi(params) {
            var url = currentBase + '?mode=api'
                + '&id=' + encodeURIComponent(params.id)
                + '&ts=' + encodeURIComponent(params.ts)
                + (params.reason ? '&reason=' + encodeURIComponent(params.reason) : '');

            fetch(url)
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.status === 'need_reason') {
                        showReasonCard(data);
                    } else {
                        showResultCard(data);
                    }
                })
                .catch(function (err) {
                    showResultCard({ status: 'error', message: '連線失敗，請確認網路後重新掃描' });
                });
        }

        var successAudio = new Audio('sounds/soundssuccess.wav');
        var errorAudio = new Audio('sounds/soundserror.wav');

        function playSuccessSound() {
            try { successAudio.currentTime = 0; successAudio.play(); } catch (e) {}
        }

        function playErrorSound() {
            try { errorAudio.currentTime = 0; errorAudio.play(); } catch (e) {}
        }

        function showResultCard(data) {
            document.getElementById('reasonOverlay').classList.remove('show');
            document.getElementById('makeupModalOverlay').classList.remove('show');
            var success = data.status === 'success';
            if (success) { playSuccessSound(); } else { playErrorSound(); }
            var card = document.getElementById('resultCard');
            var icon = success ? '✅' : '⚠️';
            var titleColor = success ? '#1b2a5e' : '#c62828';
            var html = '<h2 style="color:' + titleColor + ';">' + icon + ' ' + (success ? '打卡成功' : '無法打卡') + '</h2>';

            var showAfternoonBtn = false;

            if (success) {
                html += '<p class="line">員工編號：' + data.id + '<br>姓名：' + data.name + '<br>狀態：' + data.type + '</p>';
                if (data.reason) html += '<p class="line">原因：' + data.reason + '</p>';
                html += '<p class="line" style="color:#888;font-size:14px;">' + data.time + '</p>';
                if (data.message) html += '<div class="cheer">' + data.message + '</div>';

                if (data.canMarkAfternoonNoBreak) {
                    showAfternoonBtn = true;
                    html += '<button type="button" class="mark-afternoon-btn" onclick="markAfternoonNoBreak(\'' +
                        data.afternoonReason + '\')">☕ 下午（17:00-17:30）沒有休息</button>';
                }
            } else {
                html += '<p class="line">' + (data.message || '發生錯誤，請重新掃描') + '</p>';
            }
            var countdownSeconds = showAfternoonBtn ? 8 : 3;
            html += '<div class="countdown" id="resultCountdown">' + countdownSeconds + ' 秒後恢復掃描</div>';
            card.innerHTML = html;

            document.getElementById('resultOverlay').classList.add('show');
            statusEl.innerText = success ? '打卡完成' : '請重新掃描';

            var n = countdownSeconds;
            var timer = setInterval(function () {
                n--;
                var el = document.getElementById('resultCountdown');
                if (el) el.innerText = n + ' 秒後恢復掃描';
                if (n <= 0) {
                    clearInterval(timer);
                    closeAllOverlaysAndResume();
                }
            }, 1000);
        }

        function markAfternoonNoBreak(reasonVal) {
            callApi({ id: currentId, ts: currentTs, reason: reasonVal });
        }

        var makeupLabels = {};

        function showReasonCard(data) {
            currentTs = data.ts;
            document.getElementById('reasonInfo').innerHTML =
                '員工編號：' + data.id + '<br>姓名：' + data.name;

            var select = document.getElementById('reasonSelect');
            select.innerHTML = '';
            (data.reasons || []).forEach(function (r) {
                var opt = document.createElement('option');
                opt.value = r;
                opt.textContent = r;
                select.appendChild(opt);
            });

            var makeupSelect = document.getElementById('makeupSelect');
            makeupSelect.innerHTML = '';
            makeupLabels = {};

            var lunchOpt = document.createElement('option');
            lunchOpt.value = data.lunchReason;
            lunchOpt.textContent = data.lunchReason;
            makeupSelect.appendChild(lunchOpt);
            makeupLabels[data.lunchReason] = { text: data.lunchReason, icon: '🍡' };

            var afternoonOpt = document.createElement('option');
            afternoonOpt.value = data.afternoonReason;
            afternoonOpt.textContent = data.afternoonReason;
            makeupSelect.appendChild(afternoonOpt);
            makeupLabels[data.afternoonReason] = { text: data.afternoonReason, icon: '☕' };

            document.getElementById('reasonOverlay').classList.add('show');
            statusEl.innerText = '請選擇打卡異常原因';
        }

        function submitReason() {
            var reason = document.getElementById('reasonSelect').value;
            var btn = document.getElementById('reasonSubmitBtn');
            btn.disabled = true;
            btn.innerText = '送出中...';
            callApi({ id: currentId, ts: currentTs, reason: reason });
            setTimeout(function () {
                btn.disabled = false;
                btn.innerText = '送出';
            }, 1500);
        }

        function openMakeupModal() {
            var val = document.getElementById('makeupSelect').value;
            var info = makeupLabels[val] || { text: val, icon: '📝' };
            document.getElementById('makeupModalLabel').innerText = info.text;
            document.getElementById('makeupModalIcon').innerText = info.icon;
            document.getElementById('makeupModalOverlay').classList.add('show');
        }
        function closeMakeupModal() {
            document.getElementById('makeupModalOverlay').classList.remove('show');
        }
        function submitMakeup() {
            var btn = document.getElementById('makeupConfirmBtn');
            btn.disabled = true;
            btn.innerText = '送出中...';
            var val = document.getElementById('makeupSelect').value;
            callApi({ id: currentId, ts: currentTs, reason: val });
            setTimeout(function () {
                closeMakeupModal();
                btn.disabled = false;
                btn.innerText = '確定送出';
            }, 1500);
        }

        function closeAllOverlaysAndResume() {
            document.getElementById('resultOverlay').classList.remove('show');
            document.getElementById('reasonOverlay').classList.remove('show');
            document.getElementById('makeupModalOverlay').classList.remove('show');
            statusEl.innerText = '請將員工 QR Code 對準鏡頭';
            busy = false;
        }

        if (localStorage.getItem(GATE_STORAGE_KEY) === '1') {
            document.getElementById('accessGateOverlay').classList.add('hidden');
            startScanner();
        }
    </script>
</body>
</html>
