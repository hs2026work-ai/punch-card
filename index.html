<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宏升工業社 - 打卡專用掃描機</title>
<style>
body {
font-family: "Microsoft JhengHei", Arial, sans-serif;
background: #1b2a5e;
color: white;
margin: 0;
padding: 20px 10px;
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
box-sizing: border-box;
}
h1 { margin-bottom: 5px; font-size: 24px; text-align: center; }

#clock {
font-size: 18px;
font-weight: bold;
color: #ffd700;
background: rgba(255, 255, 255, 0.1);
padding: 8px 16px;
border-radius: 20px;
margin: 10px 0 15px 0;
letter-spacing: 1px;
}
.status {
margin-top: 15px;
font-size: 20px;
font-weight: bold;
color: #00ffcc;
text-align: center;
min-height: 22px;
padding: 20px 10px;
}

#leaveRequestBtn {
width: 100%;
max-width: 450px;
margin-top: 20px;
padding: 15px 0;
font-size: 17px;
font-weight: bold;
background: #e0752c;
color: white;
border: none;
border-radius: 10px;
cursor: pointer;
text-decoration: none;
text-align: center;
box-sizing: border-box;
display: block;
}
#leaveRequestBtn:active { background: #c9631f; }

.overlay {
position: fixed;
top: 0; left: 0; width: 100%; height: 100%;
background: rgba(10, 16, 40, 0.92);
display: none;
align-items: center;
justify-content: center;
z-index: 999;
padding: 20px;
box-sizing: border-box;
}
.overlay.show { display: flex; }
.card {
background: white;
color: #333;
width: 100%;
max-width: 340px;
border-radius: 14px;
padding: 30px 24px;
text-align: center;
box-shadow: 0 10px 30px rgba(0,0,0,0.4);
border-top: 5px solid #e0752c;
}
.card h2 {
margin: 0 0 14px;
font-size: 24px;
}
.card .line { font-size: 18px; line-height: 1.8; margin: 0; }
.card .cheer { margin-top: 14px; font-size: 20px; font-weight: bold; color: #e0752c; }
.card .countdown { margin-top: 16px; font-size: 14px; color: #999; }

/* ====== 【新增】07:30前打卡提醒補登「提前上班」的通知框 ====== */
.early-reminder-box {
margin-top: 14px;
padding: 12px 14px;
background: #fff3e0;
border: 1px solid #e0752c;
border-radius: 8px;
color: #7a4400;
font-size: 15px;

text-align: left;
}

.makeup-section {

background: #f5f5f5;
border: 1px solid #ddd;

.makeup-label { font-size: 16px; font-weight: bold; color: #333; margin-bottom: 8px; }
select#makeupSelect {

border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;
}
.makeup-btn {
width: 100%; padding: 14px 0; font-size: 18px; margin-top: 4px;
background: #2e7d32; color: white; border: none; border-radius: 8px;
font-weight: bold; cursor: pointer;
}
.makeup-btn:active { background: #1b5e20; }

.mark-afternoon-btn {
width: 100%; padding: 13px 0; font-size: 16px; margin-top: 14px;
background: #8d6e63; color: white; border: none; border-radius: 8px;
font-weight: bold; cursor: pointer;
}
.mark-afternoon-btn:active { background: #5d4037; }

.mark-early-btn {
width: 100%; padding: 13px 0; font-size: 16px; margin-top: 14px;
background: #3a5a9c; color: white; border: none; border-radius: 8px;
font-weight: bold; cursor: pointer;
}
.mark-early-btn:active { background: #24406f; }

.divider { color: #999; font-size: 13px; margin: 16px 0 8px; }
select#reasonSelect {
width: 100%; padding: 13px; font-size: 18px; margin: 6px 0 14px;
border-radius: 8px; border: 1px solid #ccc;
}
.submit-btn {
width: 100%; padding: 15px 0; font-size: 18px;
background: #e0752c; color: white; border: none; border-radius: 8px;
font-weight: bold; cursor: pointer;
}
.submit-btn:disabled, .makeup-btn:disabled { background: #ccc; color: #666; }

.modal-overlay {
position: fixed; top: 0; left: 0; width: 100%; height: 100%;
background: rgba(0,0,0,0.55); display: none; align-items: center;
justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box;
}
.modal-overlay.show { display: flex; }
.modal-box {
background: white; border-radius: 14px; max-width: 300px; width: 100%;
padding: 26px 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); text-align: center;
}
.modal-icon { font-size: 42px; margin-bottom: 8px; }
.modal-title { font-size: 21px; font-weight: bold; color: #1b2a5e; margin-bottom: 12px; }
.modal-text { font-size: 17px; line-height: 1.6; color: #333; }
.modal-text.small-note { font-size: 15px; color: #888; margin-top: 8px; }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-btn { flex: 1; padding: 13px 0; font-size: 16px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
.modal-btn.cancel { background: #e0e0e0; color: #555; }

.modal-btn.confirm:disabled { background: #ccc; color: #666; }

.early-time-row {

gap: 10px; margin: 14px 0 4px;
}
.early-time-row select {

}

.overtime-out-field {

margin-top: 12px;

.overtime-out-field label {

font-size: 15px;
font-weight: bold;
color: #555;
margin-bottom: 6px;

.overtime-out-field select,

padding: 12px;
font-size: 17px;
border-radius: 8px;
border: 1px solid #ccc;
box-sizing: border-box;

background: white;
}
.overtime-out-field textarea {

/* ====== 【新增】獨立補登入口按鈕（不觸發正式打卡） ====== */

width: 100%;
max-width: 450px;
margin-top: 12px;

font-size: 15px;
font-weight: bold;
background: #3a5a9c;
color: white;
border: none;
border-radius: 10px;
cursor: pointer;

#soundToggleBtn:active { background: rgba(255,255,255,0.22); }

/* ====== 進站授權碼遮罩 ====== */

position: fixed;
top: 0; left: 0; width: 100%; height: 100%;

display: flex;
align-items: center;

padding: 20px;

.gate-box {
background: white;
color: #333;
width: 100%;

border-radius: 14px;
padding: 30px 24px;

}

</head>

<script>
var ACCESS_CODE = '162103';
var GATE_STORAGE_KEY = 'punchCardAccessGranted_v1';

function checkGateCode() {
var input = document.getElementById('gateInput').value.trim();
var errorEl = document.getElementById('gateError');
if (input === ACCESS_CODE) {

successAudio.currentTime = 0;

successAudio.play()
.then(function () {
successAudio.pause();
successAudio.currentTime = 0;
})
.catch(function (e) {
console.log("unlock failed", e);
});

localStorage.setItem(GATE_STORAGE_KEY, '1');

unlockAudio();

localStorage.setItem(GATE_STORAGE_KEY, '1');
document.getElementById('accessGateOverlay').classList.add('hidden');
errorEl.innerText = '';
} else {
errorEl.innerText = '授權碼錯誤，請重新輸入';
document.getElementById('gateInput').value = '';
}
}

document.getElementById('gateInput').addEventListener('keydown', function (e) {
if (e.key === 'Enter') checkGateCode();
});

var FALLBACK_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec";

function updateClock() {
const now = new Date();
const timeString = now.toLocaleString('zh-TW', {
year: 'numeric', month: '2-digit', day: '2-digit',
hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
});
document.getElementById('clock').innerText = '📅 ' + timeString;
}
setInterval(updateClock, 1000);
updateClock();

const statusEl = document.getElementById('status-text');
let busy = false;

function parseScan(rawText) {
var text = rawText.trim();
if (text.indexOf('http') === 0) {
try {
var u = new URL(text);
var id = u.searchParams.get('id');
var base = u.origin + u.pathname;
return { base: base, id: id };
} catch (e) {
return { base: FALLBACK_SCRIPT_URL, id: text };
}
}
return { base: FALLBACK_SCRIPT_URL, id: text };
}

var currentBase = FALLBACK_SCRIPT_URL;
var currentId = null;
var currentTs = null;

// ====== 【新增】加班結束判定區間（要跟 Code.gs 的 TIME_WINDOWS 保持一致）======
var OVERTIME_END_WINDOW_START = '17:25';
var OVERTIME_END_WINDOW_END = '20:50';

function toMinutesJS(hhmm) {
var parts = hhmm.split(':');
return Number(parts[0]) * 60 + Number(parts[1]);
}

function isInOvertimeEndWindow(dateObj) {
var minutes = dateObj.getHours() * 60 + dateObj.getMinutes();
return minutes >= toMinutesJS(OVERTIME_END_WINDOW_START) && minutes <= toMinutesJS(OVERTIME_END_WINDOW_END);
}

function showOvertimeEndChoice() {
document.getElementById('overtimeEndChoiceOverlay').classList.add('show');
statusEl.innerText = '請選擇：繼續加班或結束加班';
}

function closeOvertimeEndChoice() {
document.getElementById('overtimeEndChoiceOverlay').classList.remove('show');
}

// ====== 【修改】「還要繼續加班」改為打開補登選單，讓員工自己選要補登哪一項 ======
function chooseContinueOvertime() {
closeOvertimeEndChoice();
openContinueOvertimeMakeup();
}

function chooseEndOvertime() {
closeOvertimeEndChoice();
// 維持原本的正常流程，讓後端依時間區間判定為「加班結束」
callApi({ id: currentId, ts: currentTs });
}

function cancelOvertimeEndChoice() {
closeOvertimeEndChoice();
statusEl.innerText = '📷 請感應員工 QR Code';
busy = false;
}

function handleScan(rawText) {
  var now = Date.now();
  if (busy) return;
  busy = true;

  var parsed = parseScan(rawText);

  // 檢查是否為有效的員工編號格式：HS + 三碼數字（HS001 ~ HS999）
  var validIdPattern = /^HS\d{3}$/;

  if (!parsed.id || !validIdPattern.test(parsed.id)) {
    showResultCard({
      status: 'error',
      message: '掃描內容異常，請確認電腦輸入法為英文模式後重新掃描'
    });
    return;
  }

  playSuccessSound();
  statusEl.innerText = "✅ 已掃描，資料處理中...";

  currentBase = parsed.base;
  currentId = parsed.id;
  currentTs = now;

  // ====== 【新增】落在加班結束區間，先讓員工選擇要繼續加班還是真的下班 ======
  if (isInOvertimeEndWindow(new Date(now))) {
    showOvertimeEndChoice();
    return;
  }

  callApi({ id: currentId, ts: currentTs });
}
function callApi(params) {
            var url = currentBase + '?mode=api'
                + '&id=' + encodeURIComponent(params.id)
                + '&ts=' + encodeURIComponent(params.ts)
    var safeTs = Number(params.ts);

    if (!Number.isFinite(safeTs) || safeTs <= 0) {
        safeTs = Date.now();
    }

    var url = currentBase + '?mode=api'
        + '&id=' + encodeURIComponent(params.id)
        + '&ts=' + encodeURIComponent(safeTs)
+ (params.reason ? '&reason=' + encodeURIComponent(params.reason) : '')
+ (params.earlyTime ? '&earlyTime=' + encodeURIComponent(params.earlyTime) : '')
+ (params.overtimeOutMode ? '&overtimeOutMode=' + encodeURIComponent(params.overtimeOutMode) : '')
+ (params.overtimeOutTime ? '&overtimeOutTime=' + encodeURIComponent(params.overtimeOutTime) : '')
+ (params.overtimeOutMemo ? '&overtimeOutMemo=' + encodeURIComponent(params.overtimeOutMemo) : '');

fetch(url)
.then(function (r) { return r.json(); })
.then(function (data) {
if (data.status === 'need_reason') {
showReasonCard(data);
} else {
showResultCard(data);
}
})
.catch(function (err) {

function parseHHMM(value, fallback) {
var text = /^\d{2}:\d{2}$/.test(value || '') ? value : fallback;
var parts = text.split(':');
return { hour: Number(parts[0]), minute: Number(parts[1]) };
}

function pad2(value) {
return String(value).padStart(2, '0');
}

function refreshEarlyMinuteOptions(preferredMinute) {
var hourSelect = document.getElementById('earlyHourSelect');
var minuteSelect = document.getElementById('earlyMinuteSelect');
var minTime = parseHHMM(currentEarlyMinTime, '05:00');
var maxTime = parseHHMM(currentEarlyMaxTime, '07:59');
var selectedHour = Number(hourSelect.value);
var wanted = preferredMinute === undefined ? Number(minuteSelect.value) : Number(preferredMinute);

minuteSelect.innerHTML = '';

[0, 30].forEach(function (minute) {
var total = selectedHour * 60 + minute;
var minTotal = minTime.hour * 60 + minTime.minute;
var maxTotal = maxTime.hour * 60 + maxTime.minute;

if (total >= minTotal && total <= maxTotal) {
var opt = document.createElement('option');
opt.value = pad2(minute);
opt.textContent = pad2(minute) + ' 分';
minuteSelect.appendChild(opt);
}
});

if (!minuteSelect.options.length) return;

var preferredValue = wanted >= 30 ? '30' : '00';
var hasPreferred = Array.from(minuteSelect.options).some(function (opt) {
return opt.value === preferredValue;
});

minuteSelect.value = hasPreferred
? preferredValue
: minuteSelect.options[0].value;
}

function prepareEarlyTimeSelects() {
var hourSelect = document.getElementById('earlyHourSelect');
var minTime = parseHHMM(currentEarlyMinTime, '05:00');
var maxTime = parseHHMM(currentEarlyMaxTime, '07:59');
var defaultTime = parseHHMM(currentEarlyDefaultTime, '07:00');

hourSelect.innerHTML = '';
for (var hour = minTime.hour; hour <= maxTime.hour; hour++) {
var opt = document.createElement('option');
opt.value = pad2(hour);
opt.textContent = pad2(hour) + ' 點';
hourSelect.appendChild(opt);
}

var defaultHour = Math.min(Math.max(defaultTime.hour, minTime.hour), maxTime.hour);
hourSelect.value = pad2(defaultHour);
refreshEarlyMinuteOptions(defaultTime.minute);
}

function escapeText(value) {
return String(value || '')
.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;')
.replace(/'/g, '&#39;');
}

var validIdPattern = /^HS\d{3}$/;

return;
}

currentId = idInput;

// skipMakeupIdInput 為 true 時，沿用掃描時已設定好的 currentId / currentTs

}

// 「加班（外出）」需選擇提前上班／晚回來、時間及事由

currentOvertimeOutReason = STANDALONE_OVERTIME_OUT_REASON;

return;

callApi({ id: currentId, ts: currentTs, reason: reason });
}

<script>
(function () {
  var scannerInput = document.createElement('input');
  scannerInput.type = 'text';
  scannerInput.id = 'xbr60Input';
  scannerInput.style.position = 'absolute';
  scannerInput.style.opacity = '0';
  scannerInput.style.pointerEvents = 'none';

  var buffer = '';

  function refocusScanner() {
    var gateVisible = !document.getElementById('accessGateOverlay').classList.contains('hidden');
    var anyOverlayShown = document.querySelector('.overlay.show, .modal-overlay.show');
    if (!gateVisible && !anyOverlayShown) {
      scannerInput.focus();
    }
  }

  window.addEventListener('load', refocusScanner);
  document.body.addEventListener('click', refocusScanner);

  scannerInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var scanned = buffer.trim();
      buffer = '';
      scannerInput.value = '';
      if (scanned) {
        handleScan(scanned);
      }
    }
  });

  scannerInput.addEventListener('input', function () {
    buffer = scannerInput.value;
  });

  setInterval(refocusScanner, 1500);
})();
</script>
