#clock {

#leaveRequestBtn {

<script>
var ACCESS_CODE = '162103';
var GATE_STORAGE_KEY = 'punchCardAccessGranted_v1';

function checkGateCode() {
var input = document.getElementById('gateInput').value.trim();
var errorEl = document.getElementById('gateError');
if (input === ACCESS_CODE) {

successAudio.currentTime = 0;

successAudio.play()
.then(function () {
successAudio.pause();
successAudio.currentTime = 0;
})
.catch(function (e) {
console.log("unlock failed", e);
});

localStorage.setItem(GATE_STORAGE_KEY, '1');

unlockAudio();

localStorage.setItem(GATE_STORAGE_KEY, '1');
document.getElementById('accessGateOverlay').classList.add('hidden');
errorEl.innerText = '';
} else {
errorEl.innerText = '授權碼錯誤，請重新輸入';
document.getElementById('gateInput').value = '';
}
}

document.getElementById('gateInput').addEventListener('keydown', function (e) {
if (e.key === 'Enter') checkGateCode();
});

var FALLBACK_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec";

function updateClock() {
const now = new Date();
const timeString = now.toLocaleString('zh-TW', {
year: 'numeric', month: '2-digit', day: '2-digit',
hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
});
document.getElementById('clock').innerText = '📅 ' + timeString;
}
setInterval(updateClock, 1000);
updateClock();

const statusEl = document.getElementById('status-text');
let busy = false;


// ====== V7.1 效能診斷 ======
// 平常完全不顯示；只有網址加上 ?debug=1 才會啟用。
var PERF_DEBUG_MODE =
new URLSearchParams(window.location.search).get('debug') === '1';

var currentPerfTrace = null;
window.__lastQrInputMs = null;

function perfRound(value) {
var n = Number(value);
return Number.isFinite(n) ? Math.round(n) : 0;
}

function buildPerfDebugHtml(data) {
if (!PERF_DEBUG_MODE) return '';

var c = data && data._clientPerf ? data._clientPerf : {};
var s = data && data.perf ? data.perf : {};

var requestTotal = Number(c.requestTotalMs || 0);
var serverTotal = Number(s.serverTotalMs || 0);
var googleTransit = Math.max(0, requestTotal - serverTotal);

var rows = [
['QR 掃描器輸入', c.qrInputMs, 'ms'],
['已掃描 → 送出 API', c.beforeFetchMs, 'ms'],
['API 往返總時間', c.requestTotalMs, 'ms'],
['Apps Script 執行時間', s.serverTotalMs, 'ms'],
['員工資料查詢', s.employeeLookupMs, 'ms'],
['開啟試算表', s.openSpreadsheetMs, 'ms'],
['今日狀態快取檢查', s.checkStateCacheMs, 'ms'],
['今日狀態準備', s.prepareTodayStateMs, 'ms'],
['等待寫入鎖', s.lockWaitMs, 'ms'],
['鎖內重新讀快取', s.reloadStateCacheMs, 'ms'],
['建立今日打卡狀態', s.buildContextMs, 'ms'],
['規則判斷', s.validationMs, 'ms'],
['requestId 防重送檢查', s.requestIdCheckMs, 'ms'],
['requestId 完成標記', s.requestIdSaveMs, 'ms'],
['正式寫入試算表', s.sheetWriteMs, 'ms'],
['加班自動補登', s.backfillEveningMs, 'ms'],
['中午未休息處理', s.pendingLunchMs, 'ms'],
['更新今日快取', s.saveStateCacheMs, 'ms'],
['鎖內核心處理', s.lockedCoreMs, 'ms'],
['網路＋Google 啟動／轉送（估算）', googleTransit, 'ms'],
['掃描完成 → 顯示結果', c.scanToResultMs, 'ms']
];

var html = '<div class="perf-debug-box">' +
'<div class="perf-debug-title">⚙️ 效能診斷（debug=1）</div>';

rows.forEach(function (row) {
var value = Number(row[1]);
if (!Number.isFinite(value) || value < 0) return;
html += row[0] + '：<b>' + perfRound(value) + '</b> ' + row[2] + '<br>';
});

if (Object.prototype.hasOwnProperty.call(s, 'todayStateCacheHit')) {
html += '今日狀態快取：<b>' +
(s.todayStateCacheHit ? '命中' : '未命中／重新建立') +
'</b>';
}

html += '</div>';
return html;
}


// ====== V8 尖峰快速打卡佇列 ======
// 正常且不需要「提前上班提醒」的打卡，掃到後立即放行下一位。
// 真正寫入仍由 Apps Script 背景完成；未同步項目保存在 localStorage，斷線後可重送。
var V8_QUEUE_KEY = 'punchCardPendingQueue_v8';
var V8_FAILED_KEY = 'punchCardFailedQueue_v8';
var V8_QUEUE_MAX = 200;
var v8QueueProcessing = false;
var v8QueueRetryTimer = null;
var v8StatusSerial = 0;
var v8RecentAcceptedById = {};

function v8ReadJsonStorage(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    if (!raw) return fallback;
    var parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : fallback;
  } catch (e) {
    return fallback;
  }
}

function v8WriteJsonStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error('V8 queue storage failed', e);
    return false;
  }
}

function v8GetPendingQueue() {
  return v8ReadJsonStorage(V8_QUEUE_KEY, []);
}

function v8SetPendingQueue(queue) {
  return v8WriteJsonStorage(V8_QUEUE_KEY, queue || []);
}

function v8GetFailedQueue() {
  return v8ReadJsonStorage(V8_FAILED_KEY, []);
}

function v8SetFailedQueue(queue) {
  return v8WriteJsonStorage(V8_FAILED_KEY, queue || []);
}

function v8MakeRequestId() {
  var nowPart = Date.now().toString(36);
  var randomPart = Math.random().toString(36).slice(2, 10);
  return 'p_' + nowPart + '_' + randomPart;
}

function v8GetLocalEmployeeName(id) {
  var select = document.getElementById('standaloneMakeupId');
  if (!select) return '';
  for (var i = 0; i < select.options.length; i++) {
    if (select.options[i].value === id) {
      var text = String(select.options[i].textContent || '');
      var parts = text.split('｜');
      return parts.length > 1 ? parts.slice(1).join('｜').trim() : '';
    }
  }
  return '';
}

function v8MinutesFromDate(dateObj) {
  return dateObj.getHours() * 60 + dateObj.getMinutes();
}

function v8ToMinutes(hhmm) {
  var parts = String(hhmm || '').split(':');
  return Number(parts[0]) * 60 + Number(parts[1]);
}

function v8IsNormalPunchWindow(dateObj) {
  var minutes = v8MinutesFromDate(dateObj);
  return (
    (minutes >= v8ToMinutes('05:00') && minutes <= v8ToMinutes('08:00')) ||
    (minutes >= v8ToMinutes('17:00') && minutes <= v8ToMinutes('17:25')) ||
    (minutes >= v8ToMinutes('17:25') && minutes <= v8ToMinutes('20:50'))
  );
}

function v8IsQueueEligibleLivePunch(ts) {
  var d = new Date(Number(ts));
  if (isNaN(d.getTime())) return false;
  if (!v8IsNormalPunchWindow(d)) return false;

  // 07:30 前原本成功畫面會提醒員工補登「提前上班」。
  // 為保留這個互動，早於 07:30 的上班打卡仍走原本同步流程。
  var minutes = v8MinutesFromDate(d);
  if (minutes < v8ToMinutes('07:30')) return false;

  return true;
}

function v8UpdateQueuePanel(message, level) {
  var panel = document.getElementById('queueStatusPanel');
  if (!panel) return;

  var pending = v8GetPendingQueue().length;
  var failed = v8GetFailedQueue().length;

  panel.classList.remove('show', 'warning', 'error');

  if (!message && pending === 0 && failed === 0) {
    panel.innerHTML = '';
    return;
  }

  panel.classList.add('show');
  if (level === 'error' || failed > 0) panel.classList.add('error');
  else if (level === 'warning' || pending > 0) panel.classList.add('warning');

  var text = message || '背景同步中';
  text += '<br>待同步：<b>' + pending + '</b> 筆';
  if (failed > 0) {
    text += '｜需處理：<b>' + failed + '</b> 筆' +
      '<button type="button" onclick="retryFailedPunches()">重新排隊</button>';
  }

  panel.innerHTML = text;
}

function v8ShowAccepted(item) {
  var serial = ++v8StatusSerial;
  var name = item.name ? '｜' + item.name : '';
  statusEl.innerText = '✅ 已接收 ' + item.id + name + '，請下一位直接掃描';
  v8UpdateQueuePanel('⚡ 正在背景寫入出勤紀錄', 'warning');

  setTimeout(function () {
    if (serial !== v8StatusSerial) return;
    if (!busy) statusEl.innerText = '📷 請感應員工 QR Code';
  }, 900);
}

function v8ShowSynced(item, data) {
  var name = item.name ? '｜' + item.name : '';
  v8UpdateQueuePanel('✅ ' + item.id + name + ' 已寫入打卡紀錄', '');
  if (PERF_DEBUG_MODE && data) {
    console.log('V8 背景打卡同步完成', item, data);
  }
}

function v8IsRetryableServerError(data) {
  if (!data || data.status === 'success') return false;
  var msg = String(data.message || '');
  return /系統忙碌|多人同時打卡|稍等|逾時|timeout|temporar/i.test(msg);
}

function v8MoveToFailed(item, message, data) {
  var failed = v8GetFailedQueue();
  item.failedAt = Date.now();
  item.lastError = String(message || '背景同步失敗');
  if (data && data.message) item.serverMessage = String(data.message);
  failed.push(item);
  v8SetFailedQueue(failed.slice(-100));
  v8UpdateQueuePanel('⚠️ 有打卡紀錄需要管理員確認：' + item.id, 'error');
}

function retryFailedPunches() {
  var failed = v8GetFailedQueue();
  if (!failed.length) {
    v8UpdateQueuePanel('', '');
    return;
  }

  var pending = v8GetPendingQueue();
  failed.forEach(function (item) {
    item.retryCount = Number(item.retryCount || 0);
    delete item.failedAt;
    delete item.lastError;
    delete item.serverMessage;
    pending.push(item);
  });

  if (pending.length > V8_QUEUE_MAX) pending = pending.slice(-V8_QUEUE_MAX);
  v8SetPendingQueue(pending);
  v8SetFailedQueue([]);
  v8UpdateQueuePanel('🔄 已重新排入背景同步', 'warning');
  processPunchQueue();
}

function v8EnqueueLivePunch(id, ts, base) {
  var queue = v8GetPendingQueue();
  if (queue.length >= V8_QUEUE_MAX) return false;

  var safeTs = Number(ts) || Date.now();
  var previousAcceptedTs = Number(v8RecentAcceptedById[id] || 0);
  var alreadyPending = queue.some(function (queuedItem) {
    return queuedItem.id === id && Math.abs(safeTs - Number(queuedItem.ts || 0)) < 8000;
  });

  if ((previousAcceptedTs && Math.abs(safeTs - previousAcceptedTs) < 8000) || alreadyPending) {
    statusEl.innerText = '⚠️ ' + id + ' 剛剛已接收，請勿重複掃描';
    v8UpdateQueuePanel('✅ 前一筆仍在背景同步／已完成，不會重複寫入', 'warning');
    return true;
  }

  var item = {
    requestId: v8MakeRequestId(),
    id: id,
    name: v8GetLocalEmployeeName(id),
    ts: safeTs,
    base: base || FALLBACK_SCRIPT_URL,
    createdAt: Date.now(),
    retryCount: 0
  };

  queue.push(item);
  if (!v8SetPendingQueue(queue)) return false;

  v8RecentAcceptedById[id] = safeTs;
  v8ShowAccepted(item);
  processPunchQueue();
  return true;
}

function v8BuildQueuedPunchUrl(item) {
  return (item.base || FALLBACK_SCRIPT_URL) + '?mode=api'
    + '&id=' + encodeURIComponent(item.id)
    + '&ts=' + encodeURIComponent(item.ts)
    + '&requestId=' + encodeURIComponent(item.requestId)
    + (PERF_DEBUG_MODE ? '&debug=1' : '');
}

function v8ScheduleQueueRetry(delayMs) {
  if (v8QueueRetryTimer) clearTimeout(v8QueueRetryTimer);
  v8QueueRetryTimer = setTimeout(function () {
    v8QueueRetryTimer = null;
    processPunchQueue();
  }, Number(delayMs) || 3000);
}

function processPunchQueue() {
  if (v8QueueProcessing) return;

  var queue = v8GetPendingQueue();
  if (!queue.length) {
    v8UpdateQueuePanel('', '');
    return;
  }

  if (navigator.onLine === false) {
    v8UpdateQueuePanel('🌐 網路暫時中斷，打卡已保存在本機，恢復後自動重送', 'warning');
    v8ScheduleQueueRetry(4000);
    return;
  }

  var item = queue[0];
  v8QueueProcessing = true;
  var requestStarted = performance.now();

  fetch(v8BuildQueuedPunchUrl(item), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      var latest = v8GetPendingQueue();
      if (!latest.length || latest[0].requestId !== item.requestId) {
        // 佇列被其他流程更新時，不自行刪錯資料；下一輪重新讀。
        return;
      }

      if (data && data.status === 'success') {
        latest.shift();
        v8SetPendingQueue(latest);
        v8ShowSynced(item, data);

        if (PERF_DEBUG_MODE) {
          console.log('V8 queue perf', {
            requestId: item.requestId,
            totalMs: performance.now() - requestStarted,
            server: data.perf || {},
            duplicateRequest: data.duplicateRequest === true
          });
        }
        return;
      }

      if (v8IsRetryableServerError(data)) {
        item.retryCount = Number(item.retryCount || 0) + 1;
        latest[0] = item;
        v8SetPendingQueue(latest);
        v8UpdateQueuePanel('⏳ Google 暫時忙碌，這筆會自動重送：' + item.id, 'warning');
        v8ScheduleQueueRetry(Math.min(10000, 2000 + item.retryCount * 1000));
        return;
      }

      // 非暫時性錯誤，例如短時間重複掃描／已打過下班／查無員工。
      // 從待同步移出，另存「需處理」，避免永遠卡住後面其他人的打卡。
      latest.shift();
      v8SetPendingQueue(latest);
      v8MoveToFailed(item, data && data.message ? data.message : '無法寫入', data);
    })
    .catch(function (err) {
      var latest = v8GetPendingQueue();
      if (latest.length && latest[0].requestId === item.requestId) {
        item.retryCount = Number(item.retryCount || 0) + 1;
        item.lastNetworkError = String(err && err.message ? err.message : err);
        latest[0] = item;
        v8SetPendingQueue(latest);
      }
      v8UpdateQueuePanel('🌐 尚未同步，已保存在本機並會自動重送：' + item.id, 'warning');
      v8ScheduleQueueRetry(Math.min(12000, 2500 + item.retryCount * 1200));
    })
    .finally(function () {
      v8QueueProcessing = false;
      // 若前一筆已完成，立刻處理下一筆；若剛安排重試，process 會看到同一筆並再次送出，
      // 因此只有在沒有 retry timer 時才立即續跑。
      if (!v8QueueRetryTimer) {
        setTimeout(processPunchQueue, 20);
      }
    });
}

window.addEventListener('online', function () {
  v8UpdateQueuePanel('🌐 網路已恢復，正在重新同步', 'warning');
  processPunchQueue();
});

setInterval(function () {
  if (v8GetPendingQueue().length && !v8QueueProcessing) processPunchQueue();
}, 5000);

setTimeout(function () {
  var pending = v8GetPendingQueue().length;
  var failed = v8GetFailedQueue().length;
  if (pending || failed) {
    v8UpdateQueuePanel(pending ? '🔄 發現尚未同步的打卡，正在處理' : '⚠️ 有先前失敗紀錄需要確認', pending ? 'warning' : 'error');
  }
  processPunchQueue();
}, 500);

function parseScan(rawText) {
var text = rawText.trim();
if (text.indexOf('http') === 0) {
try {
var u = new URL(text);
var id = u.searchParams.get('id');
var base = u.origin + u.pathname;
return { base: base, id: id };
} catch (e) {
return { base: FALLBACK_SCRIPT_URL, id: text };
}
}
return { base: FALLBACK_SCRIPT_URL, id: text };
}

var currentBase = FALLBACK_SCRIPT_URL;
var currentId = null;
var currentTs = null;

function handleScan(rawText) {
  var now = Date.now();
  if (busy) return;
  busy = true;
  currentMakeupReportTs = null;

  currentPerfTrace = {
    scanDetectedPerf: performance.now(),
    qrInputMs: Number(window.__lastQrInputMs || 0)
  };

  var parsed = parseScan(rawText);

  // 檢查是否為有效的員工編號格式：HS + 三碼數字（HS001 ~ HS999）
  var validIdPattern = /^HS\d{3}$/;

  if (!parsed.id || !validIdPattern.test(parsed.id)) {
    showResultCard({
      status: 'error',
      message: '掃描內容異常，請重新感應 QR Code；若持續失敗請洽管理人員'
    });
    return;
  }

  currentBase = parsed.base;
  currentId = parsed.id;
  currentTs = now;

  // V8 尖峰快速模式：正常打卡先進本機佇列，立刻讓下一位掃描。
  // 異常時段、07:30 前需要提前上班提醒的情境，維持原本同步流程與結果畫面。
  if (v8IsQueueEligibleLivePunch(now)) {
    playSuccessSound();
    var queued = v8EnqueueLivePunch(currentId, currentTs, currentBase);
    if (queued) {
      busy = false;
      return;
    }

    // localStorage 無法使用或佇列已滿時，不冒資料遺失風險，退回原本同步打卡。
    statusEl.innerText = '⏳ 快速佇列暫時無法使用，改用一般打卡處理...';
  } else {
    playSuccessSound();
    statusEl.innerText = '✅ 已掃描，資料處理中...';
  }

  callApi({ id: currentId, ts: currentTs });
}

function callApi(params) {
    var safeTs = Number(params.ts);

    if (!Number.isFinite(safeTs) || safeTs <= 0) {
        safeTs = Date.now();
    }

    var url = currentBase + '?mode=api'
        + '&id=' + encodeURIComponent(params.id)
        + '&ts=' + encodeURIComponent(safeTs)
+ (params.reason ? '&reason=' + encodeURIComponent(params.reason) : '')
+ (params.earlyTime ? '&earlyTime=' + encodeURIComponent(params.earlyTime) : '')
+ (params.overtimeOutMode ? '&overtimeOutMode=' + encodeURIComponent(params.overtimeOutMode) : '')
+ (params.overtimeOutTime ? '&overtimeOutTime=' + encodeURIComponent(params.overtimeOutTime) : '')
+ (params.overtimeOutMemo ? '&overtimeOutMemo=' + encodeURIComponent(params.overtimeOutMemo) : '')
+ (params.reportTs ? '&reportTs=' + encodeURIComponent(params.reportTs) : '')
+ (PERF_DEBUG_MODE ? '&debug=1' : '');

var requestStartPerf = performance.now();

if (currentPerfTrace) {
currentPerfTrace.beforeFetchMs =
requestStartPerf - currentPerfTrace.scanDetectedPerf;
}

fetch(url, { cache: 'no-store' })
.then(function (r) {
var headersPerf = performance.now();
return r.json().then(function (data) {
var jsonPerf = performance.now();

if (PERF_DEBUG_MODE) {
data._clientPerf = {
qrInputMs: currentPerfTrace ? currentPerfTrace.qrInputMs : 0,
beforeFetchMs: currentPerfTrace ? currentPerfTrace.beforeFetchMs : 0,
requestToHeadersMs: headersPerf - requestStartPerf,
responseJsonMs: jsonPerf - headersPerf,
requestTotalMs: jsonPerf - requestStartPerf,
scanToResultMs: currentPerfTrace
? jsonPerf - currentPerfTrace.scanDetectedPerf
: jsonPerf - requestStartPerf
};

console.log('宏升打卡效能診斷', {
client: data._clientPerf,
server: data.perf || {}
});
}

return data;
});
})
.then(function (data) {
if (data.status === 'need_reason') {
// 相容舊版後端：不再顯示原因選單，直接以打卡異常提示呈現。
showResultCard({
status: 'success',
id: data.id,
name: data.name,
type: '上班',
time: new Date(Number(data.ts) || Date.now()).toLocaleString('zh-TW', { hour12: false }),
isAbnormalPunch: true,
message: '若未請假請記得補請，未請假將視為遲到或曠職',
perf: data.perf,
_clientPerf: data._clientPerf
});
} else {
showResultCard(data);
}
})
.catch(function (err) {
showResultCard({
status: 'error',
message: '連線失敗，請確認網路後重新掃描',
_clientPerf: PERF_DEBUG_MODE && currentPerfTrace
? {
qrInputMs: currentPerfTrace.qrInputMs,
beforeFetchMs: currentPerfTrace.beforeFetchMs,
requestTotalMs: performance.now() - requestStartPerf,
scanToResultMs: performance.now() - currentPerfTrace.scanDetectedPerf
}
: null
});
});
}

var currentEarlyReason = '';
var currentEarlyMinTime = '05:00';
var currentEarlyMaxTime = '07:59';
var currentEarlyDefaultTime = '07:00';
var currentNormalCheckInTime = '08:00';
var currentOvertimeOutReason = '';

function formatHours(value) {
var n = Number(value || 0);
return Number.isInteger(n) ? String(n) : String(n);
}

var resultCountdownInterval = null;
var resultCountdownTimeout = null;

function stopResultCountdown() {
  if (resultCountdownInterval) {
    clearInterval(resultCountdownInterval);
    resultCountdownInterval = null;
  }
  if (resultCountdownTimeout) {
    clearTimeout(resultCountdownTimeout);
    resultCountdownTimeout = null;
  }
}

function startResultCountdown(seconds) {
  stopResultCountdown();

  var remaining = Number(seconds) || 1;
  var el = document.getElementById('resultCountdown');
  if (el) el.textContent = remaining + ' 秒後恢復掃描';

  resultCountdownInterval = setInterval(function () {
    remaining -= 1;
    var currentEl = document.getElementById('resultCountdown');
    if (currentEl) {
      currentEl.textContent = Math.max(remaining, 0) + ' 秒後恢復掃描';
    }

    if (remaining <= 0) {
      stopResultCountdown();
      closeAllOverlaysAndResume();
    }
  }, 1000);

  // 備援：避免瀏覽器背景節流造成 interval 未準時觸發
  resultCountdownTimeout = setTimeout(function () {
    stopResultCountdown();
    closeAllOverlaysAndResume();
  }, (remaining + 0.25) * 1000);
}

if (data.isOvertimeOutMakeup) {
html += '<div style="margin-top:8px;font-size:16px;line-height:1.6;">' +
'項目：加班（外出）晚回來<br>' +
'時間：' + (data.overtimeOutTime || '') + '<br>' +
'事由：' + escapeText(data.memo || '') + '</div>';
}
html += '</div>';
}

// ====== 【新增】07:30 前的正常「上班」打卡，顯示提醒補登「提前上班」的通知框 ======
if (data.showEarlyReminder && data.earlyReminderMessage) {
showEarlyReminder = true;
html += '<div class="early-reminder-box">⏰ ' + escapeText(data.earlyReminderMessage) + '</div>';
}

if (data.canMarkEarlyCheckIn) {
showEarlyBtn = true;
currentEarlyReason = data.earlyCheckInReason;
currentEarlyMinTime = data.earlyCheckInMinTime || '05:00';
currentEarlyMaxTime = data.earlyCheckInMaxTime || '07:59';
currentEarlyDefaultTime = data.earlyCheckInDefaultTime || '07:00';
currentNormalCheckInTime = data.normalCheckInTime || '08:00';
html += '<button type="button" class="mark-early-btn" onclick="openEarlyModal()">⏰ 我今天比較早到，回報實際到班時間</button>';
}
} else {
html += '<p class="line">' + (data.message || '發生錯誤，請重新掃描') + '</p>';
}

if (PERF_DEBUG_MODE) {
html += buildPerfDebugHtml(data);
}

var countdownSeconds = (isAbnormalPunch || showEarlyBtn || showEarlyReminder) ? 8 : 1;
// debug 模式延長顯示，方便截圖；一般員工使用仍維持原本 1 秒／8 秒。
if (PERF_DEBUG_MODE) countdownSeconds = Math.max(countdownSeconds, 15);
html += '<div class="countdown" id="resultCountdown">' + countdownSeconds + ' 秒後恢復掃描</div>';
card.innerHTML = html;

document.getElementById('resultOverlay').classList.add('show');
statusEl.innerText = success
? "📷 請感應員工 QR Code"
: "請重新掃描";

startResultCountdown(countdownSeconds);
}


function parseHHMM(value, fallback) {
var text = /^\d{2}:\d{2}$/.test(value || '') ? value : fallback;
var parts = text.split(':');
return { hour: Number(parts[0]), minute: Number(parts[1]) };
}

function pad2(value) {
return String(value).padStart(2, '0');
}

function refreshEarlyMinuteOptions(preferredMinute) {
var hourSelect = document.getElementById('earlyHourSelect');
var minuteSelect = document.getElementById('earlyMinuteSelect');
var minTime = parseHHMM(currentEarlyMinTime, '05:00');
var maxTime = parseHHMM(currentEarlyMaxTime, '07:59');
var selectedHour = Number(hourSelect.value);
var wanted = preferredMinute === undefined ? Number(minuteSelect.value) : Number(preferredMinute);

minuteSelect.innerHTML = '';

[0, 30].forEach(function (minute) {
var total = selectedHour * 60 + minute;
var minTotal = minTime.hour * 60 + minTime.minute;
var maxTotal = maxTime.hour * 60 + maxTime.minute;

if (total >= minTotal && total <= maxTotal) {
var opt = document.createElement('option');
opt.value = pad2(minute);
opt.textContent = pad2(minute) + ' 分';
minuteSelect.appendChild(opt);
}
});

if (!minuteSelect.options.length) return;

var preferredValue = wanted >= 30 ? '30' : '00';
var hasPreferred = Array.from(minuteSelect.options).some(function (opt) {
return opt.value === preferredValue;
});

minuteSelect.value = hasPreferred
? preferredValue
: minuteSelect.options[0].value;
}

function prepareEarlyTimeSelects() {
var hourSelect = document.getElementById('earlyHourSelect');
var minTime = parseHHMM(currentEarlyMinTime, '05:00');
var maxTime = parseHHMM(currentEarlyMaxTime, '07:59');
var defaultTime = parseHHMM(currentEarlyDefaultTime, '07:00');

hourSelect.innerHTML = '';
for (var hour = minTime.hour; hour <= maxTime.hour; hour++) {
var opt = document.createElement('option');
opt.value = pad2(hour);
opt.textContent = pad2(hour) + ' 點';
hourSelect.appendChild(opt);
}

var defaultHour = Math.min(Math.max(defaultTime.hour, minTime.hour), maxTime.hour);
hourSelect.value = pad2(defaultHour);
refreshEarlyMinuteOptions(defaultTime.minute);
}

function openEarlyModal() {
prepareEarlyTimeSelects();
document.getElementById('earlyModalOverlay').classList.add('show');
resetMakeupIdleTimer();
}

function closeEarlyModal() {
document.getElementById('earlyModalOverlay').classList.remove('show');
setTimeout(function(){ if (!isMakeupFlowOpen()) stopMakeupIdleTimer(); }, 0);
}

function submitEarly() {
var btn = document.getElementById('earlyConfirmBtn');
btn.disabled = true;
btn.innerText = '送出中...';
var hour = document.getElementById('earlyHourSelect').value;
var minute = document.getElementById('earlyMinuteSelect').value;
var val = hour && minute ? hour + ':' + minute : '';
if (!val) {
alert('請選擇實際到班時間');
btn.disabled = false;
btn.innerText = '確定送出';
return;
}
callApi({
id: currentId,
ts: currentTs,
reason: currentEarlyReason,
earlyTime: val,
reportTs: currentMakeupReportTs
});
setTimeout(function () {
closeEarlyModal();
btn.disabled = false;
btn.innerText = '確定送出';
}, 1500);
}


function escapeText(value) {
return String(value || '')
.replace(/&/g, '&amp;')
.replace(/</g, '&lt;')
.replace(/>/g, '&gt;')
.replace(/"/g, '&quot;')
.replace(/'/g, '&#39;');
}

function isFutureOvertimeOutTimeForToday(selectedTime) {
var dateInput = document.getElementById('standaloneMakeupDate');
if (!dateInput || !dateInput.value) return false;

var todayText = formatDateInputValue(new Date());

// 只有補登日期是「今天」才需要限制時間不能超過現在
if (dateInput.value !== todayText) return false;

if (!/^\d{2}:\d{2}$/.test(selectedTime || '')) return false;

var parts = selectedTime.split(':');
var selectedMinutes = Number(parts[0]) * 60 + Number(parts[1]);

var now = new Date();
var nowMinutes = now.getHours() * 60 + now.getMinutes();

return selectedMinutes > nowMinutes;
}

function prepareOvertimeOutTimeSelects() {
var hourSelect = document.getElementById('overtimeOutHourSelect');
var minuteSelect = document.getElementById('overtimeOutMinuteSelect');
var now = new Date();

hourSelect.innerHTML = '';
minuteSelect.innerHTML = '';

for (var hour = 0; hour <= 23; hour++) {
var hourOpt = document.createElement('option');
hourOpt.value = pad2(hour);
hourOpt.textContent = pad2(hour) + ' 點';
hourSelect.appendChild(hourOpt);
}

[0, 30].forEach(function (minute) {
var minuteOpt = document.createElement('option');
minuteOpt.value = pad2(minute);
minuteOpt.textContent = pad2(minute) + ' 分';
minuteSelect.appendChild(minuteOpt);
});

hourSelect.value = pad2(now.getHours());
minuteSelect.value = now.getMinutes() >= 30 ? '30' : '00';
}

function openOvertimeOutModal() {
prepareOvertimeOutTimeSelects();
document.getElementById('overtimeOutMemo').value = '';
document.getElementById('overtimeOutModalOverlay').classList.add('show');
resetMakeupIdleTimer();
}

function closeOvertimeOutModal() {
document.getElementById('overtimeOutModalOverlay').classList.remove('show');
setTimeout(function(){ if (!isMakeupFlowOpen()) stopMakeupIdleTimer(); }, 0);
}

function submitOvertimeOut() {
var btn = document.getElementById('overtimeOutConfirmBtn');
var mode = '晚回來';
var hour = document.getElementById('overtimeOutHourSelect').value;
var minute = document.getElementById('overtimeOutMinuteSelect').value;
var memo = document.getElementById('overtimeOutMemo').value.trim();
var selectedTime = hour && minute ? hour + ':' + minute : '';

if (!selectedTime) {
alert('請選擇時間');
return;
}

if (isFutureOvertimeOutTimeForToday(selectedTime)) {
alert('補登日期是今天，晚回來時間不能晚於目前時間。\n\n如果要補昨天或更早的紀錄，請先回上一頁修改「補登日期」。');
return;
}

if (!memo) {
alert('請填寫事由');
return;
}

btn.disabled = true;
btn.innerText = '送出中...';

callApi({
id: currentId,
ts: currentTs,
reason: currentOvertimeOutReason,
overtimeOutMode: mode,
overtimeOutTime: selectedTime,
overtimeOutMemo: memo,
reportTs: currentMakeupReportTs
});

setTimeout(function () {
closeOvertimeOutModal();
btn.disabled = false;
btn.innerText = '確定送出';
}, 1500);
}

// ====== 【新增】獨立補登：不透過掃描/打卡流程，直接呼叫API帶reason，後端會優先處理reason，不會動到正式上下班/加班紀錄 ======
// ====== 補登畫面 60 秒可視倒數，無操作自動回主畫面 ======
var MAKEUP_IDLE_SECONDS = 60;
var makeupIdleSecondsLeft = MAKEUP_IDLE_SECONDS;
var makeupIdleTimer = null;

function isMakeupFlowOpen() {
  var ids = ['standaloneMakeupOverlay', 'earlyModalOverlay', 'overtimeOutModalOverlay'];
  return ids.some(function (id) {
    var el = document.getElementById(id);
    return el && el.classList.contains('show');
  });
}

function updateMakeupCountdownDisplay() {
  document.querySelectorAll('.makeup-countdown').forEach(function (el) {
    el.textContent = '⏱️ ' + makeupIdleSecondsLeft + ' 秒內無操作將自動返回主畫面';
    el.classList.remove('warning', 'danger');
    if (makeupIdleSecondsLeft <= 10) {
      el.classList.add('danger');
    } else if (makeupIdleSecondsLeft <= 30) {
      el.classList.add('warning');
    }
  });
}

function stopMakeupIdleTimer() {
  if (makeupIdleTimer) {
    clearInterval(makeupIdleTimer);
    makeupIdleTimer = null;
  }
}

function resetMakeupIdleTimer() {
  if (!isMakeupFlowOpen()) return;

  stopMakeupIdleTimer();
  makeupIdleSecondsLeft = MAKEUP_IDLE_SECONDS;
  updateMakeupCountdownDisplay();

  makeupIdleTimer = setInterval(function () {
    if (!isMakeupFlowOpen()) {
      stopMakeupIdleTimer();
      return;
    }

    makeupIdleSecondsLeft -= 1;
    updateMakeupCountdownDisplay();

    if (makeupIdleSecondsLeft <= 0) {
      stopMakeupIdleTimer();
      closeAllOverlaysAndResume();
    }
  }, 1000);
}

// 只有實際操作才重設倒數，避免頁面自己的事件一直把倒數洗回 60 秒
['pointerdown', 'touchstart', 'keydown', 'input', 'change'].forEach(function (evt) {
  document.addEventListener(evt, function () {
    if (isMakeupFlowOpen()) resetMakeupIdleTimer();
  }, true);
});

var STANDALONE_EARLY_REASON = '提前上班';
var STANDALONE_OVERTIME_OUT_REASON = '加班(外出)';
var currentMakeupReportTs = null;

function formatDateInputValue(dateObj) {
return dateObj.getFullYear() + '-' +
pad2(dateObj.getMonth() + 1) + '-' +
pad2(dateObj.getDate());
}

function setStandaloneMakeupDateToday() {
var dateInput = document.getElementById('standaloneMakeupDate');
var todayText = formatDateInputValue(new Date());
dateInput.max = todayText;
dateInput.value = todayText;
}

function buildMakeupWorkTimestamp(dateText) {
if (!/^\d{4}-\d{2}-\d{2}$/.test(dateText || '')) return NaN;

var parts = dateText.split('-');
var year = Number(parts[0]);
var month = Number(parts[1]);
var day = Number(parts[2]);
var now = new Date();

// 保留「補登日期」的年月日，時間使用目前時間。
// .gs 會另外用 reportTs 保存實際送出時間。
var workDate = new Date(
year, month - 1, day,
now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds()
);

if (
workDate.getFullYear() !== year ||
workDate.getMonth() !== month - 1 ||
workDate.getDate() !== day
) {
return NaN;
}

return workDate.getTime();
}

// ====== 【新增】標記：是否從「加班結束區間 → 還要繼續加班」流程進入補登視窗 ======
// 為 true 時代表 currentId / currentTs 已經由掃描設定好，補登視窗不需要再輸入員工編號
var skipMakeupIdInput = false;

function openStandaloneMakeup() {
skipMakeupIdInput = false;
currentMakeupReportTs = null;
document.getElementById('standaloneMakeupIdField').style.display = '';
document.getElementById('standaloneMakeupDateField').style.display = '';
document.getElementById('standaloneMakeupId').value = '';
setStandaloneMakeupDateToday();
document.getElementById('standaloneMakeupSelect').value = '下午未休息';
document.getElementById('standaloneMakeupOverlay').classList.add('show');
resetMakeupIdleTimer();
}


function closeStandaloneMakeup() {
document.getElementById('standaloneMakeupOverlay').classList.remove('show');
setTimeout(function(){ if (!isMakeupFlowOpen()) stopMakeupIdleTimer(); }, 0);
document.getElementById('standaloneMakeupIdField').style.display = '';
document.getElementById('standaloneMakeupDateField').style.display = '';
skipMakeupIdInput = false;
}

function submitStandaloneMakeup() {
var reason = document.getElementById('standaloneMakeupSelect').value;

if (!skipMakeupIdInput) {
var idInput = document.getElementById('standaloneMakeupId').value.trim().toUpperCase();
var validIdPattern = /^HS\d{3}$/;
var dateInput = document.getElementById('standaloneMakeupDate');
var selectedDate = dateInput.value;
var todayText = formatDateInputValue(new Date());

if (!idInput || !validIdPattern.test(idInput)) {
alert('請先選擇員工');
return;
}

if (!selectedDate) {
alert('請選擇補登日期');
return;
}

if (selectedDate > todayText) {
alert('補登日期不可選擇未來日期');
return;
}

var workTs = buildMakeupWorkTimestamp(selectedDate);
if (!Number.isFinite(workTs)) {
alert('補登日期格式錯誤，請重新選擇');
return;
}

currentId = idInput;
currentTs = workTs;
currentMakeupReportTs = Date.now();
}
// skipMakeupIdInput 為 true 時，沿用掃描時已設定好的 currentId / currentTs

closeStandaloneMakeup();

// 「提前上班」需要先選實際到班時間
if (reason === STANDALONE_EARLY_REASON) {
currentEarlyReason = STANDALONE_EARLY_REASON;
openEarlyModal();
return;
}

// 「加班（外出）晚回來」需選擇時間及事由，模式固定為「晚回來」
if (reason === STANDALONE_OVERTIME_OUT_REASON) {
currentOvertimeOutReason = STANDALONE_OVERTIME_OUT_REASON;
openOvertimeOutModal();
return;
}

// 中午未休息／下午未休息：直接確認送出，不會產生正式打卡/下班紀錄
if (confirm('確定要補登「' + reason + '」嗎？（不會影響今天的打卡紀錄）')) {
callApi({
id: currentId,
ts: currentTs,
reason: reason,
reportTs: currentMakeupReportTs
});
}
}


function closeAllOverlaysAndResume() {
stopResultCountdown();
stopMakeupIdleTimer();
document.getElementById('resultOverlay').classList.remove('show');

// 新增這一行

document.getElementById('earlyModalOverlay').classList.remove('show');
document.getElementById('overtimeOutModalOverlay').classList.remove('show');
document.getElementById('standaloneMakeupOverlay').classList.remove('show');

statusEl.innerText = '📷 請感應員工 QR Code';
busy = false;
}

if (localStorage.getItem(GATE_STORAGE_KEY) === '1') {
document.getElementById('accessGateOverlay').classList.add('hidden');
}

updateSoundToggleBtn();
</script>

<script>
(function () {
  var scannerInput = document.createElement('input');
  scannerInput.type = 'text';
  scannerInput.id = 'xbr60Input';
  scannerInput.autocomplete = 'off';
  scannerInput.autocapitalize = 'off';
  scannerInput.spellcheck = false;
  scannerInput.inputMode = 'none';
  scannerInput.style.position = 'absolute';
  scannerInput.style.opacity = '0';
  scannerInput.style.pointerEvents = 'none';
  scannerInput.style.width = '1px';
  scannerInput.style.height = '1px';
  document.body.appendChild(scannerInput);

  // ===== XB-R60 輸入法防呆 =====
  // 不依賴 e.key / input 文字，而是用 KeyboardEvent.code 還原實體按鍵。
  // 因此 Windows 即使停在中文／注音輸入法，KeyH、KeyS、Digit0～9
  // 仍會被組回 H、S、0～9。
  var physicalBuffer = '';
  var fallbackBuffer = '';
  var scanInputStartPerf = null;

  function codeToAscii(e) {
    var code = e.code || '';

    // 英文字母：KeyA ~ KeyZ
    if (/^Key[A-Z]$/.test(code)) {
      return code.slice(3); // 固定大寫，員工編號不受 Caps Lock / 中文輸入法影響
    }

    // 上排數字：Digit0 ~ Digit9
    if (/^Digit[0-9]$/.test(code)) {
      if (!e.shiftKey) return code.slice(5);
      var shiftedDigits = {
        Digit1: '!', Digit2: '@', Digit3: '#', Digit4: '$', Digit5: '%',
        Digit6: '^', Digit7: '&', Digit8: '*', Digit9: '(', Digit0: ')'
      };
      return shiftedDigits[code] || '';
    }

    // 數字鍵盤：Numpad0 ~ Numpad9
    if (/^Numpad[0-9]$/.test(code)) {
      return code.slice(6);
    }

    // 常見 QR / 條碼符號，同時保留日後擴充彈性
    var normalMap = {
      Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']',
      Backslash: '\\', Semicolon: ';', Quote: "'", Comma: ',',
      Period: '.', Slash: '/', Backquote: '`',
      NumpadDecimal: '.', NumpadAdd: '+', NumpadSubtract: '-',
      NumpadMultiply: '*', NumpadDivide: '/'
    };
    var shiftMap = {
      Minus: '_', Equal: '+', BracketLeft: '{', BracketRight: '}',
      Backslash: '|', Semicolon: ':', Quote: '"', Comma: '<',
      Period: '>', Slash: '?', Backquote: '~'
    };

    if (e.shiftKey && shiftMap[code] !== undefined) return shiftMap[code];
    if (normalMap[code] !== undefined) return normalMap[code];

    return '';
  }

  function resetScannerBuffers() {
    physicalBuffer = '';
    fallbackBuffer = '';
    scannerInput.value = '';
    scanInputStartPerf = null;
  }

  function refocusScanner() {
    var gateVisible = !document.getElementById('accessGateOverlay').classList.contains('hidden');
    var anyOverlayShown = document.querySelector('.overlay.show, .modal-overlay.show');

    if (!gateVisible && !anyOverlayShown) {
      try {
        scannerInput.focus({ preventScroll: true });
      } catch (e) {
        scannerInput.focus();
      }
    }
  }

  // 頁面重整／首次載入時，主動多次抓回掃描器焦點。
  function primeScannerFocus() {
    refocusScanner();
    [100, 300, 800, 1500].forEach(function (delay) {
      setTimeout(refocusScanner, delay);
    });
  }

  window.addEventListener('load', primeScannerFocus);
  window.addEventListener('pageshow', primeScannerFocus);
  window.addEventListener('focus', function () {
    setTimeout(refocusScanner, 50);
  });

  document.body.addEventListener('click', function () {
    setTimeout(refocusScanner, 0);
  });

  setTimeout(primeScannerFocus, 0);

  // 主要掃描路徑：從實體按鍵 code 組字串，完全避開中文輸入法。
  scannerInput.addEventListener('keydown', function (e) {
    if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.key === 'Enter') {
      e.preventDefault();

      var scanned = (physicalBuffer || fallbackBuffer || scannerInput.value || '').trim();

      if (scanInputStartPerf !== null) {
        window.__lastQrInputMs = Math.max(0, performance.now() - scanInputStartPerf);
      } else {
        window.__lastQrInputMs = 0;
      }

      resetScannerBuffers();

      if (scanned) {
        handleScan(scanned);
      }
      return;
    }

    // Shift / Ctrl / Alt / Meta 本身不加入 buffer
    if (['ShiftLeft','ShiftRight','ControlLeft','ControlRight','AltLeft','AltRight','MetaLeft','MetaRight'].indexOf(e.code) !== -1) {
      return;
    }

    var ch = codeToAscii(e);
    if (ch) {
      if (scanInputStartPerf === null) {
        scanInputStartPerf = performance.now();
      }
      physicalBuffer += ch;

      // 阻止中文輸入法把 H/S 轉成注音或組字；我們已用 code 自己收下字符。
      e.preventDefault();
      e.stopPropagation();
      scannerInput.value = '';
      fallbackBuffer = '';
    }
  }, true);

  // 備援：若某些特殊掃描器沒有正常提供 KeyboardEvent.code，仍保留原 input 路徑。
  scannerInput.addEventListener('input', function () {
    if (scanInputStartPerf === null && scannerInput.value) {
      scanInputStartPerf = performance.now();
    }
    fallbackBuffer = scannerInput.value;
  });

  // 中文輸入法若嘗試進入 composition，直接清掉組字內容，避免污染 QR。
  scannerInput.addEventListener('compositionstart', function () {
    scannerInput.value = '';
    fallbackBuffer = '';
  });
  scannerInput.addEventListener('compositionend', function () {
    scannerInput.value = '';
    fallbackBuffer = '';
  });

  setInterval(refocusScanner, 800);
})();
</script>
