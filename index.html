<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        font-size: 18px;
        background: #1b2a5e;
        color: white;
        margin: 0;
        padding: 20px 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        box-sizing: border-box;
    }
    h1 { margin-bottom: 5px; font-size: 26px; text-align: center; }

    #clock {
        font-size: 20px;
        font-weight: bold;
        color: #ffd700;
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 16px;
        border-radius: 20px;
        margin: 10px 0 15px 0;
        letter-spacing: 1px;
    }
    #reader {
        width: 100%;
        max-width: 450px;
        background: white;
        padding: 10px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .camera-control {
        width: 100%;
        max-width: 450px;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 0 12px;
        padding: 10px 12px;
        background: rgba(255,255,255,0.12);
        border-radius: 10px;
        box-sizing: border-box;
    }
    .camera-control label {
        white-space: nowrap;
        font-size: 18px;
        font-weight: bold;
    }
    .camera-control select {
        flex: 1;
        min-width: 0;
        padding: 10px;
        font-size: 18px;
        border-radius: 8px;
        border: 1px solid #ccc;
        background: white;
        color: #333;
        box-sizing: border-box;
    }
    .status {
        margin-top: 15px;
        font-size: 18px;
        color: #00ffcc;
        text-align: center;
        min-height: 22px;
        padding: 0 10px;
    }
    #retryBtn {
        display: none;
        margin-top: 12px;
        padding: 10px 20px;
        font-size: 17px;
        background: transparent;
        color: #ffcc80;
        border: 1px solid #ffcc80;
        border-radius: 8px;
        cursor: pointer;
    }

    #leaveRequestBtn {
        width: 100%;
        max-width: 450px;
        margin-top: 20px;
        padding: 15px 0;
        font-size: 19px;
        font-weight: bold;
        background: #e0752c;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        box-sizing: border-box;
        display: block;
    }
    #leaveRequestBtn:active { background: #c9631f; }

    .overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(10, 16, 40, 0.92);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 999;
        padding: 20px;
        box-sizing: border-box;
    }
    .overlay.show { display: flex; }
    .card {
        background: white;
        color: #333;
        width: 100%;
        max-width: 340px;
        border-radius: 14px;
        padding: 30px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        border-top: 5px solid #e0752c;
    }
    .card h2 {
        margin: 0 0 14px;
        font-size: 26px;
    }
    .card .line { font-size: 20px; line-height: 1.8; margin: 0; }
    .card .cheer { margin-top: 14px; font-size: 22px; font-weight: bold; color: #e0752c; }
    .card .countdown { margin-top: 16px; font-size: 16px; color: #999; }

    .makeup-section {
        text-align: left;
        background: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 14px;
        margin-top: 10px;
    }
    .makeup-label { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 8px; }
    select#makeupSelect {
        width: 100%; padding: 12px; font-size: 19px; margin-bottom: 10px;
        border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;
    }
    .makeup-btn {
        width: 100%; padding: 14px 0; font-size: 20px; margin-top: 4px;
        background: #2e7d32; color: white; border: none; border-radius: 8px;
        font-weight: bold; cursor: pointer;
    }
    .makeup-btn:active { background: #1b5e20; }

    .mark-afternoon-btn {
        width: 100%; padding: 13px 0; font-size: 18px; margin-top: 14px;
        background: #8d6e63; color: white; border: none; border-radius: 8px;
        font-weight: bold; cursor: pointer;
    }
    .mark-afternoon-btn:active { background: #5d4037; }

    .mark-early-btn {
        width: 100%; padding: 13px 0; font-size: 18px; margin-top: 14px;
        background: #3a5a9c; color: white; border: none; border-radius: 8px;
        font-weight: bold; cursor: pointer;
    }
    .mark-early-btn:active { background: #24406f; }

    .divider { color: #999; font-size: 15px; margin: 16px 0 8px; }
    select#reasonSelect {
        width: 100%; padding: 13px; font-size: 20px; margin: 6px 0 14px;
        border-radius: 8px; border: 1px solid #ccc;
    }
    .submit-btn {
        width: 100%; padding: 15px 0; font-size: 20px;
        background: #e0752c; color: white; border: none; border-radius: 8px;
        font-weight: bold; cursor: pointer;
    }
    .submit-btn:disabled, .makeup-btn:disabled { background: #ccc; color: #666; }

    .modal-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.55); display: none; align-items: center;
        justify-content: center; z-index: 1000; padding: 20px; box-sizing: border-box;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
        background: white; border-radius: 14px; max-width: 300px; width: 100%;
        padding: 26px 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.25); text-align: center;
    }
    .modal-icon { font-size: 44px; margin-bottom: 8px; }
    .modal-title { font-size: 23px; font-weight: bold; color: #1b2a5e; margin-bottom: 12px; }
    .modal-text { font-size: 19px; line-height: 1.6; color: #333; }
    .modal-text.small-note { font-size: 17px; color: #888; margin-top: 8px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-btn { flex: 1; padding: 13px 0; font-size: 18px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; }
    .modal-btn.cancel { background: #e0e0e0; color: #555; }
    .modal-btn.confirm { background: #2e7d32; color: white; }
    .modal-btn.confirm:disabled { background: #ccc; color: #666; }

    .early-time-row {
        display: flex; align-items: center; justify-content: center;
        gap: 10px; margin: 14px 0 4px;
    }
    .early-time-row select {
        width: 112px; padding: 12px 8px; font-size: 22px;
        border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;
        text-align: center; background: white;
    }
    .early-time-colon {
        font-size: 26px; font-weight: bold; color: #333;
    }

    .overtime-out-field {
        text-align: left;
        margin-top: 12px;
    }
    .overtime-out-field label {
        display: block;
        font-size: 17px;
        font-weight: bold;
        color: #555;
        margin-bottom: 6px;
    }
    .overtime-out-field select,
    .overtime-out-field textarea {
        width: 100%;
        padding: 12px;
        font-size: 19px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-family: inherit;
        background: white;
    }
    .overtime-out-field textarea {
        min-height: 76px;
        resize: vertical;
    }

    /* ====== 進站授權碼遮罩 ====== */
    #accessGateOverlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #1b2a5e;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        padding: 20px;
        box-sizing: border-box;
    }
    #accessGateOverlay.hidden { display: none; }
    .gate-box {
        background: white;
        color: #333;
        width: 100%;
        max-width: 320px;
        border-radius: 14px;
        padding: 30px 24px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .gate-box h2 { margin: 0 0 16px; font-size: 22px; color: #1b2a5e; }
    .gate-box input {
        width: 100%; padding: 14px; font-size: 20px; margin-bottom: 12px;
        border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box;
        text-align: center; letter-spacing: 2px;
    }
    .gate-box button {
        width: 100%; padding: 14px 0; font-size: 19px; font-weight: bold;
        background: #e0752c; color: white; border: none; border-radius: 8px;
        cursor: pointer;
    }
    .gate-box .gate-error {
        color: #c62828; font-size: 16px; margin-top: 10px; min-height: 18px;
    }
</style>
