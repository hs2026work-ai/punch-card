<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宏升工業社｜請假審核</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 16px 50px;
      background: #f3f6fb;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      color: #263238;
    }

    .container {
      width: 100%;
      max-width: 560px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      color: #17386b;
    }

    .header p {
      margin: 8px 0 0;
      color: #718096;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, .08);
    }

    .loading {
      text-align: center;
      padding: 35px 10px;
      color: #718096;
    }

    .row {
      padding: 12px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .row:last-child {
      border-bottom: none;
    }

    .label {
      font-size: 13px;
      color: #8a94a6;
      margin-bottom: 5px;
    }

    .value {
      font-size: 16px;
      font-weight: 600;
      word-break: break-word;
    }

    .reason {
      line-height: 1.6;
    }

    .status-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: #f7f8fb;
      text-align: center;
      font-weight: 700;
      display: none;
    }

    .button-area {
      display: flex;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      min-height: 54px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: .15s;
    }

    .approve {
      color: #fff;
      background: #27864a;
    }

    .reject {
      color: #9b2633;
      background: #f4e7e9;
    }

    button:disabled {
      background: #d1d5db !important;
      color: #7b818a !important;
      cursor: not-allowed;
      opacity: 1;
    }

    .processing {
      background: #fff7dc;
      color: #9a6500;
    }

    .success {
      background: #e8f6ed;
      color: #21733f;
    }

    .rejected,
    .error {
      background: #fdecec;
      color: #a32934;
    }

    .processed {
      background: #eef1f5;
      color: #667085;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>請假審核</h1>
      <p id="reviewerText">正在確認審核資料…</p>
    </div>

    <div class="card">
      <div id="loading" class="loading">
        資料讀取中…
      </div>

      <button
        id="retryBtn"
        class="hidden"
        onclick="window.location.reload()"
      >
        重新載入
      </button>

      <div id="detail" class="hidden">
        <div class="row">
          <div class="label">員工</div>
          <div class="value" id="employee"></div>
        </div>

        <div class="row">
          <div class="label">假別</div>
          <div class="value" id="leaveType"></div>
        </div>

        <div class="row">
          <div class="label">起訖時間</div>
          <div class="value" id="leaveTime"></div>
        </div>

        <div class="row">
          <div class="label">事由</div>
          <div class="value reason" id="reason"></div>
        </div>

        <div id="statusBox" class="status-box"></div>

        <div id="buttonArea" class="button-area">
          <button
            id="approveBtn"
            class="approve"
            onclick="submitReview('approve')"
          >
            同意
          </button>

          <button
            id="rejectBtn"
            class="reject"
            onclick="submitReview('reject')"
          >
            拒絕
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LIFF_ID = '2010875519-qVP2Xoag';

    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec';

    let LINE_USER_ID = '';
    let ROW = null;
    let STAGE = null;
    let submitting = false;

    // ===== 讀取審核連結參數 =====
    function getApprovalParams() {
      const urlParams = new URLSearchParams(
        window.location.search
      );

      let row = urlParams.get('row');
      let stage = urlParams.get('stage');

      if (row && stage) {
        return { row, stage };
      }

      // 相容 LIFF 包在 liff.state 裡面的參數。
      const liffState = urlParams.get('liff.state');

      if (liffState) {
        try {
          // URLSearchParams 已解碼一次，不再重複解碼。
          const decoded = liffState;
          const qIndex = decoded.indexOf('?');

          const query = qIndex >= 0
            ? decoded.substring(qIndex + 1).split('#')[0]
            : decoded.replace(/^\?/, '');

          const stateParams = new URLSearchParams(query);

          row = stateParams.get('row');
          stage = stateParams.get('stage');

          if (row && stage) {
            return { row, stage };
          }
        } catch (error) {
          console.log('liff.state 解析失敗', error);
        }
      }

      return { row: '', stage: '' };
    }

    // ===== 初始化 =====
    async function init() {
      try {
        disableButtons();

        // 動態載入 SDK，避免 SDK 卡住時整頁無法顯示。
        await loadLiffSdk();

        document.getElementById('loading').textContent =
          '正在連線 LINE…';

        await withTimeout(
          liff.init({ liffId: LIFF_ID }),
          20000,
          'LINE 初始化逾時，請確認網路後重新載入。'
        );

        // 初始化完成後才讀取參數。
        const params = getApprovalParams();

        ROW = Number(params.row);
        STAGE = Number(params.stage);

        if (
          !Number.isSafeInteger(ROW) ||
          ROW <= 0 ||
          !Number.isSafeInteger(STAGE) ||
          STAGE <= 0
        ) {
          showFatal(
            '審核連結資料不完整，請從原始請假通知重新開啟。'
          );
          return;
        }

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: window.location.href
          });
          return;
        }

        const profile = await withTimeout(
          liff.getProfile(),
          15000,
          '讀取 LINE 身分逾時，請重新載入。'
        );

        LINE_USER_ID = profile.userId;

        if (!LINE_USER_ID) {
          throw new Error(
            '無法取得 LINE 身分，請重新開啟通知。'
          );
        }

        document.getElementById('loading').textContent =
          '正在讀取假單…';

        await loadDetail();
      } catch (error) {
        showFatal('開啟審核頁失敗：' + error.message);
      }
    }

    // ===== 讀取假單 =====
    async function loadDetail() {
      try {
        const data = await requestJson(GAS_URL, {
          method: 'POST',

          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },

          body: JSON.stringify({
            action: 'getApprovalDetail',
            userId: LINE_USER_ID,
            row: ROW,
            stage: STAGE
          })
        });

        if (!data.success) {
          showFatal(data.message || '讀取假單失敗。');
          return;
        }

        document.getElementById('loading')
          .classList.add('hidden');

        document.getElementById('detail')
          .classList.remove('hidden');

        document.getElementById('reviewerText').textContent =
          data.reviewer + '審核';

        document.getElementById('employee').textContent =
          data.empName + '（' + data.empId + '）';

        document.getElementById('leaveType').textContent =
          data.leaveType;

        document.getElementById('leaveTime').textContent =
          data.startDate + ' ' + data.startTime +
          ' ～ ' +
          data.endDate + ' ' + data.endTime;

        document.getElementById('reason').textContent =
          data.reason || '－';

        enableButtons();

        if (data.processed) {
          disableButtons();

          showStatus(
            data.currentStatus === '已核准'
              ? '✅ 此筆已同意'
              : data.currentStatus === '已拒絕'
                ? '❌ 此筆已拒絕'
                : '此階段已免審',
            'processed'
          );

          return;
        }

        if (data.currentStatus !== '審核中') {
          disableButtons();

          showStatus(
            '目前尚未輪到此階段審核',
            'processed'
          );
        }
      } catch (error) {
        showFatal('讀取資料失敗：' + error.message);
      }
    }

    // ===== 送出審核 =====
    async function submitReview(action) {
      if (submitting) {
        return;
      }

      submitting = true;
      disableButtons();

      showStatus(
        action === 'approve'
          ? '處理中：正在同意此筆申請…'
          : '處理中：正在拒絕此筆申請…',
        'processing'
      );

      try {
        const data = await requestJson(GAS_URL, {
          method: 'POST',

          headers: {
            'Content-Type': 'text/plain;charset=utf-8'
          },

          body: JSON.stringify({
            action: 'submitApprovalV2',
            userId: LINE_USER_ID,
            row: ROW,
            stage: STAGE,
            reviewAction: action
          })
        });

        if (data.success) {
          if (data.result === 'approved') {
            showStatus(
              '✅ 已同意該筆請假申請',
              'success'
            );
          } else {
            showStatus(
              '❌ 已拒絕該筆請假申請',
              'rejected'
            );
          }

          // 完成後保持按鈕停用。
          submitting = true;
          return;
        }

        if (data.alreadyProcessed) {
          showStatus(data.message, 'processed');
          submitting = true;
          return;
        }

        showStatus(
          '⚠️ ' + (data.message || '審核失敗'),
          'error'
        );

        enableButtons();
        submitting = false;
      } catch (error) {
        showStatus(
          '⚠️ 未能確認審核結果，請重新載入查看最新狀態。請勿連續送出。',
          'error'
        );

        document.getElementById('retryBtn')
          .classList.remove('hidden');

        // 連線中斷時，後端仍可能已完成寫入。
        // 保持停用，重新載入確認狀態後再操作。
        submitting = true;
      }
    }

    // ===== 畫面控制 =====
    function disableButtons() {
      document.getElementById('approveBtn').disabled = true;
      document.getElementById('rejectBtn').disabled = true;
    }

    function enableButtons() {
      document.getElementById('approveBtn').disabled = false;
      document.getElementById('rejectBtn').disabled = false;
    }

    function showStatus(text, type) {
      const box = document.getElementById('statusBox');

      box.style.display = 'block';
      box.className = 'status-box ' + type;
      box.textContent = text;
    }

    function showFatal(message) {
      const loading = document.getElementById('loading');

      loading.classList.remove('hidden');
      loading.textContent = '⚠️ ' + message;

      document.getElementById('detail')
        .classList.add('hidden');

      document.getElementById('reviewerText').textContent =
        '未能完成載入';

      document.getElementById('retryBtn')
        .classList.remove('hidden');

      disableButtons();
    }

    // ===== 非同步作業逾時處理 =====
    function withTimeout(promise, ms, message) {
      let timer;

      return Promise.race([
        promise,
        new Promise((_, reject) => {
          timer = setTimeout(() => {
            reject(new Error(message));
          }, ms);
        })
      ]).finally(() => {
        clearTimeout(timer);
      });
    }

    // ===== 載入 LINE SDK =====
    function loadLiffSdk() {
      if (window.liff) {
        return Promise.resolve();
      }

      const loadingPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');

        script.src =
          'https://static.line-scdn.net/liff/edge/2/sdk.js';

        script.async = true;

        script.onload = () => {
          if (window.liff) {
            resolve();
          } else {
            reject(new Error('LINE 元件無法使用。'));
          }
        };

        script.onerror = () => {
          reject(new Error(
            'LINE 元件載入失敗，請確認網路後重新載入。'
          ));
        };

        document.head.appendChild(script);
      });

      return withTimeout(
        loadingPromise,
        15000,
        'LINE 元件載入逾時，請確認網路後重新載入。'
      );
    }

    // ===== 後端請求：包含逾時與回傳檢查 =====
    async function requestJson(url, options) {
      const controller = new AbortController();

      const timer = setTimeout(() => {
        controller.abort();
      }, 25000);

      try {
        const response = await fetch(url, {
          ...options,
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(
            '伺服器回應異常（HTTP ' +
            response.status +
            '），請稍後重試。'
          );
        }

        let data;

        try {
          data = await response.json();
        } catch (error) {
          if (error.name === 'AbortError') {
            throw error;
          }

          throw new Error(
            '伺服器未回傳有效資料，請確認 Apps Script 部署與存取設定。'
          );
        }

        if (
          !data ||
          typeof data !== 'object' ||
          typeof data.success !== 'boolean'
        ) {
          throw new Error(
            '伺服器回傳格式不正確，請聯絡管理者。'
          );
        }

        return data;
      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error(
            '連線逾時，請確認網路後重新載入。'
          );
        }

        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    init();
  </script>
</body>
</html>
