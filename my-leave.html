<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>宏升工業社 - 個人假勤</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


    <style>

        /* ==================================================
           防止 iPhone / LINE LIFF 自動把字放大
           ================================================== */

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }


        * {
            box-sizing: border-box;
        }


        body {

            font-family:
                "Microsoft JhengHei",
                "PingFang TC",
                Arial,
                sans-serif;

            font-size: 16px;

            background: #f5f5f5;

            color: #333;

            margin: 0;

            padding: 20px 16px 60px;

            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }


        /* ==================================================
           標題
           ================================================== */

        h1 {

            font-size: 20px;

            font-weight: 700;

            color: #1b2a5e;

            text-align: center;

            margin: 10px 0 4px;
        }


        .subtitle {

            text-align: center;

            font-size: 13px;

            color: #888;

            margin-bottom: 20px;
        }


        /* ==================================================
           卡片
           ================================================== */

        .card {

            background: white;

            border-radius: 12px;

            border-top: 4px solid #e0752c;

            padding: 20px 18px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);

            max-width: 420px;

            margin: 0 auto 16px;
        }


        .card h2 {

            font-size: 18px;

            line-height: 1.5;

            font-weight: 700;

            color: #1b2a5e;

            margin: 0 0 14px;
        }


        /* ==================================================
           員工
           ================================================== */

        .empName {

            text-align: center;

            font-size: 15px;

            color: #666;

            margin-bottom: 16px;
        }


        /* ==================================================
           假勤三格
           ================================================== */

        .quota-grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 8px;
        }


        .quota-box {

            background: #f5f7fa;

            border-radius: 10px;

            padding: 12px 5px;

            text-align: center;

            min-width: 0;
        }


        .quota-box .label {

            color: #888;

            margin-bottom: 7px;

            min-height: 55px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .quota-box .label-zh {

            font-size: 16px;

            line-height: 1.3;

            color: #555;

            font-weight: bold;
        }


        .quota-box .label-vi {

            font-size: 11px;

            line-height: 1.35;

            color: #999;

            margin-top: 4px;
        }


        /* 剩餘時數 */

        .quota-box .remaining {

            font-size: 19px;

            line-height: 1.35;

            font-weight: bold;

            color: #e0752c;

            min-height: 52px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow-wrap: anywhere;
        }


        /* 已休 / 共 */

        .quota-box .detail {

            font-size: 12px;

            line-height: 1.55;

            color: #999;

            margin-top: 5px;
        }


        /* ==================================================
           家庭照顧假 / 生理假
           ================================================== */

        .extra-info {

            margin-top: 14px;

            padding-top: 12px;

            border-top: 1px dashed #ddd;
        }


        .extra-info-item {

            font-size: 14px;

            color: #555;

            text-align: center;

            line-height: 1.8;

            margin: 2px 0;
        }


        /* ==================================================
           備註
           ================================================== */

        .policy-note {

            margin-top: 14px;

            padding: 12px 14px;

            background: #f9f6f1;

            border-radius: 8px;

            font-size: 13px;

            color: #888;

            text-align: left;

            line-height: 1.8;
        }


        .policy-note-title {

            font-size: 14px;

            color: #777;

            font-weight: bold;

            margin-bottom: 5px;
        }


        /* ==================================================
           請假紀錄
           ================================================== */

        .record-item {

            border-bottom: 1px solid #eee;

            padding: 12px 0;
        }


        .record-item:last-child {

            border-bottom: none;
        }


        .record-top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 8px;

            font-size: 15px;

            font-weight: bold;

            color: #1b2a5e;
        }


        .record-date {

            font-size: 13px;

            color: #666;

            margin-top: 4px;
        }


        .record-status {

            font-size: 13px;

            margin-top: 6px;
        }


        .record-days {

            font-size: 13px;

            color: #999;

            white-space: nowrap;
        }


        .stage-row {

            display: flex;

            gap: 10px;

            flex-wrap: wrap;

            font-size: 12px;

            color: #555;

            margin-top: 8px;
        }


        /* ==================================================
           系統訊息
           ================================================== */

        #loading {

            text-align: center;

            padding: 60px 0;

            color: #888;
        }


        #errorMsg {

            text-align: center;

            color: #c62828;

            font-size: 15px;

            max-width: 420px;

            margin: 40px auto;

            padding: 0 16px;

            line-height: 1.8;
        }


        .no-record {

            text-align: center;

            color: #999;

            font-size: 14px;

            padding: 20px 0;
        }


        /* ==================================================
           小螢幕再縮一點
           ================================================== */

        @media (max-width: 380px) {

            body {
                padding-left: 10px;
                padding-right: 10px;
            }


            .card {
                padding-left: 12px;
                padding-right: 12px;
            }


            .quota-grid {
                gap: 5px;
            }


            .quota-box {
                padding-left: 3px;
                padding-right: 3px;
            }


            .quota-box .label-zh {
                font-size: 15px;
            }


            .quota-box .label-vi {
                font-size: 10px;
            }


            .quota-box .remaining {
                font-size: 17px;
            }


            .quota-box .detail {
                font-size: 11px;
            }

        }

    </style>

</head>


<body>


    <div id="loading">
        載入中，請稍候...
    </div>


    <div
        id="errorMsg"
        style="display:none;"
    ></div>



    <div
        id="mainWrap"
        style="display:none;"
    >


        <h1>
            宏升工業社
        </h1>


        <div class="subtitle">
            個人假勤查詢
        </div>



        <!-- ==================================================
             假勤額度
             ================================================== -->

        <div class="card">


            <div
                class="empName"
                id="empNameDisplay"
            ></div>


            <h2>
                📊 假勤額度 Hạn mức nghỉ phép
                <br>
                （<span id="quotaYear"></span> 年度）
            </h2>



            <div class="quota-grid">


                <!-- 特別假 -->

                <div class="quota-box">

                    <div class="label">

                        <span class="label-zh">
                            特別假
                        </span>

                        <span class="label-vi">
                            Nghỉ phép đặc biệt
                        </span>

                    </div>


                    <div
                        class="remaining"
                        id="specialRemaining"
                    >
                        -
                    </div>


                    <div
                        class="detail"
                        id="specialDetail"
                    ></div>

                </div>



                <!-- 事假 -->

                <div class="quota-box">

                    <div class="label">

                        <span class="label-zh">
                            事假
                        </span>

                        <span class="label-vi">
                            Xin nghỉ
                        </span>

                    </div>


                    <div
                        class="remaining"
                        id="personalRemaining"
                    >
                        -
                    </div>


                    <div
                        class="detail"
                        id="personalDetail"
                    ></div>

                </div>



                <!-- 病假 -->

                <div class="quota-box">

                    <div class="label">

                        <span class="label-zh">
                            病假
                        </span>

                        <span class="label-vi">
                            Nghỉ ốm
                        </span>

                    </div>


                    <div
                        class="remaining"
                        id="sickRemaining"
                    >
                        -
                    </div>


                    <div
                        class="detail"
                        id="sickDetail"
                    ></div>

                </div>


            </div>



            <!-- ==================================================
                 家庭照顧假 / 生理假
                 ================================================== -->

            <div
                class="extra-info"
                id="extraInfo"
                style="display:none;"
            >


                <div
                    class="extra-info-item"
                    id="familyCareInfo"
                ></div>


                <div
                    class="extra-info-item"
                    id="menstrualInfo"
                    style="display:none;"
                ></div>


            </div>



            <!-- ==================================================
                 備註
                 ================================================== -->

            <div class="policy-note">


                <div class="policy-note-title">
                    備註：
                </div>


                <div>
                    ・家庭照顧假依公司假勤規則管理
                </div>


                <div>
                    ・女性員工因生理期間工作有困難者，每月可請生理假 1 日
                </div>


                <div>
                    ・生理假前 3 日不列入病假天數，第 4 日起列入病假天數
                </div>


            </div>


        </div>



        <!-- ==================================================
             請假紀錄
             ================================================== -->

        <div class="card">


            <h2>
                📋 請假紀錄 bản ghi
            </h2>


            <div id="recordList"></div>


        </div>


    </div>



<script>


    /* =========================================================
       基本設定
       ========================================================= */

    var APPS_SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec";


    var LIFF_ID =
        "2010875519-HfpuEzI8";



    /* =========================================================
       錯誤
       ========================================================= */

    function showError(message) {

        document.getElementById(
            'loading'
        ).style.display =
            'none';


        document.getElementById(
            'mainWrap'
        ).style.display =
            'none';


        var el =
            document.getElementById(
                'errorMsg'
            );


        el.style.display =
            'block';


        el.innerText =
            message;

    }



    /* =========================================================
       性別
       ========================================================= */

    function isFemale(data) {

        var g =
            String(
                data.gender || ''
            )
            .trim()
            .toLowerCase();


        return (
            g === '女' ||
            g === 'f' ||
            g === 'female'
        );

    }



    /* =========================================================
       從字串抓第一個數字
       
       支援：
       56
       56.0
       56.0時（7天）
       ========================================================= */

    function getFirstNumber(value) {

        if (
            value === null ||
            value === undefined ||
            value === ''
        ) {

            return 0;

        }


        if (
            typeof value ===
            'number'
        ) {

            return value;

        }


        var match =
            String(value)
                .replace(/,/g, '')
                .match(
                    /-?\d+(?:\.\d+)?/
                );


        if (!match) {

            return 0;

        }


        return Number(
            match[0]
        );

    }



    /* =========================================================
       固定 1 位小數
       ========================================================= */

    function formatHourNumber(value) {

        var n =
            Number(value);


        if (!isFinite(n)) {

            n = 0;

        }


        return n.toFixed(1);

    }



    /* =========================================================
       小時 → 小時（天數）
       
       56 → 56.0時（7天）
       52.5 → 52.5時（6天4.5時）
       ========================================================= */

    function formatHourAndDay(value) {

        var hours =
            getFirstNumber(value);


        if (!isFinite(hours)) {

            hours = 0;

        }


        var days =
            Math.floor(
                hours / 8
            );


        var remainHours =
            Math.round(
                (hours % 8) * 10
            ) / 10;


        var text =
            formatHourNumber(
                hours
            ) +
            '時（' +
            days +
            '天';


        if (
            remainHours > 0
        ) {

            text +=
                formatHourNumber(
                    remainHours
                ) +
                '時';

        }


        text +=
            '）';


        return text;

    }



    /* =========================================================
       額度細節
       
       已休 8.0時 / 共 56.0時（7天）
       ========================================================= */

    function formatQuotaDetail(
        used,
        total
    ) {

        var usedHours =
            getFirstNumber(
                used
            );


        var totalHours =
            getFirstNumber(
                total
            );


        return (
            '已休 ' +
            formatHourNumber(
                usedHours
            ) +
            '時 / 共 ' +
            formatHourAndDay(
                totalHours
            )
        );

    }



    /* =========================================================
       顯示額度
       ========================================================= */

    function renderSummary(data) {


        document.getElementById(
            'empNameDisplay'
        ).innerText =

            data.empName +
            '（' +
            data.empId +
            '）';



        /* =====================================================
           特別假 / 事假 / 病假
           ===================================================== */

        if (data.quota) {


            document.getElementById(
                'quotaYear'
            ).innerText =
                data.quota.year;



            /* 特別假 */

            document.getElementById(
                'specialRemaining'
            ).innerText =

                formatHourAndDay(
                    data.quota
                        .special
                        .remaining
                );


            document.getElementById(
                'specialDetail'
            ).innerText =

                formatQuotaDetail(

                    data.quota
                        .special
                        .used,

                    data.quota
                        .special
                        .total

                );



            /* 事假 */

            document.getElementById(
                'personalRemaining'
            ).innerText =

                formatHourAndDay(
                    data.quota
                        .personal
                        .remaining
                );


            document.getElementById(
                'personalDetail'
            ).innerText =

                formatQuotaDetail(

                    data.quota
                        .personal
                        .used,

                    data.quota
                        .personal
                        .total

                );



            /* 病假 */

            document.getElementById(
                'sickRemaining'
            ).innerText =

                formatHourAndDay(
                    data.quota
                        .sick
                        .remaining
                );


            document.getElementById(
                'sickDetail'
            ).innerText =

                formatQuotaDetail(

                    data.quota
                        .sick
                        .used,

                    data.quota
                        .sick
                        .total

                );


        } else {


            document.getElementById(
                'quotaYear'
            ).innerText =
                '尚無資料';


        }



        /* =====================================================
           家庭照顧假 / 生理假
           
           ★ 現在改成小時制顯示
           不再顯示「次」
           ===================================================== */

        var extraInfoEl =
            document.getElementById(
                'extraInfo'
            );


        var familyCareEl =
            document.getElementById(
                'familyCareInfo'
            );


        var menstrualEl =
            document.getElementById(
                'menstrualInfo'
            );



        /* 家庭照顧假 */

        if (
            data.familyCare
        ) {


            familyCareEl.innerText =

                '家庭照顧假　' +

                '已休 ' +
                formatHourNumber(
                    getFirstNumber(
                        data.familyCare.used
                    )
                ) +
                '時' +

                '｜剩餘 ' +
                formatHourAndDay(
                    data.familyCare.remaining
                ) +

                '｜共 ' +
                formatHourAndDay(
                    data.familyCare.total
                );


            familyCareEl.style.display =
                'block';


        } else {


            familyCareEl.innerText =
                '';


            familyCareEl.style.display =
                'none';

        }



        /* 生理假 */

        if (
            isFemale(data) &&
            data.menstrual
        ) {


            menstrualEl.innerText =

                '生理假　' +

                '已休 ' +
                formatHourNumber(
                    getFirstNumber(
                        data.menstrual.used
                    )
                ) +
                '時' +

                '｜剩餘 ' +
                formatHourAndDay(
                    data.menstrual.remaining
                ) +

                '｜共 ' +
                formatHourAndDay(
                    data.menstrual.total
                );


            menstrualEl.style.display =
                'block';


        } else {


            menstrualEl.innerText =
                '';


            menstrualEl.style.display =
                'none';

        }



        extraInfoEl.style.display =

            (
                data.familyCare ||

                (
                    isFemale(data) &&
                    data.menstrual
                )
            )

            ? 'block'
            : 'none';



        /* =====================================================
           請假紀錄
           ===================================================== */

        var listEl =
            document.getElementById(
                'recordList'
            );


        listEl.innerHTML =
            '';



        if (
            !data.records ||
            data.records.length === 0
        ) {


            listEl.innerHTML =
                '<div class="no-record">' +
                '目前尚無請假紀錄' +
                '</div>';


        } else {


            function formatDays(val) {


                if (
                    val === null ||
                    val === undefined ||
                    val === ''
                ) {

                    return val;

                }


                return (
                    Math.round(
                        Number(val) *
                        100
                    ) / 100
                );

            }



            function stageIcon(val) {


                if (
                    val === '已核准' ||
                    val === '免審'
                ) {

                    return '✅';

                }


                if (
                    val === '已拒絕'
                ) {

                    return '❌';

                }


                if (
                    val === '審核中'
                ) {

                    return '🟡';

                }


                return '⚪';

            }



            data.records.forEach(
                function(rec) {


                    var div =
                        document.createElement(
                            'div'
                        );


                    div.className =
                        'record-item';



                    div.innerHTML =

                        '<div class="record-top">' +

                            '<span>' +
                                rec.leaveType +
                            '</span>' +

                            '<span class="record-days">' +
                                formatDays(
                                    rec.days
                                ) +
                                ' 天' +
                            '</span>' +

                        '</div>' +


                        '<div class="record-date">' +

                            rec.startDate +
                            ' ~ ' +
                            rec.endDate +

                        '</div>' +


                        '<div class="record-status">' +

                            rec.status +

                        '</div>' +


                        '<div class="stage-row">' +

                            '<span>' +
                                stageIcon(
                                    rec.foreman
                                ) +
                                ' 廠長' +
                            '</span>' +

                            '<span>' +
                                stageIcon(
                                    rec.manager
                                ) +
                                ' 主管' +
                            '</span>' +

                            '<span>' +
                                stageIcon(
                                    rec.sectionChief
                                ) +
                                ' 課長' +
                            '</span>' +

                            '<span>' +
                                stageIcon(
                                    rec.hr
                                ) +
                                ' 人事' +
                            '</span>' +

                        '</div>';


                    listEl.appendChild(
                        div
                    );


                }
            );

        }



        document.getElementById(
            'loading'
        ).style.display =
            'none';


        document.getElementById(
            'mainWrap'
        ).style.display =
            'block';

    }



    /* =========================================================
       讀取資料
       ========================================================= */

    function loadSummary(userId) {


        fetch(
            APPS_SCRIPT_URL,
            {

                method:
                    'POST',

                headers: {

                    'Content-Type':
                        'text/plain;charset=utf-8'

                },

                body:
                    JSON.stringify({

                        action:
                            'getMyLeaveSummary',

                        userId:
                            userId

                    })

            }
        )

        .then(
            function(r) {

                return r.json();

            }
        )

        .then(
            function(data) {


                if (
                    data.success
                ) {

                    renderSummary(
                        data
                    );

                } else {

                    showError(
                        '⚠️ ' +
                        data.message
                    );

                }

            }
        )

        .catch(
            function() {

                showError(
                    '⚠️ 連線失敗，請確認網路連線後重新開啟一次'
                );

            }
        );

    }



    /* =========================================================
       LIFF
       ========================================================= */

    liff.init({
        liffId:
            LIFF_ID
    })

    .then(
        function() {


            if (
                !liff.isLoggedIn()
            ) {

                liff.login();

                return;

            }


            return liff.getProfile();

        }
    )

    .then(
        function(profile) {


            if (!profile) {

                return;

            }


            loadSummary(
                profile.userId
            );

        }
    )

    .catch(
        function(err) {


            showError(
                '載入失敗，請關閉重新從 LINE 對話開啟一次'
            );


        }
    );


</script>


</body>

</html>
