<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>宏升工業社 - 補登</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: #f5f5f5;
      color: #333;
      margin: 0;
      padding: 20px 16px 60px;
    }

    h1 {
      font-size: 22px;
      color: #1b2a5e;
      text-align: center;
      margin: 10px 0 4px;
    }

    .subtitle {
      text-align: center;
      font-size: 15px;
      color: #888;
      margin-bottom: 10px;
    }

    .version {
      text-align: center;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 14px;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      border-top: 4px solid #e0752c;
      padding: 24px 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      max-width: 420px;
      margin: 0 auto;
    }

    #empInfo {
      padding: 13px 14px;
      margin-bottom: 18px;
      background: #eef3fa;
      border-radius: 8px;
      color: #1b2a5e;
      line-height: 1.6;
    }

    #empName {
      font-size: 19px;
      font-weight: bold;
    }

    #empId {
      font-size: 14px;
      color: #666;
      margin-top: 3px;
    }

    label {
      display: block;
      font-size: 15px;
      color: #666;
      margin: 18px 0 6px;
      font-weight: bold;
    }

    select,
    input,
    textarea {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: inherit;
      background: #fff;
      color: #333;
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    .time-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .time-row select {
      flex: 1;
      text-align: center;
    }

    .colon {
      font-size: 20px;
      font-weight: bold;
    }

    .hint {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff4e8;
      color: #a95416;
      line-height: 1.6;
      font-size: 14px;
    }

    .green-hint {
      background: #edf7ee;
      color: #1b5e20;
    }

    .hidden {
      display: none !important;
    }

    button {
      width: 100%;
      padding: 15px 0;
      font-size: 18px;
      font-weight: bold;
      background: #e0752c;
      color: #fff;
      border: none;
      border-radius: 8px;
      margin-top: 22px;
      cursor: pointer;
    }

    button:disabled {
      background: #ccc;
      color: #666;
    }

    #statusMsg {
      text-align: center;
      font-size: 15px;
      line-height: 1.7;
      margin-top: 14px;
      min-height: 22px;
      white-space: pre-line;
    }

    #statusMsg.error {
      color: #c62828;
    }

    #statusMsg.success {
      color: #1b5e20;
    }

    #loading {
      text-align: center;
      padding: 60px 10px;
      color: #888;
      font-size: 16px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <!-- HS021 測試提示 -->
  <div
    id="testBanner"
    class="hint"
    style="display:none;max-width:420px;margin:0 auto 20px;border:2px solid #e0752c;"
  ></div>

  <!-- 拒絕原因頁 -->
  <div id="rejectWrap" style="display:none;">
    <h1>晚回來補登通知</h1>

    <div class="card">
      <div
        id="rejectSummary"
        style="white-space:pre-wrap;line-height:1.9;"
      ></div>

      <div class="hint">
        拒絕原因會通知員工與人事。
        打卡紀錄仍保留，由人事確認後手動更正或刪除。
      </div>

      <label for="rejectReason">拒絕原因（必填）</label>

      <textarea
        id="rejectReason"
        maxlength="500"
        placeholder="請說明這筆補登有哪些問題"
      ></textarea>

      <button id="rejectBtn" onclick="submitRejection()">
        送出拒絕原因
      </button>

      <div
        id="rejectStatus"
        role="status"
        style="white-space:pre-wrap;line-height:1.7;margin-top:14px;"
      ></div>
    </div>
  </div>

  <div id="loading">
    載入中，請稍候...
  </div>

  <!-- 補登頁 -->
  <div id="formWrap" style="display:none;">
    <h1>宏升工業社</h1>

    <div class="subtitle">出勤補登</div>
    <div class="version">V8.6・補登通知版</div>

    <div class="card">
      <div id="empInfo">
        <div id="empName">員工資料載入中...</div>
        <div id="empId"></div>
      </div>

      <label for="makeupDate">補登日期</label>
      <input type="date" id="makeupDate">

      <div class="hint green-hint">
        僅可選擇今天或過去日期，不可選未來日期。
      </div>

      <label for="makeupType">補登項目</label>

      <select id="makeupType">
        <option value="">請選擇...</option>
        <option value="中午未休息">
          中午未休息（12:00～13:00）
        </option>
        <option value="下午未休息">
          下午未休息（17:00～17:30）
        </option>
        <option value="提前上班">提前上班</option>
        <option value="加班(外出)">加班（外出）晚回來</option>
      </select>

      <div id="lunchBlock" class="hidden">
        <div class="hint">
          中午休息時間為 <b>12:00～13:00</b>。
          <br>
          若此時段實際有工作，請使用此項補登。
        </div>
      </div>

      <div id="afternoonBlock" class="hidden">
        <div class="hint">
          下午休息時間為 <b>17:00～17:30</b>。
          <br>
          若此時段實際有工作，請使用此項補登。
        </div>
      </div>

      <div id="earlyBlock" class="hidden">
        <label>實際到班時間</label>

        <div class="time-row">
          <select id="earlyHour"></select>
          <span class="colon">:</span>

          <select id="earlyMinute">
            <option value="00">00 分</option>
            <option value="30">30 分</option>
          </select>
        </div>

        <div class="hint">
          提前上班可補登 05:00～07:30。
          <br>
          系統以 <b>0.5 小時</b> 為單位計算。
        </div>
      </div>

      <div id="overtimeBlock" class="hidden">
        <label>實際下班時間</label>

        <div class="time-row">
          <select id="overtimeHour"></select>
          <span class="colon">:</span>

          <select id="overtimeMinute">
            <option value="00">00 分</option>
            <option value="30">30 分</option>
          </select>
        </div>

        <label for="reason">事由</label>

        <textarea
          id="reason"
          maxlength="200"
          placeholder="例如：送貨晚回、客戶現場處理、忘記打下班卡"
        ></textarea>

        <div class="hint">
          若補登日期為今天，晚回來時間不得晚於目前時間。
          <br>
          事由請填寫清楚。補登後立即寫入，並通知相關人員。
        </div>
      </div>

      <button id="submitBtn" onclick="submitMakeup()">
        送出補登
      </button>

      <div id="statusMsg"></div>
    </div>
  </div>

  <script>
    // ==================================================
    // V8.6：補登、拒絕原因與 HS021 隔離測試
    // 沿用原 Apps Script 網址與 LIFF ID
    // ==================================================

    var APPS_SCRIPT_URL =
      'https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec';

    var LIFF_ID = '2010875519-nrqXot3W';

    var currentEmpId = '';
    var currentEmpName = '';
    var isSubmitting = false;
    var pageParams;

    // ==================================================
    // 共用
    // ==================================================

    function pad2(value) {
      return String(value).padStart(2, '0');
    }

    function getLocalDateString(date) {
      var taipei = new Date(date.getTime() + 8 * 3600000);

      return (
        taipei.getUTCFullYear() +
        '-' +
        pad2(taipei.getUTCMonth() + 1) +
        '-' +
        pad2(taipei.getUTCDate())
      );
    }

    function showStatus(message, isError) {
      var el = document.getElementById('statusMsg');

      el.textContent = message;
      el.className = isError ? 'error' : 'success';
    }

    // ==================================================
    // 日期與時間選單
    // ==================================================

    function initializeDate() {
      var input = document.getElementById('makeupDate');

      input.value = input.max = getLocalDateString(new Date());
    }

    function initializeTimeSelects() {
      [
        ['earlyHour', 5, 7, '時'],
        ['overtimeHour', 0, 23, '時'],
        ['overtimeMinute', 0, 59, '分']
      ].forEach(function (spec) {
        var select = document.getElementById(spec[0]);

        select.innerHTML = '';

        for (var n = spec[1]; n <= spec[2]; n++) {
          var option = document.createElement('option');

          option.value = pad2(n);
          option.textContent = pad2(n) + ' ' + spec[3];

          select.appendChild(option);
        }
      });

      document.getElementById('earlyHour').value = '07';
      document.getElementById('overtimeHour').value = '17';
      document.getElementById('overtimeMinute').value = '00';
    }

    function handleMakeupTypeChange() {
      var type = document.getElementById('makeupType').value;

      var blocks = {
        '中午未休息': 'lunchBlock',
        '下午未休息': 'afternoonBlock',
        '提前上班': 'earlyBlock',
        '加班(外出)': 'overtimeBlock'
      };

      Object.keys(blocks).forEach(function (key) {
        document
          .getElementById(blocks[key])
          .classList.toggle('hidden', key !== type);
      });
    }

    // ==================================================
    // API
    // ==================================================

    async function callApi(payload) {
      var test = pageParams && pageParams.get('test');

      payload.testRequired = !!(
        pageParams &&
        (
          pageParams.has('test') ||
          pageParams.get('flow') === 'test'
        )
      );

      if (payload.testRequired && !test) {
        throw new Error('缺少測試連結，沒有送出正式補登');
      }

      if (test) {
        payload.testSession = test;
      }

      var token = liff.getAccessToken();

      if (!token) {
        throw new Error('LINE 登入已失效，請重新開啟頁面');
      }

      payload.accessToken = token;

      var response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',

        headers: {
          'Content-Type': 'text/plain;charset=utf-8'
        },

        body: JSON.stringify(payload),
        cache: 'no-store'
      });

      if (!response.ok) {
        throw new Error('系統連線失敗，請稍後重試');
      }

      var data = await response.json();

      if (!data || data.status !== 'success') {
        throw new Error(
          data && data.message || '系統處理失敗'
        );
      }

      if (data.testMode) {
        var banner = document.getElementById('testBanner');

        banner.style.display = 'block';

        banner.textContent =
          'HS021 隔離測試｜模擬' +
          data.testRole +
          '通知。測試出勤日期：' +
          data.testDate +
          '。所有通知只送人事，正式出勤不受影響。';
      }

      return data;
    }

    // liff.init 完成後才讀取網址參數
    function readPageParams() {
      var params = new URLSearchParams(window.location.search);
      var state = params.get('liff.state');

      if (state) {
        var question = state.indexOf('?');

        var extra = new URLSearchParams(
          question >= 0 ? state.slice(question + 1) : state
        );

        extra.forEach(function (value, key) {
          if (!params.has(key)) {
            params.set(key, value);
          }
        });
      }

      return params;
    }

    function getMakeupLabel(type) {
      return {
        '中午未休息': '中午未休息（12:00～13:00）',
        '下午未休息': '下午未休息（17:00～17:30）',
        '提前上班': '提前上班',
        '加班(外出)': '晚回來'
      }[type] || type;
    }

    // ==================================================
    // 送出補登
    // ==================================================

    async function submitMakeup() {
      if (isSubmitting) {
        return;
      }

      var day = document.getElementById('makeupDate').value;
      var type = document.getElementById('makeupType').value;
      var button = document.getElementById('submitBtn');

      try {
        if (!day || !type) {
          throw new Error('請選擇補登日期與項目');
        }

        if (day > getLocalDateString(new Date())) {
          throw new Error('不可補登未來日期');
        }

        if (!currentEmpId) {
          throw new Error('尚未取得員工資料');
        }

        var payload = {
          action: 'p85Makeup',
          workDate: day,
          reason: type,

          token:
            pageParams.get('flow') === 'late'
              ? pageParams.get('token') || ''
              : ''
        };

        if (type === '提前上班') {
          payload.earlyTime =
            document.getElementById('earlyHour').value +
            ':' +
            document.getElementById('earlyMinute').value;
        }

        if (type === '加班(外出)') {
          payload.overtimeOutTime =
            document.getElementById('overtimeHour').value +
            ':' +
            document.getElementById('overtimeMinute').value;

          payload.overtimeOutMemo =
            document.getElementById('reason').value.trim();

          if (!payload.overtimeOutMemo) {
            throw new Error(
              '請填寫事由，例如送貨晚回或忘記打下班卡'
            );
          }

          var selectedTime = new Date(
            day +
            'T' +
            payload.overtimeOutTime +
            ':00+08:00'
          );

          if (selectedTime > new Date()) {
            throw new Error('下班時間不可晚於目前時間');
          }
        }

        isSubmitting = true;
        button.disabled = true;
        button.textContent = '送出中…';

        showStatus('', false);

        var data = await callApi(payload);

        var text =
          '✅ ' +
          data.message +
          '\n' +
          currentEmpName +
          '（' +
          currentEmpId +
          '）' +
          '\n日期：' +
          day +
          '\n項目：' +
          getMakeupLabel(type);

        if (payload.overtimeOutTime) {
          text += '\n實際下班：' + payload.overtimeOutTime;
        }

        if (payload.earlyTime) {
          text += '\n實際到班：' + payload.earlyTime;
        }

        showStatus(text, false);
        button.textContent = '已完成';

      } catch (err) {
        showStatus('⚠️ ' + err.message, true);

        isSubmitting = false;
        button.disabled = false;
        button.textContent = '送出補登';
      }
    }

    // ==================================================
    // 送出拒絕原因
    // ==================================================

    async function submitRejection() {
      if (isSubmitting) {
        return;
      }

      var button = document.getElementById('rejectBtn');
      var status = document.getElementById('rejectStatus');

      try {
        var reason =
          document.getElementById('rejectReason').value.trim();

        if (!reason) {
          throw new Error('請填寫拒絕原因');
        }

        if (reason.length > 500) {
          throw new Error('拒絕原因最多 500 字');
        }

        isSubmitting = true;
        button.disabled = true;
        button.textContent = '送出中…';

        var data = await callApi({
          action: 'p85Reject',
          token: pageParams.get('token'),
          rejectReason: reason
        });

        status.textContent = '✅ ' + data.message;
        button.textContent = '已送出拒絕原因';

      } catch (err) {
        status.textContent = '⚠️ ' + err.message;

        isSubmitting = false;
        button.disabled = false;
        button.textContent = '送出拒絕原因';
      }
    }

    // ==================================================
    // LIFF 初始化
    // ==================================================

    async function initializeLiff() {
      try {
        initializeDate();
        initializeTimeSelects();

        document
          .getElementById('makeupType')
          .addEventListener('change', handleMakeupTypeChange);

        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login({
            redirectUri: window.location.href
          });

          return;
        }

        pageParams = readPageParams();

        if (pageParams.get('flow') === 'reject') {
          var detail = await callApi({
            action: 'p85RejectDetail',
            token: pageParams.get('token')
          });

          document.getElementById('rejectSummary').textContent =
            detail.summary;

          if (detail.processed) {
            document.getElementById('rejectReason').value =
              detail.rejectReason;

            document.getElementById('rejectReason').disabled =
              true;

            document.getElementById('rejectBtn').disabled =
              true;

            document.getElementById('rejectStatus').textContent =
              '此筆已拒絕，原打卡紀錄仍保留，由人事處理。';
          }

          document.getElementById('rejectWrap').style.display =
            'block';

        } else {
          var data = await callApi({
            action: 'p85Init',

            token:
              pageParams.get('flow') === 'late'
                ? pageParams.get('token') || ''
                : ''
          });

          currentEmpId = data.empId;
          currentEmpName = data.name;

          if (data.testMode && data.testDate) {
            document.getElementById('makeupDate').value =
              data.testDate;
          }

          document.getElementById('empName').textContent =
            currentEmpName;

          document.getElementById('empId').textContent =
            '員工編號：' + currentEmpId;

          if (pageParams.get('flow') === 'late') {
            document.getElementById('makeupType').value =
              '加班(外出)';

            if (data.reminderDate) {
              document.getElementById('makeupDate').value =
                data.reminderDate;

              document.getElementById('makeupDate').disabled =
                true;

              document.getElementById('makeupType').disabled =
                true;
            }

            document.getElementById('reason').value =
              '忘記打下班卡';

            handleMakeupTypeChange();
          }

          document.getElementById('formWrap').style.display =
            'block';
        }

        document.getElementById('loading').style.display =
          'none';

      } catch (err) {
        document.getElementById('loading').textContent =
          '⚠️ ' +
          err.message +
          '。請重新從 LINE 開啟，或聯絡人事。';
      }
    }

    initializeLiff();
  </script>
</body>
</html>
