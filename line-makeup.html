<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>宏升工業社 - 補登</title>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px 16px 60px;
        }

        h1 {
            font-size: 22px;
            color: #1b2a5e;
            text-align: center;
            margin: 10px 0 4px;
        }

        .subtitle {
            text-align: center;
            font-size: 15px;
            color: #888;
            margin-bottom: 10px;
        }

        .version {
            text-align: center;
            font-size: 11px;
            color: #aaa;
            margin-bottom: 14px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            border-top: 4px solid #e0752c;
            padding: 24px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            max-width: 420px;
            margin: 0 auto;
        }

        #empInfo {
            padding: 13px 14px;
            margin-bottom: 18px;
            background: #eef3fa;
            border-radius: 8px;
            color: #1b2a5e;
            line-height: 1.6;
        }

        #empName {
            font-size: 19px;
            font-weight: bold;
        }

        #empId {
            font-size: 14px;
            color: #666;
            margin-top: 3px;
        }

        label {
            display: block;
            font-size: 15px;
            color: #666;
            margin: 18px 0 6px;
            font-weight: bold;
        }

        select,
        input,
        textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-family: inherit;
            background: #fff;
            color: #333;
        }

        textarea {
            min-height: 78px;
            resize: vertical;
        }

        .time-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .time-row select {
            flex: 1;
            text-align: center;
        }

        .colon {
            font-size: 20px;
            font-weight: bold;
        }

        .hint {
            margin-top: 12px;
            padding: 10px 12px;
            border-radius: 8px;
            background: #fff4e8;
            color: #a95416;
            line-height: 1.6;
            font-size: 14px;
        }

        .green-hint {
            background: #edf7ee;
            color: #1b5e20;
        }

        .hidden {
            display: none !important;
        }

        button {
            width: 100%;
            padding: 15px 0;
            font-size: 18px;
            font-weight: bold;
            background: #e0752c;
            color: #fff;
            border: none;
            border-radius: 8px;
            margin-top: 22px;
            cursor: pointer;
        }

        button:disabled {
            background: #ccc;
            color: #666;
        }

        #statusMsg {
            text-align: center;
            font-size: 15px;
            line-height: 1.7;
            margin-top: 14px;
            min-height: 22px;
            white-space: pre-line;
        }

        #statusMsg.error {
            color: #c62828;
        }

        #statusMsg.success {
            color: #1b5e20;
        }

        #loading {
            text-align: center;
            padding: 60px 10px;
            color: #888;
            font-size: 16px;
            line-height: 1.8;
        }

    </style>

</head>


<body>


<div id="loading">
    載入中，請稍候...
</div>


<div
    id="formWrap"
    style="display:none;"
>

    <h1>宏升工業社</h1>

    <div class="subtitle">
        出勤補登
    </div>

    <div class="version">
        LINE 員工綁定版
    </div>


    <div class="card">


        <div id="empInfo">

            <div id="empName">
                員工資料載入中...
            </div>

            <div id="empId"></div>

        </div>


        <label for="makeupDate">
            補登日期
        </label>


        <input
            type="date"
            id="makeupDate"
        >


        <div class="hint green-hint">
            僅可選擇今天或過去日期，不可選未來日期。
        </div>


        <label for="makeupType">
            補登項目
        </label>


        <select id="makeupType">

            <option value="">
                請選擇...
            </option>

            <option value="中午未休息">
                中午未休息（12:00～13:00）
            </option>

            <option value="下午未休息">
                下午未休息（17:00～17:30）
            </option>

            <option value="提前上班">
                提前上班
            </option>

            <option value="加班(外出)">
                加班（外出）晚回來
            </option>

        </select>


        <div
            id="lunchBlock"
            class="hidden"
        >

            <div class="hint">

                中午休息時間為
                <b>12:00～13:00</b>。

                <br>

                若此時段實際有工作，
                請使用此項補登。

            </div>

        </div>


        <div
            id="afternoonBlock"
            class="hidden"
        >

            <div class="hint">

                下午休息時間為
                <b>17:00～17:30</b>。

                <br>

                若此時段實際有工作，
                請使用此項補登。

            </div>

        </div>


        <div
            id="earlyBlock"
            class="hidden"
        >

            <label>
                實際到班時間
            </label>


            <div class="time-row">

                <select id="earlyHour"></select>

                <span class="colon">:</span>

                <select id="earlyMinute">

                    <option value="00">
                        00 分
                    </option>

                    <option value="30">
                        30 分
                    </option>

                </select>

            </div>


            <div class="hint">

                提前上班可補登
                05:00～07:30。

                <br>

                系統以
                <b>0.5 小時</b>
                為單位計算。

            </div>

        </div>


        <div
            id="overtimeBlock"
            class="hidden"
        >

            <label>
                晚回來時間
            </label>


            <div class="time-row">

                <select id="overtimeHour"></select>

                <span class="colon">:</span>

                <select id="overtimeMinute">

                    <option value="00">
                        00 分
                    </option>

                    <option value="30">
                        30 分
                    </option>

                </select>

            </div>


            <label for="reason">
                事由
            </label>


            <textarea
                id="reason"
                maxlength="200"
                placeholder="例如：送貨、客戶現場處理、外出工作"
            ></textarea>


            <div class="hint">

                若補登日期為今天，
                晚回來時間不得晚於目前時間。

                <br>

                事由請填寫清楚。

            </div>

        </div>


        <button
            id="submitBtn"
            onclick="submitMakeup()"
        >
            送出補登
        </button>


        <div id="statusMsg"></div>


    </div>

</div>



<script>

var APPS_SCRIPT_URL =

var LIFF_ID =

// ==================================================
// 全域資料
// ==================================================

var currentUserId =
    null;


var currentEmpId =
    '';


var currentEmpName =
    '';


var isSubmitting =
    false;



// ==================================================
// 共用
// ==================================================

function pad2(value) {

    return String(value)
        .padStart(
            2,
            '0'
        );

}



function getLocalDateString(date) {

    return (
        date.getFullYear()
        +
        '-'
        +
        pad2(
            date.getMonth() + 1
        )
        +
        '-'
        +
        pad2(
            date.getDate()
        )
    );

}



function buildWorkTimestamp(
    dateString
) {

    var parts =
        dateString.split('-');


    var date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2]),
            12,
            0,
            0,
            0
        );


    return date.getTime();

}



function showStatus(
    message,
    isError
) {

    var el =
        document
            .getElementById(
                'statusMsg'
            );


    el.textContent =
        message;


    el.className =
        isError
            ? 'error'
            : 'success';

}
