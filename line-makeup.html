<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    http-equiv="Cache-Control"
    content="no-cache, no-store, must-revalidate"
>

<meta
    http-equiv="Pragma"
    content="no-cache"
>

<meta
    http-equiv="Expires"
    content="0"
>

<title>宏升工業社 - 補登</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>


<style>

* {
    box-sizing: border-box;
}

body {
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
    margin: 0;
    padding: 20px 16px 60px;
}

h1 {
    font-size: 22px;
    color: #1b2a5e;
    text-align: center;
    margin: 10px 0 4px;
}

.subtitle {
    text-align: center;
    font-size: 15px;
    color: #888;
    margin-bottom: 10px;
}

.version {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    margin-bottom: 14px;
}

.card {
    background: #fff;
    border-radius: 12px;
    border-top: 4px solid #e0752c;
    padding: 24px 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    max-width: 420px;
    margin: 0 auto;
}

#empInfo {
    padding: 13px 14px;
    margin-bottom: 18px;
    background: #eef3fa;
    border-radius: 8px;
    color: #1b2a5e;
    line-height: 1.6;
}

#empName {
    font-size: 19px;
    font-weight: bold;
}

#empId {
    font-size: 14px;
    color: #666;
    margin-top: 3px;
}

label {
    display: block;
    font-size: 15px;
    color: #666;
    margin: 18px 0 6px;
    font-weight: bold;
}

select,
input,
textarea {
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: inherit;
    background: #fff;
    color: #333;
}

textarea {
    min-height: 78px;
    resize: vertical;
}

.time-row {
    display: flex;
    gap: 8px;
    align-items: center;
}

.time-row select {
    flex: 1;
    text-align: center;
}

.colon {
    font-size: 20px;
    font-weight: bold;
}

.hint {
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fff4e8;
    color: #a95416;
    line-height: 1.6;
    font-size: 14px;
}

.green-hint {
    background: #edf7ee;
    color: #1b5e20;
}

.hidden {
    display: none !important;
}

button {
    width: 100%;
    padding: 15px 0;
    font-size: 18px;
    font-weight: bold;
    background: #e0752c;
    color: #fff;
    border: none;
    border-radius: 8px;
    margin-top: 22px;
    cursor: pointer;
}

button:disabled {
    background: #ccc;
    color: #666;
}

#statusMsg {
    text-align: center;
    font-size: 15px;
    line-height: 1.7;
    margin-top: 14px;
    min-height: 22px;
    white-space: pre-line;
}

#statusMsg.error {
    color: #c62828;
}

#statusMsg.success {
    color: #1b5e20;
}

#loading {
    text-align: center;
    padding: 60px 10px;
    color: #888;
    font-size: 16px;
    line-height: 1.8;
}

</style>

</head>


<body>


<div id="loading">
    載入中，請稍候...
</div>


<div
    id="formWrap"
    style="display:none;"
>

<h1>宏升工業社</h1>

<div class="subtitle">
    出勤補登
</div>

<div class="version">
    LINE 員工綁定版
</div>


<div class="card">


<div id="empInfo">

    <div id="empName">
        員工資料載入中...
    </div>

    <div id="empId"></div>

</div>


<label for="makeupDate">
    補登日期
</label>


<input
    type="date"
    id="makeupDate"
>


<div class="hint green-hint">
    僅可選擇今天或過去日期，不可選未來日期。
</div>


<label for="makeupType">
    補登項目
</label>


<select id="makeupType">

    <option value="">
        請選擇...
    </option>

    <option value="中午未休息">
        中午未休息（12:00～13:00）
    </option>

    <option value="下午未休息">
        下午未休息（17:00～17:30）
    </option>

    <option value="提前上班">
        提前上班
    </option>

    <option value="加班(外出)">
        加班（外出）晚回來
    </option>

</select>


<div
    id="lunchBlock"
    class="hidden"
>

    <div class="hint">

        中午休息時間為
        <b>12:00～13:00</b>。

        <br>

        若此時段實際有工作，
        請使用此項補登。

    </div>

</div>


<div
    id="afternoonBlock"
    class="hidden"
>

    <div class="hint">

        下午休息時間為
        <b>17:00～17:30</b>。

        <br>

        若此時段實際有工作，
        請使用此項補登。

    </div>

</div>


<div
    id="earlyBlock"
    class="hidden"
>

<label>
    實際到班時間
</label>


<div class="time-row">

    <select id="earlyHour"></select>

    <span class="colon">:</span>

    <select id="earlyMinute">

        <option value="00">
            00 分
        </option>

        <option value="30">
            30 分
        </option>

    </select>

</div>


<div class="hint">

    提前上班可補登 05:00～07:30。

    <br>

    系統以
    <b>0.5 小時</b>
    為單位計算。

</div>

</div>


<div
    id="overtimeBlock"
    class="hidden"
>

<label>
    晚回來時間
</label>


<div class="time-row">

    <select id="overtimeHour"></select>

    <span class="colon">:</span>

    <select id="overtimeMinute">

        <option value="00">
            00 分
        </option>

        <option value="30">
            30 分
        </option>

    </select>

</div>


<label for="reason">
    事由
</label>


<textarea
    id="reason"
    maxlength="200"
    placeholder="例如：送貨、客戶現場處理、外出工作"
></textarea>


<div class="hint">

    若補登日期為今天，
    晚回來時間不得晚於目前時間。

    <br>

    事由請填寫清楚。

</div>

</div>


<button
    id="submitBtn"
    onclick="submitMakeup()"
>
    送出補登
</button>


<div id="statusMsg"></div>


</div>

</div>



<script>


// ==================================================
// 系統設定
// ==================================================

var APPS_SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec";


var LIFF_ID =
    "2010875519-nrqXot3W";



// ==================================================
// 全域資料
// ==================================================

var currentUserId = null;

var currentEmpId = '';

var currentEmpName = '';

var isSubmitting = false;



// ==================================================
// 共用
// ==================================================

function pad2(value) {

    return String(value)
        .padStart(
            2,
            '0'
        );

}



function getLocalDateString(date) {

    return (
        date.getFullYear()
        +
        '-'
        +
        pad2(
            date.getMonth() + 1
        )
        +
        '-'
        +
        pad2(
            date.getDate()
        )
    );

}



function buildWorkTimestamp(
    dateString
) {

    var parts =
        dateString.split('-');


    var date =
        new Date(
            Number(parts[0]),
            Number(parts[1]) - 1,
            Number(parts[2]),
            12,
            0,
            0,
            0
        );


    return date.getTime();

}



function showStatus(
    message,
    isError
) {

    var el =
        document
            .getElementById(
                'statusMsg'
            );


    el.textContent =
        message;


    el.className =
        isError
            ? 'error'
            : 'success';

}



// ==================================================
// 初始化日期
// ==================================================

function initializeDate() {

    var today =
        getLocalDateString(
            new Date()
        );


    var input =
        document
            .getElementById(
                'makeupDate'
            );


    input.value =
        today;


    input.max =
        today;

}



// ==================================================
// 初始化時間
// ==================================================

function initializeTimeSelects() {

    var earlyHour =
        document
            .getElementById(
                'earlyHour'
            );


    var overtimeHour =
        document
            .getElementById(
                'overtimeHour'
            );


    earlyHour.innerHTML =
        '';


    overtimeHour.innerHTML =
        '';


    for (
        var hour = 5;
        hour <= 7;
        hour++
    ) {

        var value =
            pad2(hour);


        earlyHour.innerHTML +=
            '<option value="' +
            value +
            '">' +
            value +
            ' 時</option>';

    }


    for (
        var otHour = 0;
        otHour <= 23;
        otHour++
    ) {

        var otValue =
            pad2(otHour);


        overtimeHour.innerHTML +=
            '<option value="' +
            otValue +
            '">' +
            otValue +
            ' 時</option>';

    }


    earlyHour.value =
        '07';


    overtimeHour.value =
        '17';

}



// ==================================================
// 補登項目切換
// ==================================================

function handleMakeupTypeChange() {

    var type =
        document
            .getElementById(
                'makeupType'
            )
            .value;


    [
        'lunchBlock',
        'afternoonBlock',
        'earlyBlock',
        'overtimeBlock'

    ].forEach(
        function(id) {

            document
                .getElementById(id)
                .classList
                .add(
                    'hidden'
                );

        }
    );


    if (
        type ===
        '中午未休息'
    ) {

        document
            .getElementById(
                'lunchBlock'
            )
            .classList
            .remove(
                'hidden'
            );

    }


    else if (
        type ===
        '下午未休息'
    ) {

        document
            .getElementById(
                'afternoonBlock'
            )
            .classList
            .remove(
                'hidden'
            );

    }


    else if (
        type ===
        '提前上班'
    ) {

        document
            .getElementById(
                'earlyBlock'
            )
            .classList
            .remove(
                'hidden'
            );

    }


    else if (
        type ===
        '加班(外出)'
    ) {

        document
            .getElementById(
                'overtimeBlock'
            )
            .classList
            .remove(
                'hidden'
            );

    }

}



// ==================================================
// LINE 綁定
// 使用請假 .gs 的 getBoundEmployee
// ==================================================

function fetchBoundEmployee() {

    return fetch(
        APPS_SCRIPT_URL,
        {

            method:
                'POST',

            headers: {

                'Content-Type':
                    'text/plain;charset=utf-8'

            },

            body:
                JSON.stringify({

                    action:
                        'getBoundEmployee',

                    userId:
                        currentUserId

                })

        }
    )


    .then(
        function(response) {

            if (!response.ok) {

                throw new Error(
                    '員工資料連線失敗'
                );

            }


            return response.json();

        }
    )


    .then(
        function(data) {

            if (
                !data ||
                !data.success
            ) {

                throw new Error(
                    data &&
                    data.message
                        ?
                    data.message
                        :
                    '找不到員工綁定資料'
                );

            }


            currentEmpId =
                String(
                    data.empId || ''
                ).trim();


            currentEmpName =
                String(
                    data.name || ''
                ).trim();


            if (
                !currentEmpId ||
                !currentEmpName
            ) {

                throw new Error(
                    '員工綁定資料不完整'
                );

            }


            document
                .getElementById(
                    'empName'
                )
                .textContent =
                    currentEmpName;


            document
                .getElementById(
                    'empId'
                )
                .textContent =
                    '員工編號：' +
                    currentEmpId;

        }
    );

}



// ==================================================
// 呼叫原本打卡 API
// ==================================================

function callPunchApi(
    params
) {

    var query =
        new URLSearchParams();


    query.set(
        'mode',
        'api'
    );


    Object
        .keys(params)
        .forEach(
            function(key) {

                if (
                    params[key] !== undefined &&
                    params[key] !== null &&
                    params[key] !== ''
                ) {

                    query.set(
                        key,
                        params[key]
                    );

                }

            }
        );


    query.set(
        '_',
        Date.now()
    );


    return fetch(
        APPS_SCRIPT_URL +
        '?' +
        query.toString(),
        {

            method:
                'GET',

            cache:
                'no-store'

        }
    )


    .then(
        function(response) {

            if (!response.ok) {

                throw new Error(
                    '補登系統連線失敗'
                );

            }


            return response.json();

        }
    );

}



// ==================================================
// 晚回來時間防呆
// ==================================================

function validateOvertimeTime() {

    var selectedDate =
        document
            .getElementById(
                'makeupDate'
            )
            .value;


    var hour =
        document
            .getElementById(
                'overtimeHour'
            )
            .value;


    var minute =
        document
            .getElementById(
                'overtimeMinute'
            )
            .value;


    var now =
        new Date();


    var today =
        getLocalDateString(
            now
        );


    if (
        selectedDate !==
        today
    ) {

        return {
            valid: true
        };

    }


    var selectedTime =
        new Date(
            now.getFullYear(),
            now.getMonth(),
            now.getDate(),
            Number(hour),
            Number(minute),
            0,
            0
        );


    if (
        selectedTime.getTime() >
        now.getTime()
    ) {

        return {

            valid:
                false,

            message:
                '今天的晚回來時間不可晚於目前時間'

        };

    }


    return {
        valid: true
    };

}



// ==================================================
// 送出補登
// ==================================================

function submitMakeup() {

    if (
        isSubmitting
    ) {

        return;

    }


    var makeupDate =
        document
            .getElementById(
                'makeupDate'
            )
            .value;


    var makeupType =
        document
            .getElementById(
                'makeupType'
            )
            .value;


    if (
        !makeupDate
    ) {

        showStatus(
            '請選擇補登日期',
            true
        );

        return;

    }


    if (
        !makeupType
    ) {

        showStatus(
            '請選擇補登項目',
            true
        );

        return;

    }


    var today =
        getLocalDateString(
            new Date()
        );


    if (
        makeupDate >
        today
    ) {

        showStatus(
            '補登日期不可選未來日期',
            true
        );

        return;

    }


    if (
        !currentEmpId
    ) {

        showStatus(
            '尚未取得員工綁定資料',
            true
        );

        return;

    }


    var workTs =
        buildWorkTimestamp(
            makeupDate
        );


    var reportTs =
        Date.now();


    var params = {

        id:
            currentEmpId,

        ts:
            workTs,

        reportTs:
            reportTs,

        reason:
            makeupType

    };



    // 提前上班

    if (
        makeupType ===
        '提前上班'
    ) {

        var earlyHour =
            document
                .getElementById(
                    'earlyHour'
                )
                .value;


        var earlyMinute =
            document
                .getElementById(
                    'earlyMinute'
                )
                .value;


        params.earlyTime =
            earlyHour +
            ':' +
            earlyMinute;

    }



    // 加班（外出）晚回來

    if (
        makeupType ===
        '加班(外出)'
    ) {

        var timeCheck =
            validateOvertimeTime();


        if (
            !timeCheck.valid
        ) {

            showStatus(
                timeCheck.message,
                true
            );

            return;

        }


        var memo =
            document
                .getElementById(
                    'reason'
                )
                .value
                .trim();


        if (
            !memo
        ) {

            showStatus(
                '請填寫加班（外出）事由',
                true
            );

            return;

        }


        var overtimeTime =
            document
                .getElementById(
                    'overtimeHour'
                )
                .value
            +
            ':'
            +
            document
                .getElementById(
                    'overtimeMinute'
                )
                .value;


        params.overtimeOutMode =
            '晚回來';


        params.overtimeOutTime =
            overtimeTime;


        params.overtimeOutMemo =
            memo;

    }



    var button =
        document
            .getElementById(
                'submitBtn'
            );


    button.disabled =
        true;


    button.innerText =
        '送出中...';


    isSubmitting =
        true;


    showStatus(
        '',
        false
    );


    callPunchApi(
        params
    )


    .then(
        function(data) {

            if (
                !data ||
                data.status !==
                    'success'
            ) {

                throw new Error(
                    data &&
                    data.message
                        ?
                    data.message
                        :
                    '補登失敗'
                );

            }


            var text =
                '✅ 補登成功'
                +
                '\n'
                +
                currentEmpName
                +
                '（'
                +
                currentEmpId
                +
                '）'
                +
                '\n日期：'
                +
                makeupDate
                +
                '\n項目：'
                +
                getMakeupLabel(
                    makeupType
                );


            if (
                makeupType ===
                '提前上班'
            ) {

                text +=
                    '\n實際到班：'
                    +
                    params.earlyTime;

            }


            if (
                makeupType ===
                '加班(外出)'
            ) {

                text +=
                    '\n晚回來：'
                    +
                    params.overtimeOutTime;

            }


            showStatus(
                text,
                false
            );


            button.innerText =
                '補登完成';


            setTimeout(
                function() {

                    closeLiffWindow();

                },
                2200
            );

        }
    )


    .catch(
        function(error) {

            showStatus(
                '⚠️ ' +
                error.message,
                true
            );


            isSubmitting =
                false;


            button.disabled =
                false;


            button.innerText =
                '送出補登';

        }
    );

}



// ==================================================
// 顯示名稱
// ==================================================

function getMakeupLabel(
    type
) {

    if (
        type ===
        '中午未休息'
    ) {

        return '中午未休息（12:00～13:00）';

    }


    if (
        type ===
        '下午未休息'
    ) {

        return '下午未休息（17:00～17:30）';

    }


    if (
        type ===
        '提前上班'
    ) {

        return '提前上班';

    }


    if (
        type ===
        '加班(外出)'
    ) {

        return '加班（外出）晚回來';

    }


    return type;

}



// ==================================================
// 關閉 LIFF
// ==================================================

function closeLiffWindow() {

    try {

        if (
            window.liff &&
            liff.isInClient()
        ) {

            liff.closeWindow();

            return;

        }

    }
    catch(error) {

        console.log(
            error
        );

    }

}



// ==================================================
// LIFF 初始化
// ==================================================

function initializeLiff() {

    initializeDate();

    initializeTimeSelects();


    document
        .getElementById(
            'makeupType'
        )
        .addEventListener(
            'change',
            handleMakeupTypeChange
        );


    liff.init({

        liffId:
            LIFF_ID

    })


    .then(
        function() {

            if (
                !liff.isLoggedIn()
            ) {

                liff.login();

                return null;

            }


            return liff.getProfile();

        }
    )


    .then(
        function(profile) {

            if (
                !profile
            ) {

                return null;

            }


            currentUserId =
                profile.userId;


            return fetchBoundEmployee();

        }
    )


    .then(
        function() {

            if (
                !currentEmpId
            ) {

                return;

            }


            document
                .getElementById(
                    'loading'
                )
                .style
                .display =
                    'none';


            document
                .getElementById(
                    'formWrap'
                )
                .style
                .display =
                    'block';

        }
    )


    .catch(
        function(error) {

            console.error(
                error
            );


            document
                .getElementById(
                    'loading'
                )
                .innerHTML =
                    '⚠️ ' +
                    error.message +
                    '<br><br>' +
                    '請確認 LINE 員工綁定及網路狀態';

        }
    );

}



initializeLiff();


</script>


</body>

</html>
