<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        font-size: 18px;
        background: #f5f5f5;
        color: #333;
        margin: 0;
        padding: 20px 16px 60px;
        box-sizing: border-box;
    }
    h1 {
        font-size: 22px;
        color: #1b2a5e;
        text-align: center;
        margin: 10px 0 4px;
    }
    .subtitle {
        text-align: center;
        font-size: 15px;
        color: #888;
        margin-bottom: 20px;
    }
    .version {
        text-align: center;
        font-size: 13px;
        color: #aaa;
        margin-top: -14px;
        margin-bottom: 16px;
    }
    .card {
        background: white;
        border-radius: 12px;
        border-top: 4px solid #e0752c;
        padding: 24px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        max-width: 420px;
        margin: 0 auto;
    }
    label {
        display: block;
        font-size: 16px;
        color: #666;
        margin: 16px 0 6px;
    }
    label:first-of-type { margin-top: 0; }
    select, input, textarea {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-family: inherit;
        background: #fff;
        color: #333;
    }
    textarea { min-height: 70px; resize: vertical; }

    .datetime-row {
        display: flex;
        gap: 10px;
        align-items: stretch;
    }
    .datetime-row input[type="date"] {
        flex: 1.4;
        min-width: 0;
    }
    .time-selects {
        display: flex;
        flex: 1;
        gap: 6px;
        min-width: 0;
    }
    .time-selects select {
        flex: 1;
        min-width: 0;
        padding: 12px 7px;
        text-align: center;
    }

    #leaveHoursSummary {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef3fa;
        color: #1b2a5e;
        font-size: 17px;
        font-weight: bold;
        line-height: 1.5;
    }
    #leaveHoursSummary.error {
        background: #fff0f0;
        color: #c62828;
    }
    #leaveHoursSummary.valid {
        background: #edf7ee;
        color: #1b5e20;
    }

    .hint {
        font-size: 19px;
        font-weight: bold;
        color: #4f6d92;
        margin-top: 16px;
        line-height: 1.6;
    }
    button {
        width: 100%;
        padding: 15px 0;
        font-size: 19px;
        font-weight: bold;
        background: #e0752c;
        color: white;
        border: none;
        border-radius: 8px;
        margin-top: 22px;
        cursor: pointer;
    }
    button:disabled { background: #ccc; color: #666; }

        text-align: center;
        font-size: 16px;
        margin-top: 14px;
        min-height: 20px;
        white-space: pre-line;
    }
    #statusMsg.error { color: #c62828; }
    #statusMsg.success { color: #1b5e20; }
    #loading {
        text-align: center;
        padding: 60px 0;
        color: #888;
    }
    #backHomeBtn {
        display: block;
        max-width: 420px;
        margin: 16px auto 0;
        padding: 12px 0;
        font-size: 17px;
        font-weight: bold;
        background: #e0e0e0;
        color: #333;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        box-sizing: border-box;
    }
    #backHomeBtn:active { background: #cfcfcf; }

    @media (max-width: 380px) {
        .datetime-row { gap: 7px; }
        .time-selects { gap: 4px; }
        .time-selects select { padding-left: 4px; padding-right: 4px; }
