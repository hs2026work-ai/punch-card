<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>宏升工業社 - 請假申請（一般網頁版）</title>
<style>
    body {
        font-family: "Microsoft JhengHei", Arial, sans-serif;
        font-size: 18px;
        background: #f5f5f5;
        color: #333;
        margin: 0;
        padding: 20px 16px 60px;
        box-sizing: border-box;
    }
    h1 {
        font-size: 22px;
        color: #1b2a5e;
        text-align: center;
        margin: 10px 0 4px;
    }
    .subtitle {
        text-align: center;
        font-size: 15px;
        color: #888;
        margin-bottom: 20px;
    }
    .version {
        text-align: center;
        font-size: 13px;
        color: #aaa;
        margin-top: -14px;
        margin-bottom: 16px;
    }
    .card {
        background: white;
        border-radius: 12px;
        border-top: 4px solid #e0752c;
        padding: 24px 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        max-width: 420px;
        margin: 0 auto;
    }
    label {
        display: block;
        font-size: 16px;
        color: #666;
        margin: 16px 0 6px;
    }
    label:first-of-type { margin-top: 0; }
    select, input, textarea {
        width: 100%;
        padding: 12px;
        font-size: 18px;
        border-radius: 8px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-family: inherit;
        background: #fff;
        color: #333;
    }
    textarea { min-height: 70px; resize: vertical; }

    .datetime-row {
        display: flex;
        gap: 10px;
        align-items: stretch;
    }
    .datetime-row input[type="date"] {
        flex: 1.4;
        min-width: 0;
    }
    .time-selects {
        display: flex;
        flex: 1;
        gap: 6px;
        min-width: 0;
    }
    .time-selects select {
        flex: 1;
        min-width: 0;
        padding: 12px 7px;
        text-align: center;
    }

    #leaveHoursSummary {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 8px;
        background: #eef3fa;
        color: #1b2a5e;
        font-size: 17px;
        font-weight: bold;
        line-height: 1.5;
    }
    #leaveHoursSummary.error {
        background: #fff0f0;
        color: #c62828;
    }
    #leaveHoursSummary.valid {
        background: #edf7ee;
        color: #1b5e20;
    }

    .hint {
        font-size: 19px;
        font-weight: bold;
        color: #4f6d92;
        margin-top: 16px;
        line-height: 1.6;
    }
    button {
        width: 100%;
        padding: 15px 0;
        font-size: 19px;
        font-weight: bold;
        background: #e0752c;
        color: white;
        border: none;
        border-radius: 8px;
        margin-top: 22px;
        cursor: pointer;
    }
    button:disabled { background: #ccc; color: #666; }
    #statusMsg {
        text-align: center;
        font-size: 16px;
        margin-top: 14px;
        min-height: 20px;
        white-space: pre-line;
    }
    #statusMsg.error { color: #c62828; }
    #statusMsg.success { color: #1b5e20; }
    #loading {
        text-align: center;
        padding: 60px 0;
        color: #888;
    }
    #backHomeBtn {
        display: block;
        max-width: 420px;
        margin: 16px auto 0;
        padding: 12px 0;
        font-size: 17px;
        font-weight: bold;
        background: #e0e0e0;
        color: #333;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        box-sizing: border-box;
    }
    #backHomeBtn:active { background: #cfcfcf; }

    @media (max-width: 380px) {
        .datetime-row { gap: 7px; }
        .time-selects { gap: 4px; }
        .time-selects select { padding-left: 4px; padding-right: 4px; }
    }

/* ===== 無操作返回主畫面倒數 ===== */
#idleCountdown {
    max-width: 420px;
    margin: 0 auto 12px;
    padding: 9px 12px;
    box-sizing: border-box;
    border-radius: 8px;
    background: #eef3fa;
    color: #1b2a5e;
    text-align: center;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.45;
}
#idleCountdown.warning {
    background: #fff3e0;
    color: #b85c00;
}

    background: #fff0f0;
    color: #c62828;

</style>
</head>
<body>
<div id="loading">載入中，請稍候...</div>

<div id="formWrap" style="display:none;">
<h1>宏升工業社</h1>
<div class="subtitle">請假申請</div>
        <div class="version">一般網頁版・午休扣除 v3</div>
        <div class="version">一般網頁版・午休扣除 v4</div>

<div id="idleCountdown">⏱️ 60 秒內無操作將自動返回打卡主畫面</div>

<div class="card">
<label for="empId">員工姓名 Họ tên nhân viên</label>
<select id="empId">
<option value="">請選擇...</option>
</select>

<label for="leaveType">假別 Loại nghỉ phép</label>
<select id="leaveType">
<option value="特別假">特別假 Phép đặc biệt</option>
<option value="事假">事假 Nghỉ việc riêng</option>
<option value="病假">病假 Nghỉ ốm</option>
                <option value="請特殊情況時數">請特殊情況時數 Giờ trường hợp đặc biệt</option>
                <option value="公假">公假 Nghỉ phép công vụ</option>
                <option value="家庭照顧假">家庭照顧假 Nghỉ chăm sóc gia đình</option>
                <option value="生理假">生理假 Nghỉ kinh nguyệt</option>
</select>

<label for="startDate">開始日期時間 Ngày giờ bắt đầu</label>
<div class="datetime-row">
<input type="date" id="startDate">
<div class="time-selects">
<select id="startHour" aria-label="開始小時"></select>
<select id="startMinute" aria-label="開始分鐘"></select>
</div>
</div>

<label for="endDate">結束日期時間 Ngày giờ kết thúc</label>
<div class="datetime-row">
<input type="date" id="endDate">
<div class="time-selects">
<select id="endHour" aria-label="結束小時"></select>
<select id="endMinute" aria-label="結束分鐘"></select>
</div>
</div>

<div id="leaveHoursSummary">請假時數：請先選擇完整的開始與結束時間</div>

<label for="reason">事由 Lý do</label>
<textarea id="reason" placeholder="簡述請假原因 / Mô tả ngắn lý do xin nghỉ"></textarea>

<div class="hint">
♦️ 產假／產檢假／陪產假及陪產檢／婚假／喪假，請洽人事，不要用這個表單申請。
Nghỉ thai sản／khám thai／nghỉ khi vợ sinh và khám thai cùng vợ／nghỉ cưới／nghỉ tang, vui lòng liên hệ nhân sự, không dùng biểu mẫu này để xin.
</div>

<button id="submitBtn" onclick="submitForm()">送出申請</button>
<div id="statusMsg"></div>
</div>

<a id="backHomeBtn" href="https://hs2026work-ai.github.io/punch-card/">⬅️ 返回主頁（打卡掃描）</a>
</div>

<script>
var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec";
var currentLeaveHours = null;

// ===== 1 分鐘無操作倒數，自動返回打卡主畫面 =====
var INACTIVITY_SECONDS = 60;
var idleSecondsLeft = INACTIVITY_SECONDS;
var idleInterval = null;
var inactivityPaused = false;
var PUNCH_HOME_URL = "https://hs2026work-ai.github.io/punch-card/";

function returnToPunchHome() {
    try {
        // 若未來此頁被包在其他頁面中，也直接讓最上層回主畫面。
        if (window.top && window.top !== window) {
            window.top.location.replace(PUNCH_HOME_URL);
            return;
        }
    } catch (e) {}
    window.location.replace(PUNCH_HOME_URL);
}

function updateIdleCountdownDisplay() {
    var el = document.getElementById('idleCountdown');
    if (!el) return;

    if (inactivityPaused) {
        el.className = '';
        el.textContent = '⏳ 資料處理中，倒數已暫停';
        return;
    }

    el.className = idleSecondsLeft <= 10 ? 'danger' : (idleSecondsLeft <= 30 ? 'warning' : '');
    el.textContent = '⏱️ ' + idleSecondsLeft + ' 秒內無操作將自動返回打卡主畫面';
}

function resetInactivityTimer() {
    if (inactivityPaused) return;
    idleSecondsLeft = INACTIVITY_SECONDS;
    updateIdleCountdownDisplay();
}

function pauseInactivityTimer() {
    inactivityPaused = true;
    updateIdleCountdownDisplay();
}

function resumeInactivityTimer() {
    inactivityPaused = false;
    resetInactivityTimer();
}

function setupInactivityTimeout() {
    // 只把真正的人為操作算成活動，避免 scroll / focus / pageshow 自己觸發造成倒數一直重置。
    ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'input', 'change'].forEach(function (eventName) {
        document.addEventListener(eventName, resetInactivityTimer, { passive: true });
    });

    resetInactivityTimer();

    if (idleInterval) clearInterval(idleInterval);
    idleInterval = setInterval(function () {
        if (inactivityPaused) return;

        idleSecondsLeft -= 1;
        if (idleSecondsLeft <= 0) {
            idleSecondsLeft = 0;
            updateIdleCountdownDisplay();
            clearInterval(idleInterval);
            idleInterval = null;
            returnToPunchHome();
            return;
        }
        updateIdleCountdownDisplay();
    }, 1000);
}


function pad2(value) {
return String(value).padStart(2, '0');
}

function initializeTimeSelect(hourId, minuteId) {
var hourSelect = document.getElementById(hourId);
var minuteSelect = document.getElementById(minuteId);

hourSelect.innerHTML = '<option value="">時</option>';
for (var h = 0; h <= 23; h++) {
var hour = pad2(h);
hourSelect.innerHTML += '<option value="' + hour + '">' + hour + ' 時</option>';
}

minuteSelect.innerHTML = '<option value="">分</option>';
for (var m = 0; m <= 55; m += 5) {
var minute = pad2(m);
minuteSelect.innerHTML += '<option value="' + minute + '">' + minute + ' 分</option>';
}
}

function initializeTimeSelectors() {
initializeTimeSelect('startHour', 'startMinute');
initializeTimeSelect('endHour', 'endMinute');

['startDate', 'startHour', 'startMinute', 'endDate', 'endHour', 'endMinute'].forEach(function (id) {
document.getElementById(id).addEventListener('change', updateLeaveHoursSummary);
});
}

function loadEmpList() {
fetch(APPS_SCRIPT_URL, {
method: 'POST',
headers: { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify({ action: 'getEmpList' })
})
.then(function (r) { return r.json(); })
.then(function (data) {
var select = document.getElementById('empId');
if (data.success && data.list && data.list.length) {
data.list.forEach(function (emp) {
var opt = document.createElement('option');
opt.value = emp.empId;
opt.dataset.name = emp.name;
opt.textContent = emp.name + '（' + emp.empId + '）';
select.appendChild(opt);
});
} else {
var opt = document.createElement('option');
opt.value = '';
opt.textContent = '員工清單載入失敗，請聯絡管理員';
select.appendChild(opt);
}
})
.catch(function () {
var select = document.getElementById('empId');
var opt = document.createElement('option');
opt.value = '';
opt.textContent = '員工清單載入失敗，請確認網路連線';
select.appendChild(opt);
});
}

function formatDate(value) {
if (!value) return '';
var parts = value.split('-');
return parts[0] + '/' + parts[1] + '/' + parts[2];
}

function buildTime(hourId, minuteId) {
var hour = document.getElementById(hourId).value;
var minute = document.getElementById(minuteId).value;
if (!hour || !minute) return '';
return hour + ':' + minute;
}

function formatTime(value) {
if (!value) return '0000';
return value.replace(':', '');
}

function buildLocalDateTime(dateValue, timeValue) {
if (!dateValue || !timeValue) return null;
var dateParts = dateValue.split('-');
var timeParts = timeValue.split(':');
if (dateParts.length !== 3 || timeParts.length !== 2) return null;

return new Date(
Number(dateParts[0]),
Number(dateParts[1]) - 1,
Number(dateParts[2]),
Number(timeParts[0]),
Number(timeParts[1]),
0,
0
);
}

function formatHours(hours) {
return Number.isInteger(hours) ? String(hours) : hours.toFixed(1);
}

function calculateLunchBreakMinutes(start, end) {
var total = 0;
var cursor = new Date(start.getFullYear(), start.getMonth(), start.getDate(), 0, 0, 0, 0);
var lastDay = new Date(end.getFullYear(), end.getMonth(), end.getDate(), 0, 0, 0, 0);

while (cursor.getTime() <= lastDay.getTime()) {
var lunchStart = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), 12, 0, 0, 0);
var lunchEnd = new Date(cursor.getFullYear(), cursor.getMonth(), cursor.getDate(), 13, 0, 0, 0);
var overlapStart = Math.max(start.getTime(), lunchStart.getTime());
var overlapEnd = Math.min(end.getTime(), lunchEnd.getTime());

if (overlapEnd > overlapStart) {
total += Math.round((overlapEnd - overlapStart) / 60000);
}
cursor.setDate(cursor.getDate() + 1);
}
return total;
}

function calculateLeaveDuration() {
var startDateVal = document.getElementById('startDate').value;
var startTimeVal = buildTime('startHour', 'startMinute');
var endDateVal = document.getElementById('endDate').value;
var endTimeVal = buildTime('endHour', 'endMinute');

if (!startDateVal || !startTimeVal || !endDateVal || !endTimeVal) {
return { complete: false, valid: false };
}

var start = buildLocalDateTime(startDateVal, startTimeVal);
var end = buildLocalDateTime(endDateVal, endTimeVal);
var totalMinutes = Math.round((end.getTime() - start.getTime()) / 60000);

if (totalMinutes <= 0) {
return { complete: true, valid: false, message: '結束日期時間必須晚於開始日期時間' };
}

var lunchMinutes = calculateLunchBreakMinutes(start, end);
var leaveMinutes = totalMinutes - lunchMinutes;

if (leaveMinutes <= 0) {
return {
complete: true,
valid: false,
totalMinutes: totalMinutes,
lunchMinutes: lunchMinutes,
message: '所選時間全部位於 12:00～13:00 午休時段，不計請假時數'
};
}

if (leaveMinutes % 30 !== 0) {
return {
complete: true,
valid: false,
totalMinutes: totalMinutes,
lunchMinutes: lunchMinutes,
minutes: leaveMinutes,
hours: leaveMinutes / 60,
message: '扣除午休後，請假時數須以 0.5 小時為一個單位'
};
}

return {
complete: true,
valid: true,
totalMinutes: totalMinutes,
lunchMinutes: lunchMinutes,
minutes: leaveMinutes,
hours: leaveMinutes / 60
};
}

function updateLeaveHoursSummary() {
var summary = document.getElementById('leaveHoursSummary');
var result = calculateLeaveDuration();
summary.className = '';
currentLeaveHours = null;

if (!result.complete) {
summary.textContent = '請假時數：請先選擇完整的開始與結束時間';
return;
}

if (!result.valid) {
summary.className = 'error';
if (typeof result.hours === 'number' && result.hours > 0) {
summary.textContent = '目前區間：' + result.hours.toFixed(2) + ' 小時；⚠️ ' + result.message;
} else {
summary.textContent = '⚠️ ' + result.message;
}
return;
}

currentLeaveHours = result.hours;
summary.className = 'valid';
summary.textContent = '已選擇請假時數：' + formatHours(result.hours) + ' 小時' +
(result.lunchMinutes > 0
? '（已扣除 12:00～13:00 午休 ' + formatHours(result.lunchMinutes / 60) + ' 小時）'
: '');
}

function showStatus(message, isError) {
var el = document.getElementById('statusMsg');
el.textContent = message;
el.className = isError ? 'error' : 'success';
}

function submitForm() {
var empSelect = document.getElementById('empId');
var empId = empSelect.value;
var empName = empSelect.selectedOptions[0] ? empSelect.selectedOptions[0].dataset.name : '';
var leaveType = document.getElementById('leaveType').value;
var startDateVal = document.getElementById('startDate').value;
var startTimeVal = buildTime('startHour', 'startMinute');
var endDateVal = document.getElementById('endDate').value;
var endTimeVal = buildTime('endHour', 'endMinute');
var reason = document.getElementById('reason').value.trim();

if (!empId || !empName) {
showStatus('請選擇您的姓名', true);
return;
}

if (!startDateVal || !startTimeVal || !endDateVal || !endTimeVal || !reason) {
showStatus('請把「開始日期時間」「結束日期時間」「事由」都填寫完整', true);
return;
}

var duration = calculateLeaveDuration();
if (!duration.valid) {
showStatus(duration.message || '請確認請假日期時間', true);
updateLeaveHoursSummary();
return;
}

var payload = {
action: 'submitLeave',
empId: empId,
empName: empName,
leaveType: leaveType,
startDate: formatDate(startDateVal),
startTime: formatTime(startTimeVal),
endDate: formatDate(endDateVal),
endTime: formatTime(endTimeVal),
leaveHours: duration.hours,
reason: reason
};

var btn = document.getElementById('submitBtn');
pauseInactivityTimer();
btn.disabled = true;
btn.innerText = '送出中...';
showStatus('', false);

fetch(APPS_SCRIPT_URL, {
method: 'POST',
headers: { 'Content-Type': 'text/plain;charset=utf-8' },
body: JSON.stringify(payload)
})
.then(function (r) { return r.json(); })
.then(function (data) {
if (data.success) {
showStatus('✅ ' + data.message + '（共 ' + formatHours(duration.hours) + ' 小時）', false);
btn.innerText = '已送出';
} else {
showStatus('⚠️ ' + data.message, true);
btn.disabled = false;
btn.innerText = '送出申請';
}
resumeInactivityTimer();
})
.catch(function () {
showStatus('⚠️ 連線失敗，請確認網路後再試一次', true);
btn.disabled = false;
btn.innerText = '送出申請';
resumeInactivityTimer();
});
}

initializeTimeSelectors();
document.getElementById('loading').style.display = 'none';
document.getElementById('formWrap').style.display = 'block';
loadEmpList();
setupInactivityTimeout();
</script>
</body>
