<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>請假申請</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;}
#leaveFrame{display:block;width:100%;height:100%;border:0;background:#fff;}
</style>
</head>
<body>
<iframe id="leaveFrame" src="check-leave-form.html" title="請假申請"></iframe>
<script>
(function(){
  var IDLE_MS = 60 * 1000;
  var MAIN_URL = './';
  var timer = null;
  var frame = document.getElementById('leaveFrame');
  var EVENTS = ['pointerdown','touchstart','keydown','input','change','scroll'];

  function goMain(){
    window.top.location.href = MAIN_URL;
  }

  function resetIdle(){
    if (timer) clearTimeout(timer);
    timer = setTimeout(goMain, IDLE_MS);
  }

  function bindActivity(target){
    EVENTS.forEach(function(evt){
      target.addEventListener(evt, resetIdle, true);
    });
  }

  bindActivity(document);

  frame.addEventListener('load', function(){
    try {
      var href = frame.contentWindow.location.href;
      var path = frame.contentWindow.location.pathname || '';
      // 若原請假頁的「返回打卡頁面」是在 iframe 內開啟主頁，直接拉回最外層主畫面。
      if (/\/punch-card\/?$/.test(path) || /\/punch-card\/index\.html$/.test(path)) {
        goMain();
        return;
      }
      bindActivity(frame.contentDocument);
    } catch(e) {
      // 同網域部署時可正常綁定；即使瀏覽器限制，也保留外層 60 秒返回機制。
    }
    resetIdle();
  });

  resetIdle();
})();
</script>
</body>
</html>
