<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宏升工業社 - 請假申請（一般網頁版）</title>
<style>
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Helvetica Neue",Arial,sans-serif;background:#f5f5f5;color:#333;margin:0;padding:20px 16px 60px}
h1{font-size:22px;color:#1b2a5e;text-align:center;margin:10px 0 4px}
.subtitle{text-align:center;font-size:14px;color:#888;margin-bottom:18px}
.version{text-align:center;font-size:11px;color:#aaa;margin-top:-12px;margin-bottom:14px}
.card{background:#fff;border-radius:14px;border-top:4px solid #e0752c;padding:22px 20px;box-shadow:0 2px 10px rgba(0,0,0,.08);max-width:430px;margin:0 auto}
label{display:block;font-size:14px;font-weight:650;color:#555;margin:16px 0 7px}
label:first-of-type{margin-top:0}
select,input,textarea{width:100%;padding:12px;font-size:16px;border-radius:9px;border:1px solid #ccc;font-family:inherit;background:#fff;color:#333}
textarea{min-height:82px;resize:vertical}
.datetime-row{display:flex;gap:10px}.datetime-row input[type=date]{flex:1.35;min-width:0}
.time-selects{display:flex;flex:1;gap:6px;min-width:0}.time-selects select{flex:1;min-width:0;padding:12px 6px;text-align:center}
#leaveHoursSummary{margin-top:10px;padding:10px 12px;border-radius:8px;background:#eef3fa;color:#1b2a5e;font-size:15px;font-weight:700;line-height:1.5}
#leaveHoursSummary.error{background:#fff0f0;color:#c62828}#leaveHoursSummary.valid{background:#edf7ee;color:#1b5e20}
.hint{font-size:14px;font-weight:650;color:#4f6d92;margin-top:16px;line-height:1.7}
button{width:100%;padding:15px 0;font-size:17px;font-weight:750;background:#e0752c;color:#fff;border:0;border-radius:9px;margin-top:22px;cursor:pointer}
button:disabled{background:#ccc;color:#666}
#statusMsg{text-align:center;font-size:14px;margin-top:14px;min-height:20px;white-space:pre-line;line-height:1.6}
#statusMsg.error{color:#c62828}#statusMsg.success{color:#1b5e20}
#loading{text-align:center;padding:60px 0;color:#888}
#backHomeBtn{display:block;max-width:430px;margin:16px auto 0;padding:12px 0;font-size:15px;font-weight:700;background:#e0e0e0;color:#333;text-align:center;text-decoration:none;border-radius:9px}
#idleCountdown{max-width:430px;margin:0 auto 12px;padding:9px 12px;border-radius:8px;background:#eef3fa;color:#1b2a5e;text-align:center;font-size:14px;font-weight:700}
#idleCountdown.warning{background:#fff3e0;color:#b85c00}#idleCountdown.danger{background:#fff0f0;color:#c62828}
#genderHint{font-size:12px;color:#888;margin-top:6px;min-height:18px}
@media(max-width:380px){body{padding-left:10px;padding-right:10px}.card{padding-left:14px;padding-right:14px}.datetime-row{gap:7px}.time-selects{gap:4px}}
</style>
</head>
<body>
<div id="loading">載入中，請稍候...</div>
<div id="formWrap" style="display:none;">
<h1>宏升工業社</h1>
<div class="subtitle">請假申請 / Đơn xin nghỉ phép</div>
<div class="version">一般網頁版・V5</div>
<div id="idleCountdown">⏱️ 60 秒內無操作將自動返回打卡主畫面</div>

<div class="card">
<label for="empId">員工姓名 / Họ tên nhân viên</label>
<select id="empId"><option value="">請選擇...</option></select>
<div id="genderHint"></div>

<label for="leaveType">假別 / Loại nghỉ phép</label>
<select id="leaveType">
<option value="特別假">特別假 / Phép đặc biệt</option>
<option value="事假">事假 / Nghỉ việc riêng</option>
<option value="病假">病假 / Nghỉ ốm</option>
<option value="公假">公假 / Nghỉ phép công vụ</option>
<option value="家庭照顧假">家庭照顧假 / Nghỉ chăm sóc gia đình</option>
<option id="menstrualOption" value="生理假" hidden disabled>生理假 / Nghỉ kinh nguyệt</option>
</select>

<label>開始日期時間 / Ngày giờ bắt đầu</label>
<div class="datetime-row">
<input type="date" id="startDate">
<div class="time-selects"><select id="startHour"></select><select id="startMinute"></select></div>
</div>

<label>結束日期時間 / Ngày giờ kết thúc</label>
<div class="datetime-row">
<input type="date" id="endDate">
<div class="time-selects"><select id="endHour"></select><select id="endMinute"></select></div>
</div>

<div id="leaveHoursSummary">請假時數：請先選擇完整的開始與結束時間</div>

<label for="reason">事由 / Lý do</label>
<textarea id="reason" placeholder="簡述請假原因 / Mô tả ngắn lý do xin nghỉ"></textarea>

<div class="hint">
♦️ 產假／產檢假／陪產檢及陪產假／婚假／喪假，請洽人事，不要用這個表單申請。<br>
Nghỉ thai sản／khám thai／nghỉ khi vợ sinh／nghỉ cưới／nghỉ tang, vui lòng liên hệ nhân sự.
</div>

<button id="submitBtn" onclick="submitForm()">送出申請</button>
<div id="statusMsg"></div>
</div>

<a id="backHomeBtn" href="https://hs2026work-ai.github.io/punch-card/">⬅️ 返回主頁（打卡掃描）</a>
</div>

<script>
var APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec";
var PUNCH_HOME_URL="https://hs2026work-ai.github.io/punch-card/";
var EMP_LIST_CACHE_KEY="hs_web_leave_emp_list_v5";
var EMP_LIST_CACHE_MS=6*60*60*1000;
var INACTIVITY_SECONDS=60,idleSecondsLeft=INACTIVITY_SECONDS,idleInterval=null,inactivityPaused=false,currentLeaveHours=null;

function returnToPunchHome(){try{if(window.top&&window.top!==window){window.top.location.replace(PUNCH_HOME_URL);return}}catch(e){}window.location.replace(PUNCH_HOME_URL)}
function updateIdleCountdownDisplay(){var el=idleCountdown;if(inactivityPaused){el.className='';el.textContent='⏳ 資料處理中，倒數已暫停';return}el.className=idleSecondsLeft<=10?'danger':(idleSecondsLeft<=30?'warning':'');el.textContent='⏱️ '+idleSecondsLeft+' 秒內無操作將自動返回打卡主畫面'}
function resetInactivityTimer(){if(inactivityPaused)return;idleSecondsLeft=INACTIVITY_SECONDS;updateIdleCountdownDisplay()}
function pauseInactivityTimer(){inactivityPaused=true;updateIdleCountdownDisplay()}
function resumeInactivityTimer(){inactivityPaused=false;resetInactivityTimer()}
function setupInactivityTimeout(){['pointerdown','touchstart','mousedown','keydown','input','change'].forEach(function(n){document.addEventListener(n,resetInactivityTimer,{passive:true})});resetInactivityTimer();idleInterval=setInterval(function(){if(inactivityPaused)return;if(--idleSecondsLeft<=0){idleSecondsLeft=0;updateIdleCountdownDisplay();clearInterval(idleInterval);returnToPunchHome();return}updateIdleCountdownDisplay()},1000)}

function pad2(v){return String(v).padStart(2,'0')}
function initTime(hid,mid){var h=document.getElementById(hid),m=document.getElementById(mid);h.innerHTML='<option value="">時</option>';for(var i=0;i<24;i++){var x=pad2(i);h.innerHTML+='<option value="'+x+'">'+x+' 時</option>'}m.innerHTML='<option value="">分</option>';for(var j=0;j<=55;j+=5){var y=pad2(j);m.innerHTML+='<option value="'+y+'">'+y+' 分</option>'}}
function getCachedEmpList(){try{var raw=localStorage.getItem(EMP_LIST_CACHE_KEY);if(!raw)return null;var o=JSON.parse(raw);if(!o||!o.ts||!o.list||Date.now()-o.ts>EMP_LIST_CACHE_MS)return null;return o.list}catch(e){return null}}
function saveCachedEmpList(list){try{localStorage.setItem(EMP_LIST_CACHE_KEY,JSON.stringify({ts:Date.now(),list:list}))}catch(e){}}
function renderEmpList(list){empId.innerHTML='<option value="">請選擇...</option>';list.forEach(function(emp){var o=document.createElement('option');o.value=emp.empId;o.dataset.name=emp.name;o.dataset.gender=emp.gender||'';o.textContent=emp.name+'（'+emp.empId+'）';empId.appendChild(o)})}
function loadEmpList(){var cached=getCachedEmpList();if(cached&&cached.length)renderEmpList(cached);fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getEmpList'})}).then(r=>r.json()).then(function(data){if(data.success&&data.list&&data.list.length){saveCachedEmpList(data.list);renderEmpList(data.list)}else if(!cached)throw new Error()}).catch(function(){if(!cached)empId.innerHTML='<option value="">員工清單載入失敗</option>'})}
function updateGenderUI(){var o=empId.selectedOptions[0],g=o?String(o.dataset.gender||'').trim():'';if(!empId.value){menstrualOption.hidden=true;menstrualOption.disabled=true;genderHint.textContent='';return}if(g==='女'){menstrualOption.hidden=false;menstrualOption.disabled=false;genderHint.textContent='已依假勤管理性別資料顯示女性可申請假別'}else{if(leaveType.value==='生理假')leaveType.value='特別假';menstrualOption.hidden=true;menstrualOption.disabled=true;genderHint.textContent=g==='男'?'已依假勤管理性別資料隱藏生理假':'尚未取得性別資料，生理假暫不顯示'}}

function formatDate(v){if(!v)return'';var p=v.split('-');return p[0]+'/'+p[1]+'/'+p[2]}
function buildTime(h,m){var a=document.getElementById(h).value,b=document.getElementById(m).value;return(!a||!b)?'':a+':'+b}
function formatTime(v){return v?v.replace(':',''):'0000'}
function buildLocalDateTime(d,t){if(!d||!t)return null;var a=d.split('-'),b=t.split(':');return new Date(+a[0],+a[1]-1,+a[2],+b[0],+b[1],0,0)}
function formatHours(h){return Number.isInteger(h)?String(h):Number(h).toFixed(1)}
function calculateLunchBreakMinutes(start,end){var total=0,c=new Date(start.getFullYear(),start.getMonth(),start.getDate()),last=new Date(end.getFullYear(),end.getMonth(),end.getDate());while(c<=last){var ls=new Date(c.getFullYear(),c.getMonth(),c.getDate(),12),le=new Date(c.getFullYear(),c.getMonth(),c.getDate(),13),s=Math.max(start.getTime(),ls.getTime()),e=Math.min(end.getTime(),le.getTime());if(e>s)total+=Math.round((e-s)/60000);c.setDate(c.getDate()+1)}return total}
function calculateLeaveDuration(){var sd=startDate.value,st=buildTime('startHour','startMinute'),ed=endDate.value,et=buildTime('endHour','endMinute');if(!sd||!st||!ed||!et)return{complete:false,valid:false};var s=buildLocalDateTime(sd,st),e=buildLocalDateTime(ed,et),total=Math.round((e-s)/60000);if(total<=0)return{complete:true,valid:false,message:'結束日期時間必須晚於開始日期時間'};var lunch=calculateLunchBreakMinutes(s,e),mins=total-lunch;if(mins<=0)return{complete:true,valid:false,message:'所選時間全部位於 12:00～13:00 午休時段，不計請假時數'};if(mins%30!==0)return{complete:true,valid:false,message:'扣除午休後，請假時數須以 0.5 小時為一個單位'};return{complete:true,valid:true,hours:mins/60,lunchMinutes:lunch}}
function updateLeaveHoursSummary(){var r=calculateLeaveDuration();leaveHoursSummary.className='';currentLeaveHours=null;if(!r.complete){leaveHoursSummary.textContent='請假時數：請先選擇完整的開始與結束時間';return}if(!r.valid){leaveHoursSummary.className='error';leaveHoursSummary.textContent='⚠️ '+r.message;return}currentLeaveHours=r.hours;leaveHoursSummary.className='valid';leaveHoursSummary.textContent='已選擇請假時數：'+formatHours(r.hours)+' 小時'+(r.lunchMinutes>0?'（已扣除午休 '+formatHours(r.lunchMinutes/60)+' 小時）':'')}
function showStatus(msg,err){statusMsg.textContent=msg;statusMsg.className=err?'error':'success'}

function submitForm(){
  var o=empId.selectedOptions[0],eid=empId.value,ename=o?o.dataset.name:'',type=leaveType.value,sd=startDate.value,st=buildTime('startHour','startMinute'),ed=endDate.value,et=buildTime('endHour','endMinute'),reason=document.getElementById('reason').value.trim();
  if(!eid||!ename){showStatus('請選擇您的姓名',true);return}
  if(!sd||!st||!ed||!et||!reason){showStatus('請把「開始日期時間」「結束日期時間」「事由」都填寫完整',true);return}
  var d=calculateLeaveDuration();if(!d.valid){showStatus(d.message||'請確認請假日期時間',true);updateLeaveHoursSummary();return}
  var payload={action:'submitLeave',empId:eid,empName:ename,leaveType:type,startDate:formatDate(sd),startTime:formatTime(st),endDate:formatDate(ed),endTime:formatTime(et),leaveHours:d.hours,reason:reason};
  submitBtn.disabled=true;submitBtn.innerText='送出中...';pauseInactivityTimer();showStatus('',false);
  fetch(APPS_SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
  .then(r=>r.json()).then(function(data){if(data.success){showStatus('✅ '+data.message+'（共 '+formatHours(d.hours)+' 小時）',false);submitBtn.innerText='已送出'}else{showStatus('⚠️ '+data.message,true);submitBtn.disabled=false;submitBtn.innerText='送出申請'}resumeInactivityTimer()})
  .catch(function(){showStatus('⚠️ 連線失敗，請確認網路後再試一次',true);submitBtn.disabled=false;submitBtn.innerText='送出申請';resumeInactivityTimer()});
}

initTime('startHour','startMinute');initTime('endHour','endMinute');
['startDate','startHour','startMinute','endDate','endHour','endMinute'].forEach(id=>document.getElementById(id).addEventListener('change',updateLeaveHoursSummary));
empId.addEventListener('change',updateGenderUI);
loading.style.display='none';formWrap.style.display='block';
loadEmpList();setupInactivityTimeout();
</script>
</body>
</html>
