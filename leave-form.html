<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宏升工業社 - 請假申請</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background: #f5f5f5;
            color: #333;
            margin: 0;
            padding: 20px 16px 60px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 20px;
            color: #1b2a5e;
            text-align: center;
            margin: 10px 0 4px;
        }
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #888;
            margin-bottom: 20px;
        }
        .card {
            background: white;
            border-radius: 12px;
            border-top: 4px solid #e0752c;
            padding: 24px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            max-width: 420px;
            margin: 0 auto;
        }
        label {
            display: block;
            font-size: 14px;
            color: #666;
            margin: 16px 0 6px;
        }
        label:first-of-type { margin-top: 0; }
        select, input, textarea {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: inherit;
            background: #fff;
            color: #333;
        }
        textarea { min-height: 70px; resize: vertical; }

        /* 日期 + 時間 兩個小框並排，取代 datetime-local 原生膠囊樣式 */
        #empNameDisplay {
            font-size: 14px;
            margin-top: 6px;
            min-height: 18px;
        }
        #empNameDisplay.ok { color: #1b5e20; }
        #empNameDisplay.err { color: #c62828; }

        .datetime-row {
            display: flex;
            gap: 10px;
        }
        .datetime-row input {
            flex: 1;
            min-width: 0;
        }
        .datetime-row input[type="date"] {
            flex: 1.4; /* 日期比時間稍寬一點，避免日期被壓縮換行 */
            flex: 1.4;
        }

        .hint {
            font-size: 12px;
            color: #999;
            font-size: 17px;
            font-weight: bold;
            color: #4f6d92;
            margin-top: 16px;
            line-height: 1.6;
        }
        button {
            width: 100%;
            padding: 15px 0;
            font-size: 17px;
            font-weight: bold;
            background: #e0752c;
            color: white;
            border: none;
            border-radius: 8px;
            margin-top: 22px;
            cursor: pointer;
        }
        button:disabled { background: #ccc; color: #666; }
        #statusMsg {
            text-align: center;
            font-size: 14px;
            margin-top: 14px;
            min-height: 20px;
        }
        #statusMsg.error { color: #c62828; }
        #statusMsg.success { color: #1b5e20; }
        #loading {
            text-align: center;
            padding: 60px 0;
            color: #888;
        }
    </style>
</head>
<body>
    <div id="loading">載入中，請稍候...</div>

    <div id="formWrap" style="display:none;">
        <h1>宏升工業社</h1>
        <div class="subtitle">請假申請</div>

        <div class="card">
            <label for="empId">員工編號</label>
            <input type="text" id="empId" placeholder="請輸入員工編號，例如 HS001">
            <div id="empNameDisplay"></div>

            <label for="leaveType">假別</label>
            <select id="leaveType">
                <option value="特別假">特別假</option>
                <option value="事假">事假</option>
                <option value="病假">病假</option>
                <option value="請特殊情況時數">請特殊情況時數</option>
            </select>

            <label for="startDate">開始日期時間</label>
            <div class="datetime-row">
                <input type="date" id="startDate">
                <input type="time" id="startTime">
            </div>

            <label for="endDate">結束日期時間</label>
            <div class="datetime-row">
                <input type="date" id="endDate">
                <input type="time" id="endTime">
            </div>

            <label for="reason">事由</label>
            <textarea id="reason" placeholder="簡述請假原因"></textarea>

            <div class="hint">
                ♦️ 產假／產檢假／陪產假及陪產檢／婚假／喪假，請洽人事，不要用這個表單申請。
            </div>

            <button id="submitBtn" onclick="submitForm()">送出申請</button>
            <div id="statusMsg"></div>
        </div>
    </div>

    <script>
        // ⚠️ 請把下面這行換成你「請假紀錄」Apps Script 專案部署後的 Web App 網址（結尾是 /exec）
        var APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz03a4On-LbR8oI8kRVxdgt2jP9VZMAKAQPKO6igxSm0Bbcc0j8uVbtNAF3_uvIeYYZIw/exec";

        var LIFF_ID = "2010875519-TBex5DN7";
        var currentUserId = null;

        // 把 <input type="date"> 的值 (格式: 2026-07-28) 轉成後端要的 "2026/07/28"
        var lookedUpEmpName = '';
        var empLookupValid = false;

        function formatDate(value) {
            if (!value) return '';
            var parts = value.split('-');
            return parts[0] + '/' + parts[1] + '/' + parts[2];
        }

        // 把 <input type="time"> 的值 (格式: 16:08) 轉成後端要的 "1608"
        function formatTime(value) {
            if (!value) return '0000';
            return value.replace(':', '');
        }

        function showStatus(message, isError) {
            var el = document.getElementById('statusMsg');
            el.textContent = message;
            el.className = isError ? 'error' : 'success';
        }

        function lookupEmpName() {
            var empId = document.getElementById('empId').value.trim();
            var display = document.getElementById('empNameDisplay');

            empLookupValid = false;
            lookedUpEmpName = '';

            if (!empId) {
                display.textContent = '';
                display.className = '';
                return;
            }

            display.textContent = '查詢中...';
            display.className = '';

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ action: 'getEmpName', empId: empId })
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.success) {
                        display.textContent = '✅ ' + data.name;
                        display.className = 'ok';
                        lookedUpEmpName = data.name;
                        empLookupValid = true;
                    } else {
                        display.textContent = '❌ ' + data.message;
                        display.className = 'err';
                    }
                })
                .catch(function () {
                    display.textContent = '查詢失敗，請確認網路連線後再試一次';
                    display.className = 'err';
                });
        }

        function submitForm() {
            var empId = document.getElementById('empId').value.trim();
            var leaveType = document.getElementById('leaveType').value;
            var startDateVal = document.getElementById('startDate').value;
            var startTimeVal = document.getElementById('startTime').value;
            var endDateVal = document.getElementById('endDate').value;
            var endTimeVal = document.getElementById('endTime').value;
            var reason = document.getElementById('reason').value.trim();

            if (!empId || !empLookupValid) {
                showStatus('請輸入正確的員工編號，並確認姓名顯示正常', true);
                return;
            }

            if (!startDateVal || !startTimeVal || !endDateVal || !endTimeVal || !reason) {
                showStatus('請把「開始日期時間」「結束日期時間」「事由」都填寫完整', true);
                return;
            }

            var payload = {
                action: 'submitLeave',
                userId: currentUserId,
                empId: empId,
                empName: lookedUpEmpName,
                leaveType: leaveType,
                startDate: formatDate(startDateVal),
                startTime: formatTime(startTimeVal),
                endDate: formatDate(endDateVal),
                endTime: formatTime(endTimeVal),
                reason: reason
            };

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '送出中...';
            showStatus('', false);

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    if (data.success) {
                        showStatus('✅ ' + data.message, false);
                        setTimeout(function () {
                            if (window.liff && liff.isInClient()) {
                                liff.closeWindow();
                            }
                        }, 1800);
                    } else {
                        showStatus('⚠️ ' + data.message, true);
                        btn.disabled = false;
                        btn.innerText = '送出申請';
                    }
                })
                .catch(function () {
                    showStatus('⚠️ 連線失敗，請確認網路後再試一次', true);
                    btn.disabled = false;
                    btn.innerText = '送出申請';
                });
        }

        document.getElementById('empId').addEventListener('blur', lookupEmpName);

        liff.init({ liffId: LIFF_ID })
            .then(function () {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                return liff.getProfile();
            })
            .then(function (profile) {
                if (!profile) return;
                currentUserId = profile.userId;
                document.getElementById('loading').style.display = 'none';
                document.getElementById('formWrap').style.display = 'block';
            })
            .catch(function (err) {
                document.getElementById('loading').innerText = '載入失敗，請關閉重新從 LINE 對話開啟一次';
            });
    </script>
</body>
</html>
